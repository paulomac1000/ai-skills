schema_version: 3
exclude:
  - .git
  - .venv
  - node_modules
  - vendor
  - dist
  - build
  - benchmarks/afds/generated
required_frontmatter:
  - description
  - doc_id
  - type
  - status
  - rigor
  - owners
  - schema_version
types:
  workflow:
    required_concepts: [prerequisites, steps, validation]
  reference:
    required_concepts: [scope]
  system:
    required_concepts: [boundaries, interfaces, failure]
  guide:
    required_concepts: [audience, outcome]
  decision:
    required_concepts: [context, decision, alternatives, consequences]
  contract:
    required_concepts: [inputs, outputs, errors, compatibility]
