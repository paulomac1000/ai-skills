schema_version: 1
name: afds-doc-writer
version: 1.2.0
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems:
  - linux
  - macos
  - windows
  runtimes:
    python: '>=3.12,<3.15'
  evidence_lanes:
  - python-compatibility
  tested_combinations:
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.13'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.14'
    lane: python-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: windows
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
dependencies:
  skills: []
  tools:
  - python
deprecation:
  policy: semantic-versioning
  minimum_notice: one-minor-release
required:
- SKILL.md
- STANDARD.md
- governance.yaml
- validate.py
- references/ecosystem-readme-governance.md
- templates/governed-document.md.template
categories:
- core
- references
- templates
- tools
contracts:
  frontmatter_schema: contracts/afds-frontmatter.schema.json
  current_document_schema: 2
  legacy_document_schema: 1
  strict_migration_flag: --minimum-document-schema 2
adoption:
  template: contracts/adoption-assessment.yaml.template
  validator: contracts/validate_adoption.py
  rule_catalog: contracts/rule-catalog.yaml
  extension: generic
  rule_map: contracts/standard-rule-map.yaml
