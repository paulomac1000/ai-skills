  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.13'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.14'
    lane: python-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: windows
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
dependencies:
  skills:
  - ci-cd-architect
  tools:
  - python
  shared_resources:
  - contracts/change-acceptance.schema.json
  - contracts/semantic-review-plan.schema.json
  - contracts/diagnostic-egress.schema.json
  - contracts/diagnostic_egress.py
deprecation:
  policy: semantic-versioning
