schema_version: 1
name: qa-change-verifier
version: 3.23.1
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems:
  - linux
  - macos
  - windows
  runtimes:
    python: '>=3.12,<3.15'
  evidence_lanes:
  - python-compatibility
  tested_combinations:
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
