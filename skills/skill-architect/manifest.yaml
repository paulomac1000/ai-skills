schema_version: 1
name: skill-architect
version: 3.13.0
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems:
  - linux
  - macos
  - windows
  runtimes:
    python: '>=3.12,<3.15'
  evidence_lanes:
  - python-compatibility
  tested_combinations:
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.13'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.14'
    lane: python-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: windows
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
dependencies:
  skills: []
  tools:
  - python
  packages:
    python:
    - PyYAML>=6.0.3,<7
    - jsonschema>=4.26,<5
executable_resources:
- id: audit-skill
  resource: tools/audit_skill.py
  kind: agent_cli
  canonical_invocation:
    mode: python_script
    entrypoint: tools/audit_skill.py
  input_contract_ref: null
  outcome_contract:
    mode: structured
    schema_ref: null
  process_semantics:
    exit_code_mapping:
      '0': no-error-findings
      '1': error-findings
      '2': invalid-arguments
    timeout: policy
    cancellation: supported
    safe_stop: supported
  effects:
    class: read_only
    replay_safety: idempotent
    network: none
    credential_class: none
  diagnostics:
    bounded: true
    safe_egress_profile_ref: null
- id: scaffold-skill
  resource: tools/scaffold_skill.py
  kind: agent_cli
  canonical_invocation:
    mode: python_script
    entrypoint: tools/scaffold_skill.py
  input_contract_ref: null
  outcome_contract:
    mode: human_only
    schema_ref: null
  process_semantics:
    exit_code_mapping:
      '0': created
      '2': invalid-input-or-io-failure
    timeout: policy
    cancellation: unsupported
    safe_stop: unsupported
  effects:
    class: local_mutation
    replay_safety: non_replayable
    network: none
    credential_class: none
  diagnostics:
    bounded: true
    safe_egress_profile_ref: null
- id: validate-skill-evals
  resource: tools/validate_skill_evals.py
  kind: agent_cli
  canonical_invocation:
    mode: python_script
    entrypoint: tools/validate_skill_evals.py
  input_contract_ref: null
  outcome_contract:
    mode: structured
    schema_ref: null
  process_semantics:
    exit_code_mapping:
      '0': valid
      '1': findings
      '2': invalid-arguments
    timeout: policy
    cancellation: supported
    safe_stop: supported
  effects:
    class: read_only
    replay_safety: idempotent
    network: none
    credential_class: none
  diagnostics:
    bounded: true
    safe_egress_profile_ref: null
deprecation:
  policy: semantic-versioning
  minimum_notice: one-minor-release
required:
- SKILL.md
- STANDARD.md
- references/admission-and-scope.md
- references/routing-and-context.md
- references/resources-and-composition.md
- references/behavioral-evaluation.md
- references/portability-and-trust.md
- references/upstream-agent-skills-compatibility.md
- references/lifecycle-and-migration.md
- templates/SKILL.md.template
- templates/STANDARD.md.template
- templates/manifest.yaml.template
- schemas/skill-eval.schema.json
- schemas/executable-resource.schema.json
- tools/audit_skill.py
- tools/scaffold_skill.py
- tools/validate_skill_evals.py
categories:
- core
- references
- templates
- schemas
- tools
adoption:
  template: contracts/adoption-assessment.yaml.template
  validator: contracts/validate_adoption.py
  rule_catalog: contracts/rule-catalog.yaml
  extension: generic
  rule_map: contracts/standard-rule-map.yaml
