schema_version: 1
name: skill-architect
version: 3.1.0
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems:
  - linux
  - macos
  - windows
  runtimes:
    python: '>=3.12,<3.15'
  evidence_lanes:
  - python-compatibility
  tested_combinations:
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.13'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.14'
    lane: python-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: windows
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
dependencies:
  skills: []
  tools:
  - python
  packages:
    python:
    - PyYAML>=6.0.3,<7
    - jsonschema>=4.26,<5
deprecation:
  policy: semantic-versioning
  minimum_notice: one-minor-release
required:
- SKILL.md
- STANDARD.md
- references/admission-and-scope.md
- references/routing-and-context.md
- references/resources-and-composition.md
- references/behavioral-evaluation.md
- references/portability-and-trust.md
- references/upstream-agent-skills-compatibility.md
- references/lifecycle-and-migration.md
- templates/SKILL.md.template
- templates/STANDARD.md.template
- templates/manifest.yaml.template
- schemas/skill-eval.schema.json
- tools/audit_skill.py
- tools/scaffold_skill.py
- tools/validate_skill_evals.py
categories:
- core
- references
- templates
- schemas
- tools
adoption:
  template: contracts/adoption-assessment.yaml.template
  validator: contracts/validate_adoption.py
  rule_catalog: contracts/rule-catalog.yaml
  extension: generic
  rule_map: contracts/standard-rule-map.yaml
