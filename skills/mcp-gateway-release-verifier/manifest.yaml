schema_version: 1
name: mcp-gateway-release-verifier
version: 3.33.1
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems:
  - linux
  - macos
  - windows
  runtimes:
    python: '>=3.12,<3.15'
  evidence_lanes:
  - python-compatibility
  tested_combinations:
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.13'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.14'
    lane: python-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: windows
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
dependencies:
  skills:
  - mcp-server-architect
  - ci-cd-architect
  - qa-change-verifier
  tools:
  - python
deprecation:
  policy: semantic-versioning
  minimum_notice: one-minor-release
required:
- SKILL.md
- STANDARD.md
- tools/compose_release_verdict.py
- tools/local_candidate_lane.py
executable_resources:
- id: compose-release-verdict
  resource: tools/compose_release_verdict.py
  kind: library_helper
  canonical_invocation:
    mode: library_api
    entrypoint: compose_release_verdict (compose_release_receipt, compose_release_acceptance)
  input_contract_ref: null
  outcome_contract:
    mode: structured
    schema_ref: null
  process_semantics:
    exit_code_mapping: null
    timeout: policy
    cancellation: not_applicable
    safe_stop: unsupported
  effects:
    class: read_only
    replay_safety: idempotent
    network: none
    credential_class: none
  diagnostics:
    bounded: true
    safe_egress_profile_ref: null
- id: local-candidate-lane
  resource: tools/local_candidate_lane.py
  kind: library_helper
  canonical_invocation:
    mode: library_api
    entrypoint: local_candidate_lane.compose_local_lane_receipt
  input_contract_ref: null
  outcome_contract:
    mode: structured
    schema_ref: null
  process_semantics:
    exit_code_mapping: null
    timeout: policy
    cancellation: not_applicable
    safe_stop: unsupported
  effects:
    class: read_only
    replay_safety: idempotent
    network: none
    credential_class: none
  diagnostics:
    bounded: true
    safe_egress_profile_ref: null
categories:
- core
- tools
adoption:
  template: contracts/adoption-assessment.yaml.template
  validator: contracts/validate_adoption.py
  rule_catalog: contracts/rule-catalog.yaml
  extension: generic
  rule_map: contracts/standard-rule-map.yaml
