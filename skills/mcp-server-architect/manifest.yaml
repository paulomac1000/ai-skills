schema_version: 1
name: mcp-server-architect
version: 1.2.0
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems:
  - linux
  - macos
  - windows
  runtimes:
    python: '>=3.12,<3.15'
    dotnet: 10.0.x
  runtime_scope: compatibility.runtimes describes the ai-skills tools, not every assessed project.
  evidence_lanes:
  - python-compatibility
  - dotnet-compatibility
  - docker-artifact
  tested_combinations:
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.13'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.14'
    lane: python-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: windows
    architecture: x64
    runtime: python
    version: '3.12'
    lane: python-compatibility
  - operating_system: linux
    architecture: x64
    runtime: dotnet
    version: 10.0.302
    lane: dotnet-compatibility
  - operating_system: macos
    architecture: arm64
    runtime: dotnet
    version: 10.0.302
    lane: dotnet-compatibility
  - operating_system: windows
    architecture: x64
    runtime: dotnet
    version: 10.0.302
    lane: dotnet-compatibility
  - operating_system: linux
    architecture: x64
    runtime: python
    version: '3.12'
    lane: docker-artifact
runtime_contract:
  tool_runtime:
    python: '>=3.12,<3.15'
    dotnet: 10.0.x
  assessed_project_runtime:
    python: '>=3.10'
    dotnet: '>=8.0'
  generated_baseline_runtime:
    python: '>=3.12,<3.15'
    dotnet: 10.0.x
  policy: Project runtime eligibility is derived from the selected SDK and required features; tool runtime never becomes an implicit project minimum.
protocol:
  default_revision: '2026-07-28'
  negotiation: explicit
  compatibility_policy: Claims are recorded per SDK profile; one language profile never implies another.
  sdk_profiles:
    python:
      packages:
      - name: mcp
        tested_versions: ['2.0.0']
      supported_revisions: ['2026-07-28', '2025-11-25']
      tested_revisions: []
      current_revision_support: upstream-supported-awaiting-repository-evidence
      verification_required: Test modern server/discover and direct requests plus legacy initialize through the official client before moving a revision into tested_revisions.
    dotnet:
      packages:
      - name: ModelContextProtocol
        tested_versions: ['1.4.1']
      - name: ModelContextProtocol.AspNetCore
        tested_versions: ['1.4.1']
      supported_revisions: []
      tested_revisions: []
      current_revision_support: not-claimed
      upgrade_policy: Remain on the stable SDK lane until a 2.x stable release and protocol evidence are reviewed together.
dependencies:
  skills: []
  tools:
  - python
  - dotnet-sdk
deprecation:
  policy: semantic-versioning
  minimum_notice: one-minor-release
required:
- SKILL.md
- STANDARD.md
- references/migration-assessment.md
- references/protocol-and-sdk-compatibility.md
- references/protocol-2026-07-28.md
- references/multiarch-artifact-promotion.md
- references/principal-and-shell-boundaries.md
- templates/migration-assessment.yaml.template
- tools/generate_python_server.py
- tools/generate_dotnet_server.py
- locks/python-runtime.in
- locks/python-dev.in
categories:
- core
- references
- examples
- templates
- tools
- locks
adoption:
  template: contracts/adoption-assessment.yaml.template
  validator: contracts/validate_adoption.py
  rule_catalog: contracts/rule-catalog.yaml
  extension: mcp
  rule_map: contracts/standard-rule-map.yaml
conformance:
  template: contracts/conformance-report.yaml.template
  validator: contracts/validate_conformance.py
