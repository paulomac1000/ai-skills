schema_version: 1
name: mcp-steward-architect
version: 2.1.0
maturity: stable
skill_format: ai-skills/v1
normative_entrypoint: STANDARD.md
compatibility:
  agent_contract: tool-capable-instruction-agent
  operating_systems: [linux, macos, windows]
  runtimes:
    python: '>=3.12,<3.15'
  runtime_scope: compatibility.runtimes describes the ai-skills tools, not every assessed or generated Steward runtime.
  evidence_lanes: [python-compatibility]
  tested_combinations:
    - {operating_system: linux, architecture: x64, runtime: python, version: '3.12', lane: python-compatibility}
    - {operating_system: linux, architecture: x64, runtime: python, version: '3.13', lane: python-compatibility}
    - {operating_system: linux, architecture: x64, runtime: python, version: '3.14', lane: python-compatibility}
    - {operating_system: macos, architecture: arm64, runtime: python, version: '3.12', lane: python-compatibility}
    - {operating_system: windows, architecture: x64, runtime: python, version: '3.12', lane: python-compatibility}
dependencies:
  skills: [mcp-server-architect, mcp-server-consumer]
  tools: [python]
deprecation:
  policy: semantic-versioning
  minimum_notice: one-minor-release
required:
  - SKILL.md
  - STANDARD.md
  - references/durable-state-and-recovery.md
  - references/external-operations-and-reconciliation.md
  - references/evidence-authority-and-completion.md
  - references/credentials-and-failover.md
  - references/observability-and-diagnostics.md
  - references/testing-strategy.md
  - templates/steward-profile.yaml.template
  - templates/upstream-capability.yaml.template
  - templates/credential-policy.yaml.template
  - templates/proof-recipe.yaml.template
  - tools/validate_steward.py
  - tools/generate_steward.py
categories: [core, references, templates, tools]
applicability:
  derived_flags:
    - long_running_work
    - external_side_effects
    - multiple_workers
    - uses_external_reasoning
    - independent_verification_required
    - sensitive_data_egress
    - provider_failover_enabled
    - multi_instance_runtime
adoption:
  template: contracts/adoption-assessment.yaml.template
  validator: contracts/validate_adoption.py
  rule_catalog: contracts/rule-catalog.yaml
  rule_map: contracts/standard-rule-map.yaml
  atomic_claim_catalog: contracts/atomic-claim-catalog.yaml
  atomic_claim_schema: contracts/atomic-claim-report.schema.json
  atomic_claim_validator: contracts/validate_atomic_claims.py
  evidence_profiles: contracts/evidence-profiles.yaml
  extension: mcp
conformance:
  template: contracts/conformance-report.yaml.template
  validator: contracts/validate_conformance.py
