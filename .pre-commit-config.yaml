repos:
  - repo: local
    hooks:
      - id: validate-skills
        name: Validate governed documentation
        entry: python skills/afds-doc-writer/validate.py README.md skills
        language: system
        pass_filenames: false
      - id: compile-python
        name: Compile Python sources
        entry: python -m compileall -q scripts skills
        language: system
        pass_filenames: false
      - id: repository-tests
        name: Run bounded repository quality gate
        entry: python scripts/ci.py
        language: system
        pass_filenames: false
        stages: [pre-push]
