name: Apply final PR18 runtime review fixes

on:
  push:
    branches:
      - agent/agents-md-architect
    paths:
      - .github/scripts/apply-pr18-runtime-review-fixes.py
      - .github/scripts/fix-pr18-runtime-test-import.py
      - .github/workflows/apply-pr18-runtime-review-fixes.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply-pr18-runtime-review-fixes.py
      - .github/scripts/fix-pr18-runtime-test-import.py
      - .github/workflows/apply-pr18-runtime-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.number == 18
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/agents-md-architect
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Apply reviewed fixes atomically
        run: |
          python .github/scripts/apply-pr18-runtime-review-fixes.py
          python .github/scripts/fix-pr18-runtime-test-import.py
      - name: Format and lint changed Python
        run: |
          python -m ruff check --fix \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_codex_followup.py
          python -m ruff format \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_codex_followup.py
          python -m ruff check \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_codex_followup.py
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_agents_md_codex_followup.py
          tests/test_agents_md_release_contract.py
      - name: Run complete local gate
        run: python scripts/ci.py
      - name: Remove temporary review machinery
        run: |
          git rm .github/scripts/apply-pr18-runtime-review-fixes.py
          git rm .github/scripts/fix-pr18-runtime-test-import.py
          git rm .github/workflows/apply-pr18-runtime-review-fixes.yml
      - name: Verify exact production diff
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain --untracked-files=all | awk '{print $NF}' | sort)" = "$(printf '%s\n' \
            .github/scripts/apply-pr18-runtime-review-fixes.py \
            .github/scripts/fix-pr18-runtime-test-import.py \
            .github/workflows/apply-pr18-runtime-review-fixes.yml \
            CHANGELOG.md \
            skills/agents-md-architect/manifest.yaml \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_codex_followup.py | sort)"
      - name: Commit and push verified fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(agents-md): close runtime review gaps"
          git fetch origin agent/agents-md-architect
          git rebase origin/agent/agents-md-architect
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/agents-md-architect
