name: Format final audited files

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_format-final-files.yml

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock
      - name: Install exact formatter
        run: python -m pip install --require-hashes -r requirements-dev-linux.lock
      - name: Assemble audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-code.patch.part{00..07} > /tmp/final-code.patch.gz.b64
          test "$(wc -c < /tmp/final-code.patch.gz.b64)" -eq 52088
          base64 -d /tmp/final-code.patch.gz.b64 > /tmp/final-code.patch.gz
          printf '%s  %s\n' 99c77e28a69499c8b4f5b7dd9ee5e5452581369496fa05102650ae45f7fd9f4e /tmp/final-code.patch.gz | sha256sum --check --strict
          gzip -dc /tmp/final-code.patch.gz > /tmp/final-code.patch
          git apply --binary /tmp/final-code.patch
      - name: Format with pinned Ruff
        run: >-
          python -m ruff format
          contracts/validate_adoption.py
          skills/mcp-server-architect/tools/generate_python_server.py
      - name: Verify formatting
        run: >-
          python -m ruff format --check
          contracts/validate_adoption.py
          skills/mcp-server-architect/tools/generate_python_server.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: formatted-final-files-${{ github.run_id }}
          path: |
            contracts/validate_adoption.py
            skills/mcp-server-architect/tools/generate_python_server.py
          if-no-files-found: error
          retention-days: 1
