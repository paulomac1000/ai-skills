name: PR18 Final Audit Remediation

on:
  push:
    branches:
      - agent/agents-md-architect

permissions:
  contents: read
  actions: read

concurrency:
  group: pr18-final-audit-remediation
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Apply deterministic remediation
        run: python .github/scripts/pr18_final_audit_fix.py
      - name: Canonically format changed Python
        run: >-
          python -m ruff format
          scripts/quality_targets.py
          skills/agents-md-architect/tools/agents_md_codex_platform.py
          skills/agents-md-architect/tools/agents_md_parse.py
          skills/agents-md-architect/tools/agents_md_shell_evidence.py
          skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
          tests/test_agents_md_codex_followup.py
          tests/test_agents_md_release_contract.py
          tests/test_final_audit_regressions.py
          tests/test_latest_bot_followup.py
      - name: Run focused static checks
        run: |
          python -m ruff check \
            scripts/quality_targets.py \
            skills/agents-md-architect/tools \
            skills/ci-cd-architect/tools \
            tests/test_agents_md_codex_followup.py \
            tests/test_agents_md_release_contract.py \
            tests/test_final_audit_regressions.py \
            tests/test_latest_bot_followup.py
          python -m mypy $(python scripts/quality_targets.py typing)
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_final_audit_regressions.py
          tests/test_agents_md_codex_followup.py
          tests/test_agents_md_release_contract.py
          tests/test_latest_bot_followup.py
          tests/test_ci_quality_scope.py
          tests/test_skill_manifest_contract.py
      - name: Run complete locked gate
        run: python scripts/ci.py
      - name: Stage verified output
        shell: bash
        run: |
          set -euo pipefail
          files=(
            CHANGELOG.md
            scripts/quality_targets.py
            skills/agents-md-architect/tools/agents_md_codex_platform.py
            skills/agents-md-architect/tools/agents_md_parse.py
            skills/agents-md-architect/tools/agents_md_shell_evidence.py
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
            skills/ci-cd-architect/manifest.yaml
            tests/test_agents_md_codex_followup.py
            tests/test_agents_md_release_contract.py
            tests/test_final_audit_regressions.py
            tests/test_latest_bot_followup.py
          )
          rm -rf verified-output
          mkdir verified-output
          for file in "${files[@]}"; do
            mkdir -p "verified-output/$(dirname "$file")"
            cp "$file" "verified-output/$file"
          done
          printf '%s\n' "${files[@]}" > verified-output/files.txt
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('verified-output')
          files = root.joinpath('files.txt').read_text(encoding='utf-8').splitlines()
          lines = []
          for relative in files:
              digest = sha256(root.joinpath(relative).read_bytes()).hexdigest()
              lines.append(f'{digest}  {relative}')
          root.joinpath('SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Upload verified production files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr18-final-audit-output
          path: verified-output
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact verified source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download verified production files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr18-final-audit-output
          path: verified-output
      - name: Verify artifact allowlist and checksums
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path('verified-output')
          expected = {
              'CHANGELOG.md',
              'scripts/quality_targets.py',
              'skills/agents-md-architect/tools/agents_md_codex_platform.py',
              'skills/agents-md-architect/tools/agents_md_parse.py',
              'skills/agents-md-architect/tools/agents_md_shell_evidence.py',
              'skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py',
              'skills/ci-cd-architect/manifest.yaml',
              'tests/test_agents_md_codex_followup.py',
              'tests/test_agents_md_release_contract.py',
              'tests/test_final_audit_regressions.py',
              'tests/test_latest_bot_followup.py',
          }
          listed = set(root.joinpath('files.txt').read_text(encoding='utf-8').splitlines())
          if listed != expected:
              raise SystemExit(f'artifact allowlist mismatch: {sorted(listed ^ expected)}')
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob('*')
              if path.is_file() and path.name not in {'files.txt', 'SHA256SUMS'}
          }
          if actual != expected:
              raise SystemExit(f'artifact file mismatch: {sorted(actual ^ expected)}')
          sums = root.joinpath('SHA256SUMS').read_text(encoding='utf-8').splitlines()
          observed = {}
          for line in sums:
              digest, relative = line.split('  ', 1)
              observed[relative] = digest
          if set(observed) != expected:
              raise SystemExit('checksum allowlist mismatch')
          for relative in sorted(expected):
              digest = sha256(root.joinpath(relative).read_bytes()).hexdigest()
              if digest != observed[relative]:
                  raise SystemExit(f'checksum mismatch: {relative}')
          PY
      - name: Apply only verified files and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            cp "verified-output/$file" "$file"
          done < verified-output/files.txt
          rm -rf verified-output
          rm .github/scripts/pr18_final_audit_fix.py
          rm .github/workflows/pr18-final-audit-remediation.yml
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/scripts/pr18_final_audit_fix.py',
              '.github/workflows/pr18-final-audit-remediation.yml',
              'CHANGELOG.md',
              'scripts/quality_targets.py',
              'skills/agents-md-architect/tools/agents_md_codex_platform.py',
              'skills/agents-md-architect/tools/agents_md_parse.py',
              'skills/agents-md-architect/tools/agents_md_shell_evidence.py',
              'skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py',
              'skills/ci-cd-architect/manifest.yaml',
              'tests/test_agents_md_codex_followup.py',
              'tests/test_agents_md_release_contract.py',
              'tests/test_final_audit_regressions.py',
              'tests/test_latest_bot_followup.py',
          }
          output = subprocess.run(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          actual = {line[3:] for line in output.splitlines() if line}
          if actual != expected:
              raise SystemExit(f'working tree allowlist mismatch: {sorted(actual ^ expected)}')
          PY
      - name: Commit verified remediation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(agents-md): close final audit findings'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/agents-md-architect
