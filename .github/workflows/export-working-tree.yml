name: Export working tree

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact branch head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Archive repository working tree
        shell: bash
        run: tar --exclude=.git -czf /tmp/ai-skills-working-tree.tgz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-skills-working-tree-${{ github.event.pull_request.head.sha }}
          path: /tmp/ai-skills-working-tree.tgz
          retention-days: 1
          if-no-files-found: error
