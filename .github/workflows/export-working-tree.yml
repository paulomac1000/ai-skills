name: Apply audited production-hardening patch

on:
  pull_request:

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify immutable starting revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/refactor/skills-cleanup | cut -f1)" = "$EXPECTED_SHA"
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .audit-patch/head00 .audit-patch/head01 .audit-patch/head02 .audit-patch/head03 \
              .audit-patch/part01 .audit-patch/part02 .audit-patch/part03 \
              .audit-patch/part04 .audit-patch/part05 > /tmp/source.patch.b64
          base64 --decode /tmp/source.patch.b64 | gzip --decompress > /tmp/source.patch
          test "$(sha256sum /tmp/source.patch | cut -d' ' -f1)" = "cce5eb9ce0d368f1cb505f284e58edb7760364af1348dd5b97e51e4773264849"
          git apply --index /tmp/source.patch
      - name: Restore native complete hashed lockfiles
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact_id in 8595360355 8595357719 8595369302; do
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "/tmp/${artifact_id}.zip"
            unzip -oq "/tmp/${artifact_id}.zip" -d .
          done
          for suffix in linux macos windows; do
            test -s "requirements-dev-${suffix}.lock"
            test -s "skills/mcp-server-architect/locks/runtime-${suffix}.lock"
            test -s "skills/mcp-server-architect/locks/dev-${suffix}.lock"
            grep -q -- '--hash=sha256:' "requirements-dev-${suffix}.lock"
            grep -q -- '--hash=sha256:' "skills/mcp-server-architect/locks/runtime-${suffix}.lock"
            grep -q -- '--hash=sha256:' "skills/mcp-server-architect/locks/dev-${suffix}.lock"
          done
          git add requirements-dev-*.lock skills/mcp-server-architect/locks/*.lock
      - name: Remove one-time migration machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .audit-patch
          git rm .github/workflows/export-working-tree.yml
          git rm .github/workflows/generate-locks.yml
          rm -f requirements-dev.txt
          git add -A
      - name: Verify final staged tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --check
          python -m compileall -q contracts scripts skills tests
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Commit final staged tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-skills hardening bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: enforce stable adoption and reproducibility contracts"
      - name: Publish final immutable revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/skills-cleanup | cut -f1)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/refactor/skills-cleanup
