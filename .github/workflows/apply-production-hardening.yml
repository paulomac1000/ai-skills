name: Apply production hardening

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: apply-production-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/skills-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: '10.0.302'
      - name: Install locked development environment
        run: python scripts/install_locked.py
      - name: Apply production hardening
        id: hardening
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/apply_production_hardening.py 2>&1 | tee hardening-diagnostics.txt
      - name: Upload hardening diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hardening-diagnostics-${{ github.run_id }}
          path: hardening-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce hardening result
        if: always()
        env:
          HARDENING_OUTCOME: ${{ steps.hardening.outcome }}
        run: test "$HARDENING_OUTCOME" = success
      - name: Format and lint changed Python
        run: |
          python -m ruff format contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools
          python -m ruff check --fix contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools
      - name: Run complete local production gate
        id: local_gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci.py 2>&1 | tee local-gate-diagnostics.txt
      - name: Upload local gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-gate-diagnostics-${{ github.run_id }}
          path: local-gate-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce local gate result
        if: always()
        env:
          LOCAL_GATE_OUTCOME: ${{ steps.local_gate.outcome }}
        run: test "$LOCAL_GATE_OUTCOME" = success
      - name: Clean transient files and verify implementation tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .coverage hardening-diagnostics.txt local-gate-diagnostics.txt
          git diff --check
          test ! -e .coverage
          test ! -e scripts/apply_production_hardening.py
          test ! -e .github/workflows/apply-production-hardening.yml
          test -z "$(find scripts -maxdepth 1 -name 'apply_payload.part-*' -print -quit)"
      - name: Package verified source changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import tarfile
          from pathlib import Path

          root = Path.cwd()
          changed = [
              item.decode('utf-8')
              for item in subprocess.check_output(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMRT', '-z', 'HEAD']
              ).split(b'\0')
              if item
          ]
          deleted = [
              item.decode('utf-8')
              for item in subprocess.check_output(
                  ['git', 'diff', '--name-only', '--diff-filter=D', '-z', 'HEAD']
              ).split(b'\0')
              if item
          ]
          if not changed and not deleted:
              raise SystemExit('verified change set is empty')
          temp = Path.home() / 'verified-output'
          temp.mkdir(parents=True, exist_ok=True)
          manifest = {'base_revision': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'changed': changed, 'deleted': deleted}
          (temp / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          with tarfile.open(temp / 'files.tar.gz', 'w:gz') as archive:
              for relative in changed:
                  candidate = root / relative
                  if not candidate.is_file() or candidate.is_symlink():
                      raise SystemExit(f'changed path is not a regular file: {relative}')
                  archive.add(candidate, arcname=relative, recursive=False)
          subprocess.run(['git', 'diff', '--binary', 'HEAD'], check=True, stdout=(temp / 'verified.patch').open('wb'))
          subprocess.run(['git', 'diff', '--name-status', 'HEAD'], check=True, stdout=(temp / 'name-status.txt').open('wb'))
          PY
      - name: Upload verified source changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-source-${{ github.run_id }}
          path: |
            ~/verified-output/manifest.json
            ~/verified-output/files.tar.gz
            ~/verified-output/verified.patch
            ~/verified-output/name-status.txt
          if-no-files-found: error
          retention-days: 7
