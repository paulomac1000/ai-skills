name: Apply production hardening

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-production-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/skills-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2
        with:
          dotnet-version: '10.0.302'
      - name: Install locked development environment
        run: python scripts/install_locked.py
      - name: Apply production hardening
        run: python scripts/apply_production_hardening.py
      - name: Format and lint changed Python
        run: |
          python -m ruff format contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools
          python -m ruff check --fix contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools
      - name: Run complete local production gate
        run: python scripts/ci.py
      - name: Prepare non-workflow commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .coverage
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/apply-production-hardening.yml
          git diff --check
          test ! -e .coverage
          test ! -e scripts/apply_production_hardening.py
          test -z "$(find scripts -maxdepth 1 -name 'apply_payload.part-*' -print -quit)"
          git diff --quiet HEAD -- .github/workflows
      - name: Commit verified implementation
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'ai-skills implementation agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden evidence acceptance contracts'
          git push origin "HEAD:${TARGET_BRANCH}"
