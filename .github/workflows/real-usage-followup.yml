# trigger registered workflow after initial branch-only creation
name: Apply real-usage review followups

on:
  push:
    branches:
      - fix/unified-contract-release-hardening
    paths:
      - .github/workflows/real-usage-followup.yml
      - scripts/repair_real_usage_followup.py

permissions:
  contents: write

concurrency:
  group: real-usage-followup
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py313.lock
      - name: Install reviewed dependency graph
        run: python -m pip install --require-hashes -r requirements-dev-linux-x64-py313.lock
      - name: Apply reviewed followups
        run: python scripts/repair_real_usage_followup.py
      - name: Remove temporary repair machinery
        run: git rm -f .github/workflows/real-usage-followup.yml scripts/repair_real_usage_followup.py
      - name: Format and focused regression suite
        run: |
          python -m ruff check --fix contracts scripts skills tests
          python -m ruff format contracts scripts skills tests
          python -m ruff check contracts scripts skills tests
          python -m pytest -q \
            tests/test_real_usage_followup_contracts.py \
            tests/test_field_feedback_regressions.py \
            tests/test_practical_consumer_feedback.py \
            tests/test_consumer_driven_contract_tools.py \
            tests/test_deployment_observation_contract.py \
            tests/test_atomic_claim_contract.py \
            tests/test_adoption_contract.py
      - name: Run full local gate
        run: python scripts/ci.py
      - name: Verify final tree
        run: |
          git diff --check
          test ! -e .github/workflows/real-usage-followup.yml
          test ! -e scripts/repair_real_usage_followup.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "fix: close real-usage contract gaps"
          git push origin HEAD:fix/unified-contract-release-hardening
