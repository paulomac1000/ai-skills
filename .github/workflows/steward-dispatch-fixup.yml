name: Steward dispatch one-shot fixup

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply crash-safe dispatch hardening
        run: python scripts/steward_dispatch_fixup_temp.py
      - name: Commit hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            skills/mcp-steward-architect/tools/steward-templates/dotnet/StewardSeedRuntime.cs.template \
            skills/mcp-steward-architect/tools/steward-templates/dotnet/SmokeProgram.cs.template \
            skills/mcp-steward-architect/tools/steward-templates/python/steward_runtime.py.template \
            skills/mcp-steward-architect/tools/steward-templates/python/test_steward_runtime.py.template
          git commit -m "fix: persist dispatch ambiguity before remote I/O"
          git push origin HEAD:feat/mcp-steward-architect
