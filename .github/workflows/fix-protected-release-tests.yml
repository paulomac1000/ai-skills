name: Fix protected release policy tests

on:
  push:
    branches: [fix/protected-container-release-policy]
    paths:
      - .github/workflows/fix-protected-release-tests.yml

permissions:
  contents: write

concurrency:
  group: fix-protected-release-tests
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/protected-container-release-policy
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/install_locked.py
      - name: Update regression assertion and format Python
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_templates.py')
          text=path.read_text(encoding='utf-8')
          old='    assert "docker push --all-tags" in steps[push_index]["run"]\n'
          new='''    push_script = steps[push_index]["run"]
              assert "docker push --all-tags" not in push_script
              assert 'while IFS= read -r image_tag' in push_script
              assert 'docker push "$image_tag"' in push_script
          '''
          if old not in text:
              raise SystemExit('old template assertion not found')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          python -m ruff format skills/ci-cd-architect/tools/check_github_actions_policy_impl.py tests/test_templates.py tests/test_ci_cd_workflow_policy.py
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/ci-cd-architect/tools/check_github_actions_policy_impl.py tests/test_templates.py tests/test_ci_cd_workflow_policy.py
          git diff --cached --quiet && exit 0
          git commit -m 'test(cicd): require explicit release tag pushes'
          git push origin HEAD:fix/protected-container-release-policy
