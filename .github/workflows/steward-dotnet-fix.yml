name: Steward .NET generator one-shot fix

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Patch generated project content metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("skills/mcp-steward-architect/tools/generate_steward.py")
          text = path.read_text(encoding="utf-8")
          old = '''    <Content Include="steward_profile.json" CopyToOutputDirectory="PreserveNewest" />
              <Content Include="steward_proof_recipe.json" CopyToOutputDirectory="PreserveNewest" />'''
          new = '''    <Content Update="steward_profile.json" CopyToOutputDirectory="PreserveNewest" CopyToPublishDirectory="PreserveNewest" />
              <Content Update="steward_proof_recipe.json" CopyToOutputDirectory="PreserveNewest" CopyToPublishDirectory="PreserveNewest" />'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one Steward content metadata block")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/mcp-steward-architect/tools/generate_steward.py
          git commit -m "fix: copy Steward policy files without duplicate content"
          git push origin HEAD:feat/mcp-steward-architect
