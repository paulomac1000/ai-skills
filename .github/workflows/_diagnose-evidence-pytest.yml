name: Diagnose evidence pytest

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_diagnose-evidence-pytest.yml

permissions:
  contents: read

jobs:
  pytest:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - run: python scripts/install_locked.py
      - name: Verify diagnostic lease
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "0c9464bdb7b76ecdffa2e0afb732e0021d0307c9"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Materialize candidate
        shell: bash
        run: |
          python .github/evidence-audit-patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path("contracts/write_evidence_report.py")
          source = path.read_text(encoding="utf-8")
          path.write_text(source.replace("def _positive(value: int, name: str) -> int:", "def _positive(value: object, name: str) -> int:"), encoding="utf-8", newline="\n")
          PY
          python -m ruff check --fix contracts scripts tests
          python -m ruff format contracts scripts tests
      - name: Run candidate tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -m "not container" 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: evidence-audit-pytest
          path: pytest.log
          if-no-files-found: error
          retention-days: 3
