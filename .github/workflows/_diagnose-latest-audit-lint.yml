name: Diagnose latest audit lint

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_diagnose-latest-audit-lint.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked tools quietly
        shell: bash
        run: python scripts/install_locked.py >/dev/null
      - name: Recreate candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(
              Path(".github/workflows/_apply-latest-audit-fixes.yml").read_text(encoding="utf-8")
          )
          steps = workflow["jobs"]["apply-and-verify"]["steps"]
          script = next(step["run"] for step in steps if step.get("name") == "Apply exact audited patch")
          Path("/tmp/apply.sh").write_text(script, encoding="utf-8", newline="\n")
          PY
          bash /tmp/apply.sh
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_adoption_contract.py")
          source = path.read_text(encoding="utf-8")
          old = '''        "check_run_id": 10_000 + job_id,
                  "revision": REVISION,
                  "workflow_path": ".github/workflows/ci.yml",
          '''
          new = '''        "check_run_id": 10_000 + job_id,
                  "revision": REVISION,
                  "workflow_id": 300,
                  "workflow_path": ".github/workflows/ci.yml",
          '''
          if source.count(old) != 1:
              raise SystemExit("fixture not found exactly once")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          PY
          python -m ruff format \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py >/dev/null
      - name: Show exact Ruff diagnostics
        run: |
          python -m ruff check \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py
