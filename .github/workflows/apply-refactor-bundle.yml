name: Apply refactor bundle

on:
  push:
    branches:
      - refactor/skills-v2-afds-mcp-dotnet
    paths:
      - .refactor/refactor.part.03

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refactor bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .refactor/refactor.part.* | base64 -d > /tmp/refactor.tar.gz
          tar -xzf /tmp/refactor.tar.gz -C .
          rm -rf .refactor
          rm -f .github/workflows/apply-refactor-bundle.yml
          git config user.name "ai-skills-refactor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: rebuild skills around evidence and progressive disclosure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
