name: Format AGENTS.md tools

on:
  pull_request:
    paths:
      - '.github/workflows/_format-agents-md.yml'
      - 'skills/agents-md-architect/tools/**'
      - 'tests/test_agents_md_composition_and_language.py'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Apply canonical formatting
        run: >-
          python -m ruff format
          skills/agents-md-architect/tools/agents_md_parse.py
          skills/agents-md-architect/tools/audit_agents_md.py
          skills/agents-md-architect/tools/discover_repository.py
          skills/agents-md-architect/tools/validate_agents_md.py
          tests/test_agents_md_composition_and_language.py
      - name: Commit formatting result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/agents-md-architect/tools tests/test_agents_md_composition_and_language.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style(agents-md): apply canonical formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
