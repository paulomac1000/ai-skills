name: Format AGENTS.md tools

on:
  pull_request:
    paths:
      - '.github/workflows/_format-agents-md.yml'
      - 'skills/agents-md-architect/tools/**'
      - 'tests/test_agents_md_composition_and_language.py'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Format changed AGENTS.md Python
        run: >-
          python -m ruff format
          skills/agents-md-architect/tools/agents_md_parse.py
          skills/agents-md-architect/tools/audit_agents_md.py
          skills/agents-md-architect/tools/discover_repository.py
          skills/agents-md-architect/tools/validate_agents_md.py
          tests/test_agents_md_composition_and_language.py
      - name: Package formatted files
        run: >-
          tar -czf /tmp/formatted-agents-md.tgz
          skills/agents-md-architect/tools/agents_md_parse.py
          skills/agents-md-architect/tools/audit_agents_md.py
          skills/agents-md-architect/tools/discover_repository.py
          skills/agents-md-architect/tools/validate_agents_md.py
          tests/test_agents_md_composition_and_language.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-agents-md
          path: /tmp/formatted-agents-md.tgz
          if-no-files-found: error
          retention-days: 1
