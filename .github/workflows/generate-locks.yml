name: Generate dependency locks

on:
  pull_request:

permissions:
  contents: read

jobs:
  compile-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux
          - os: macos-latest
            suffix: macos
          - os: windows-latest
            suffix: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install lock compiler
        shell: bash
        run: python -m pip install pip-tools==7.6.0
      - name: Compile complete hashed lock graph
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          python -m piptools compile \
            --generate-hashes --allow-unsafe --strip-extras --resolver=backtracking \
            --output-file "requirements-dev-${SUFFIX}.lock" requirements-dev.in
          python -m piptools compile \
            --generate-hashes --allow-unsafe --strip-extras --resolver=backtracking \
            --output-file "skills/mcp-server-architect/locks/runtime-${SUFFIX}.lock" \
            skills/mcp-server-architect/locks/python-runtime.in
          python -m piptools compile \
            --generate-hashes --allow-unsafe --strip-extras --resolver=backtracking \
            --output-file "skills/mcp-server-architect/locks/dev-${SUFFIX}.lock" \
            skills/mcp-server-architect/locks/python-dev.in
          python -m pip install --require-hashes -r "requirements-dev-${SUFFIX}.lock"
          python -m pip check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-locks-${{ matrix.suffix }}-${{ github.event.pull_request.head.sha }}
          path: |
            requirements-dev-${{ matrix.suffix }}.lock
            skills/mcp-server-architect/locks/runtime-${{ matrix.suffix }}.lock
            skills/mcp-server-architect/locks/dev-${{ matrix.suffix }}.lock
          retention-days: 1
          if-no-files-found: error
