name: Apply Windows portability fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_apply-windows-portability.yml
      - .github/windows-portability.patch

permissions:
  contents: write

jobs:
  windows-regressions:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-windows-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply reviewed portability patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          patch = Path(".github/windows-portability.patch")
          patch.write_bytes(patch.read_bytes().replace(b"\r\n", b"\n"))
          observed = sha256(patch.read_bytes()).hexdigest()
          expected = "b2aa2727d78df8dd3eaae83fe24ed0d77bec2e080aa476904ef297f7312a16ac"
          if observed != expected:
              raise SystemExit(f"patch digest mismatch: {observed}")
          PY
          git apply --check .github/windows-portability.patch
          git apply .github/windows-portability.patch
      - name: Run Windows-specific regression tests
        run: >-
          python -m pytest
          tests/test_post_review_regressions.py::test_dotnet_release_semver_rejects_leading_zeroes_and_empty_identifiers
          tests/test_templates.py::test_dotnet_package_release_uses_direct_nuspec_metadata_and_identity_set
          -q

  linux-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - run: python scripts/install_locked.py
      - name: Apply reviewed portability patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          patch = Path(".github/windows-portability.patch")
          patch.write_bytes(patch.read_bytes().replace(b"\r\n", b"\n"))
          observed = sha256(patch.read_bytes()).hexdigest()
          expected = "b2aa2727d78df8dd3eaae83fe24ed0d77bec2e080aa476904ef297f7312a16ac"
          if observed != expected:
              raise SystemExit(f"patch digest mismatch: {observed}")
          PY
          git apply --check .github/windows-portability.patch
          git apply .github/windows-portability.patch
          git diff --check
      - name: Run complete local gate
        run: python scripts/ci.py

  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: [windows-regressions, linux-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply, format, and commit verified files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          patch = Path(".github/windows-portability.patch")
          patch.write_bytes(patch.read_bytes().replace(b"\r\n", b"\n"))
          observed = sha256(patch.read_bytes()).hexdigest()
          expected = "b2aa2727d78df8dd3eaae83fe24ed0d77bec2e080aa476904ef297f7312a16ac"
          if observed != expected:
              raise SystemExit(f"patch digest mismatch: {observed}")
          PY
          git apply --check .github/windows-portability.patch
          git apply .github/windows-portability.patch
          python -m ruff format tests/test_post_review_regressions.py
          python -m ruff check tests/test_post_review_regressions.py
          python -m ruff format --check tests/test_post_review_regressions.py
          python -m pytest \
            tests/test_post_review_regressions.py::test_dotnet_release_semver_rejects_leading_zeroes_and_empty_identifiers \
            tests/test_templates.py::test_dotnet_package_release_uses_direct_nuspec_metadata_and_identity_set \
            -q
          git add \
            tests/test_post_review_regressions.py \
            skills/ci-cd-architect/templates/dotnet-package.yml.template
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git config user.name ai-skills-audit-bot
          git config user.email ai-skills-audit-bot@users.noreply.github.com
          git commit -m "fix: make release validation portable on Windows"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push \
            --force-with-lease=refs/heads/refactor/skills-cleanup:${PARENT_SHA} \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/refactor/skills-cleanup
