name: Regenerate Locks Temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.lock_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            architecture: x64
            lock_id: linux-x64-py312
          - os: ubuntu-24.04
            python: '3.13'
            architecture: x64
            lock_id: linux-x64-py313
          - os: ubuntu-24.04
            python: '3.14'
            architecture: x64
            lock_id: linux-x64-py314
          - os: macos-15
            python: '3.12'
            architecture: arm64
            lock_id: macos-arm64-py312
          - os: windows-2025
            python: '3.12'
            architecture: x64
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install lock compiler
        run: python -m pip install "pip<26" pip-tools==7.6.0
      - name: Compile target locks
        run: python scripts/compile_locks.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: locks-${{ matrix.lock_id }}
          path: |
            requirements-dev-${{ matrix.lock_id }}.lock
            skills/mcp-server-architect/locks/runtime-${{ matrix.lock_id }}.lock
            skills/mcp-server-architect/locks/dev-${{ matrix.lock_id }}.lock
          if-no-files-found: error
          retention-days: 1
