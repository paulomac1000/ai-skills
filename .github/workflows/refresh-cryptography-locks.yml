name: Refresh cryptography lock artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-locks:
    name: locks (${{ matrix.os }}, py${{ matrix.python-short }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
            python-short: "312"
            platform: linux-x64
          - os: ubuntu-24.04
            python: "3.13"
            python-short: "313"
            platform: linux-x64
          - os: ubuntu-24.04
            python: "3.14"
            python-short: "314"
            platform: linux-x64
          - os: macos-15
            python: "3.12"
            python-short: "312"
            platform: macos-arm64
          - os: windows-2025
            python: "3.12"
            python-short: "312"
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned lock compiler
        run: python -m pip install "pip-tools==7.6.0"
      - name: Refresh root development lock
        shell: bash
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --upgrade-package cryptography \
            --output-file "requirements-dev-${{ matrix.platform }}-py${{ matrix.python-short }}.lock" \
            requirements-dev.in
      - name: Refresh MCP development lock
        shell: bash
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --upgrade-package cryptography \
            --output-file "skills/mcp-server-architect/locks/dev-${{ matrix.platform }}-py${{ matrix.python-short }}.lock" \
            skills/mcp-server-architect/locks/python-dev.in
      - name: Refresh MCP runtime lock
        shell: bash
        run: |
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --upgrade-package cryptography \
            --output-file "skills/mcp-server-architect/locks/runtime-${{ matrix.platform }}-py${{ matrix.python-short }}.lock" \
            skills/mcp-server-architect/locks/python-runtime.in
      - name: Verify selected version
        shell: bash
        run: |
          grep -R "^cryptography==50\.0\.0" \
            "requirements-dev-${{ matrix.platform }}-py${{ matrix.python-short }}.lock" \
            "skills/mcp-server-architect/locks/dev-${{ matrix.platform }}-py${{ matrix.python-short }}.lock" \
            "skills/mcp-server-architect/locks/runtime-${{ matrix.platform }}-py${{ matrix.python-short }}.lock"
      - name: Upload generated locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: locks-${{ matrix.platform }}-py${{ matrix.python-short }}
          path: |
            requirements-dev-${{ matrix.platform }}-py${{ matrix.python-short }}.lock
            skills/mcp-server-architect/locks/dev-${{ matrix.platform }}-py${{ matrix.python-short }}.lock
            skills/mcp-server-architect/locks/runtime-${{ matrix.platform }}-py${{ matrix.python-short }}.lock
          if-no-files-found: error
          retention-days: 1
