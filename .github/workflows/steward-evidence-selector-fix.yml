name: Steward evidence selector repair

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Repair exact Steward evidence selectors
        shell: python
        run: |
          from fnmatch import fnmatchcase
          from pathlib import Path

          path = Path("contracts/evidence-claim-plan.yaml")
          text = path.read_text(encoding="utf-8")
          names = [
              "test_generated_design_pack_is_cross_contract_valid",
              "test_mutation_admission_fails_closed_on_authority_candidate_budget_and_ambiguity",
              "test_production_acceptance_cannot_skip_independent_live_or_exact_full_path",
              "test_completion_resolves_candidate_binding_producer_authority_and_freshness",
              "test_generated_python_runtime_imports_recovers_cancels_and_does_not_hot_poll",
          ]
          for name in names:
              old = f"'tests/test_mcp_steward_architect.py::{name}'"
              new = f"'*test_mcp_steward_architect::{name}'"
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one selector {old}, found {count}")
              text = text.replace(old, new, 1)
              junit_identity = f"tests.test_mcp_steward_architect::{name}"
              if not fnmatchcase(junit_identity, new.strip("'")):
                  raise SystemExit(f"selector {new} does not match representative JUnit identity {junit_identity}")
          path.write_text(text, encoding="utf-8")
      - name: Verify repaired selectors and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("contracts/evidence-claim-plan.yaml").read_text(encoding="utf-8")
          if "tests/test_mcp_steward_architect.py::test_" in text:
              raise SystemExit("old path-style Steward selectors remain")
          expected = [
              "*test_mcp_steward_architect::test_generated_design_pack_is_cross_contract_valid",
              "*test_mcp_steward_architect::test_mutation_admission_fails_closed_on_authority_candidate_budget_and_ambiguity",
              "*test_mcp_steward_architect::test_production_acceptance_cannot_skip_independent_live_or_exact_full_path",
              "*test_mcp_steward_architect::test_completion_resolves_candidate_binding_producer_authority_and_freshness",
              "*test_mcp_steward_architect::test_generated_python_runtime_imports_recovers_cancels_and_does_not_hot_poll",
          ]
          for selector in expected:
              if text.count(selector) != 1:
                  raise SystemExit(f"expected one repaired selector {selector!r}, found {text.count(selector)}")
          PY
          git rm .github/workflows/steward-evidence-selector-fix.yml
      - name: Commit clean repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/evidence-claim-plan.yaml
          git diff --cached --check
          git commit -m "fix(steward): bind evidence claims to JUnit identities"
          git push origin HEAD:feat/mcp-steward-architect
