name: Steward evidence binding repair

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/install_locked.py
      - name: Bind Steward rule claims to validator and runtime regressions
        run: python scripts/_steward_evidence_binding_patch.py
      - name: Validate plan syntax and referenced test names
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          plan = yaml.safe_load(Path('contracts/evidence-claim-plan.yaml').read_text())
          claims = {c['subject']: c for c in plan['profiles']['repository-rules']}
          required = {
              'steward.design.enforced': [
                  'test_generated_design_pack_is_cross_contract_valid',
                  'test_design_pack_rejects_unresolved_capability_profile_ref_and_producer_dimension_drift',
              ],
              'steward.mutation.admitted': [
                  'test_mutation_admission_fails_closed_on_authority_fences_capability_candidate_budget_and_ambiguity',
                  'test_real_dispatch_gate_rejects_capability_drift_and_stale_fence_with_zero_provider_calls',
              ],
              'steward.claim.bound': [
                  'test_completion_resolves_candidate_binding_producer_authority_and_freshness',
                  'test_evidence_promotion_uses_observed_binding_coverage_and_authority_without_minting',
              ],
          }
          source = ''.join(p.read_text() for p in [Path('tests/test_mcp_steward_architect.py'), Path('tests/test_mcp_steward_runtime_security.py')])
          for rule, names in required.items():
              selectors = claims[rule]['selectors']
              for name in names:
                  assert name in source, (rule, name, 'missing test')
                  assert any(name in selector for selector in selectors), (rule, name, selectors)
          PY
          git diff --check
      - name: Remove one-shot machinery and publish evidence bindings
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/_steward_evidence_binding_patch.py .github/workflows/steward-evidence-binding-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(steward): bind rule evidence to enforcement paths"
          git push origin HEAD:feat/mcp-steward-architect
