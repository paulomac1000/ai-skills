name: Publish latest audit fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_publish-latest-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Recreate exact candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(
              Path(".github/workflows/_apply-latest-audit-fixes.yml").read_text(encoding="utf-8")
          )
          steps = workflow["jobs"]["apply-and-verify"]["steps"]
          script = next(step["run"] for step in steps if step.get("name") == "Apply exact audited patch")
          Path("/tmp/apply.sh").write_text(script, encoding="utf-8", newline="\n")
          PY
          bash /tmp/apply.sh
      - name: Complete required workflow identity fixture
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_adoption_contract.py")
          source = path.read_text(encoding="utf-8")
          old = '''        "check_run_id": 10_000 + job_id,
                  "revision": REVISION,
                  "workflow_path": ".github/workflows/ci.yml",
          '''
          new = '''        "check_run_id": 10_000 + job_id,
                  "revision": REVISION,
                  "workflow_id": 300,
                  "workflow_path": ".github/workflows/ci.yml",
          '''
          if source.count(old) != 1:
              raise SystemExit("expected adoption evidence fixture was not found exactly once")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
      - name: Apply pinned Ruff fixes and formatting
        run: |
          python -m ruff check --fix \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py
          python -m ruff format \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py
      - name: Ruff lint
        run: |
          python -m ruff check \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py
      - name: Ruff format check
        run: |
          python -m ruff format --check \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py
      - name: Mypy
        run: python -m mypy contracts/evidence.py contracts/validate_adoption.py
      - name: Targeted regressions
        run: |
          python -m pytest \
            tests/test_evidence_verifier.py \
            tests/test_evidence_hardening.py \
            tests/test_contract_edge_cases.py \
            tests/test_mcp_migration_assessment.py \
            tests/test_adoption_contract.py -q
      - name: Schema and diff checks
        run: |
          python -m json.tool contracts/adoption-assessment.schema.json >/dev/null
          git diff --check
      - name: Publish verified patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git add \
            contracts/evidence.py \
            contracts/validate_adoption.py \
            contracts/adoption-assessment.schema.json \
            contracts/README.md \
            tests/test_adoption_contract.py \
            tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py \
            tests/test_mcp_migration_assessment.py
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git diff --cached --check
          git config user.name ai-skills-audit-bot
          git config user.email ai-skills-audit-bot@users.noreply.github.com
          git commit -m "fix: harden provider evidence boundaries"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push \
            --force-with-lease=refs/heads/refactor/skills-cleanup:${PARENT_SHA} \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/refactor/skills-cleanup
