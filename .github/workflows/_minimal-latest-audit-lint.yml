name: Minimal latest audit lint

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_minimal-latest-audit-lint.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Show exact Ruff diagnostics only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -m venv /tmp/diag
          /tmp/diag/bin/pip install --quiet ruff==0.15.22 PyYAML==6.0.3
          git init --quiet repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "$HEAD_SHA"
          git checkout --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          /tmp/diag/bin/python - <<'PY'
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(
              Path(".github/workflows/_apply-latest-audit-fixes.yml").read_text(encoding="utf-8")
          )
          steps = workflow["jobs"]["apply-and-verify"]["steps"]
          script = next(step["run"] for step in steps if step.get("name") == "Apply exact audited patch")
          Path("/tmp/apply.sh").write_text(script, encoding="utf-8", newline="\n")
          PY
          bash /tmp/apply.sh
          /tmp/diag/bin/python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_adoption_contract.py")
          source = path.read_text(encoding="utf-8")
          old = '''        "check_run_id": 10_000 + job_id,
                  "revision": REVISION,
                  "workflow_path": ".github/workflows/ci.yml",
          '''
          new = '''        "check_run_id": 10_000 + job_id,
                  "revision": REVISION,
                  "workflow_id": 300,
                  "workflow_path": ".github/workflows/ci.yml",
          '''
          if source.count(old) != 1:
              raise SystemExit("fixture not found exactly once")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          PY
          /tmp/diag/bin/ruff format \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py >/dev/null
          /tmp/diag/bin/ruff check \
            contracts/evidence.py contracts/validate_adoption.py \
            tests/test_adoption_contract.py tests/test_contract_edge_cases.py \
            tests/test_evidence_hardening.py tests/test_mcp_migration_assessment.py
