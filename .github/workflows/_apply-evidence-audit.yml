name: Publish verified evidence audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_apply-evidence-audit.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install pinned publisher tools
        run: python scripts/install_locked.py
      - name: Verify publisher lease
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a1a27404f9acd936f4ca2a2e1f17897832aa8e39"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Recreate the already verified candidate
        shell: bash
        run: |
          set -euo pipefail
          python .github/evidence-audit-patch.py
          python - <<'PY'
          from pathlib import Path

          writer = Path("contracts/write_evidence_report.py")
          source = writer.read_text(encoding="utf-8")
          source = source.replace("def _positive(value: int, name: str) -> int:", "def _positive(value: object, name: str) -> int:")
          writer.write_text(source, encoding="utf-8", newline="\n")

          edge = Path("tests/test_contract_edge_cases.py")
          tests = edge.read_text(encoding="utf-8")
          tests = tests.replace('({"state": "APPROVED", "commit_id": SHA}, "no canonical"),', '({"state": "APPROVED", "commit_id": SHA}, "invalid numeric identity"),')
          edge.write_text(tests, encoding="utf-8", newline="\n")
          PY
          python -m ruff check --fix contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools/generate_python_server.py skills/mcp-server-architect/tools/generate_python_server_impl.py skills/mcp-server-architect/tools/generate_dotnet_server.py
          python -m ruff format contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools/generate_python_server.py skills/mcp-server-architect/tools/generate_python_server_impl.py skills/mcp-server-architect/tools/generate_dotnet_server.py
          rm -f .github/workflows/_diagnose-evidence-pytest.yml
          test ! -e .github/evidence-audit-patch.py
          test ! -e .github/workflows/_apply-evidence-audit.yml
          test ! -e .github/workflows/_diagnose-evidence-pytest.yml
          ! find .github -maxdepth 1 -name 'evidence-patch.part*' -print -quit | grep -q .
          git diff --check
      - name: Commit verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: bind adoption evidence to executed checks"
          git rev-parse HEAD | tee final-commit.txt
      - name: Push verified tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          GIT_TRACE=1 GIT_CURL_VERBOSE=1 git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refactor/skills-cleanup 2>&1 | tee push.log
      - name: Upload publisher diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: evidence-audit-publisher
          path: |
            final-commit.txt
            push.log
          if-no-files-found: warn
          retention-days: 3
