name: Apply evidence audit

on:
  push:
    branches: [refactor/skills-cleanup]
    paths:
      - .github/workflows/_apply-evidence-audit.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-evidence-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install complete hashed development graph
        run: python scripts/install_locked.py
      - name: Verify immutable patch input
        shell: bash
        env:
          EXPECTED_PARENT: b45023cbc4ab7c80a871c21d0ccf73a2bfaf224e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f .github/evidence-audit-patch.py
          for index in 00 01 02 03 04 05 06; do
            test -s ".github/evidence-patch.part${index}"
          done
      - name: Apply audited evidence patch
        run: python .github/evidence-audit-patch.py
      - name: Format changed Python
        run: >-
          python -m ruff format
          contracts tests scripts
          skills/afds-doc-writer/validate.py
          skills/mcp-server-consumer/tools
          skills/mcp-server-architect/tools/generate_python_server.py
          skills/mcp-server-architect/tools/generate_python_server_impl.py
          skills/mcp-server-architect/tools/generate_dotnet_server.py
      - name: Run complete local production gate
        run: python scripts/ci.py
      - name: Verify helper cleanup and reviewed scope
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/evidence-audit-patch.py
          test ! -e .github/workflows/_apply-evidence-audit.yml
          ! find .github -maxdepth 1 -name 'evidence-patch.part*' -print -quit | grep -q .
          git diff --check
          git status --short
      - name: Publish verified patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat: bind adoption evidence to executed checks"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refactor/skills-cleanup
