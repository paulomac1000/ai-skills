name: Apply evidence audit

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_apply-evidence-audit.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-evidence-audit-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install complete hashed development graph
        run: python scripts/install_locked.py
      - name: Verify immutable patch input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "be980d59e2cb68c7fe3a5b2942c3dbdb49147f20"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f .github/evidence-audit-patch.py
          for index in 00 01 02 03 04 05 06; do
            test -s ".github/evidence-patch.part${index}"
          done
      - name: Materialize audited candidate
        shell: bash
        run: |
          python .github/evidence-audit-patch.py
          python - <<'PY'
          from pathlib import Path

          writer = Path("contracts/write_evidence_report.py")
          source = writer.read_text(encoding="utf-8")
          old_signature = "def _positive(value: int, name: str) -> int:"
          if source.count(old_signature) != 1:
              raise SystemExit("expected one _positive signature")
          writer.write_text(source.replace(old_signature, "def _positive(value: object, name: str) -> int:"), encoding="utf-8", newline="\n")

          edge = Path("tests/test_contract_edge_cases.py")
          tests = edge.read_text(encoding="utf-8")
          old_case = '({"state": "APPROVED", "commit_id": SHA}, "no canonical"),'
          if tests.count(old_case) != 1:
              raise SystemExit("expected one stale review assertion")
          edge.write_text(tests.replace(old_case, '({"state": "APPROVED", "commit_id": SHA}, "invalid numeric identity"),'), encoding="utf-8", newline="\n")
          PY
          python -m ruff check --fix contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools/generate_python_server.py skills/mcp-server-architect/tools/generate_python_server_impl.py skills/mcp-server-architect/tools/generate_dotnet_server.py
          python -m ruff format contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools/generate_python_server.py skills/mcp-server-architect/tools/generate_python_server_impl.py skills/mcp-server-architect/tools/generate_dotnet_server.py
      - name: Compile and dependency consistency
        run: |
          python -m compileall -q contracts scripts skills
          python -m pip check
      - name: Ruff lint and formatting
        run: |
          python -m ruff check contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools/generate_python_server.py skills/mcp-server-architect/tools/generate_python_server_impl.py skills/mcp-server-architect/tools/generate_dotnet_server.py
          python -m ruff format --check contracts scripts tests skills/afds-doc-writer/validate.py skills/mcp-server-consumer/tools skills/mcp-server-architect/tools/generate_python_server.py skills/mcp-server-architect/tools/generate_python_server_impl.py skills/mcp-server-architect/tools/generate_dotnet_server.py
      - name: Mypy
        run: >-
          python -m mypy
          contracts/semver.py contracts/evidence.py contracts/validate_adoption.py contracts/write_evidence_report.py
          scripts/ci.py scripts/install_locked.py scripts/select_lock.py
          skills/afds-doc-writer/validate.py
          skills/mcp-server-consumer/tools/decision_engine.py
          skills/mcp-server-architect/tools/generate_python_server.py
          skills/mcp-server-architect/tools/generate_python_server_impl.py
          skills/mcp-server-architect/tools/generate_dotnet_server.py
      - name: Security and dependency audit
        run: |
          python -m bandit -q -lll -iii -r contracts scripts skills/afds-doc-writer skills/mcp-server-consumer/tools skills/mcp-server-architect/tools
          python -m pip_audit -r requirements-dev-linux-x64-py312.lock --progress-spinner off
      - name: Governed documentation
        run: python skills/afds-doc-writer/validate.py README.md RECOVERY_AUDIT.md contracts skills
      - name: Repository tests with branch coverage
        run: python -m coverage run --branch -m pytest -q -m "not container"
      - name: Coverage thresholds
        run: |
          python -m coverage report --include='contracts/*.py,skills/afds-doc-writer/*.py,skills/mcp-server-consumer/tools/*.py' --fail-under=80
          python -m coverage report --include='skills/mcp-server-architect/tools/generate_python_server.py,skills/mcp-server-architect/tools/generate_python_server_impl.py,skills/mcp-server-architect/tools/generate_dotnet_server.py' --fail-under=85
          python -m coverage report --include='scripts/*.py' --fail-under=75
      - name: Verify helper cleanup and reviewed scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_diagnose-evidence-pytest.yml
          test ! -e .github/evidence-audit-patch.py
          test ! -e .github/workflows/_apply-evidence-audit.yml
          test ! -e .github/workflows/_diagnose-evidence-pytest.yml
          ! find .github -maxdepth 1 -name 'evidence-patch.part*' -print -quit | grep -q .
          git diff --check
          git status --short
      - name: Publish verified patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "feat: bind adoption evidence to executed checks"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refactor/skills-cleanup
