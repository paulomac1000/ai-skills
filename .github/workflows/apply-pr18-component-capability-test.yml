name: Apply PR18 component capability test fix

on:
  push:
    branches:
      - agent/agents-md-architect
    paths:
      - .github/scripts/fix-pr18-component-capability-test.py
      - .github/workflows/apply-pr18-component-capability-test.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/fix-pr18-component-capability-test.py
      - .github/workflows/apply-pr18-component-capability-test.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.number == 18
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/agents-md-architect
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Apply test fix
        run: python .github/scripts/fix-pr18-component-capability-test.py
      - name: Format and lint changed test
        run: |
          python -m ruff check --fix tests/test_agents_md_codex_followup.py
          python -m ruff format tests/test_agents_md_codex_followup.py
          python -m ruff check tests/test_agents_md_codex_followup.py
      - name: Run focused regression
        run: >-
          python -m pytest -q
          tests/test_agents_md_codex_followup.py::test_bounded_reader_requests_only_limit_plus_one
      - name: Run complete local gate
        run: python scripts/ci.py
      - name: Remove temporary review machinery
        run: |
          git rm .github/scripts/fix-pr18-component-capability-test.py
          git rm .github/workflows/apply-pr18-component-capability-test.yml
      - name: Verify exact production diff
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain --untracked-files=all | awk '{print $NF}' | sort)" = "$(printf '%s\n' \
            .github/scripts/fix-pr18-component-capability-test.py \
            .github/workflows/apply-pr18-component-capability-test.yml \
            tests/test_agents_md_codex_followup.py | sort)"
      - name: Commit and push verified fix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "test(agents-md): preserve component capability path"
          git fetch origin agent/agents-md-architect
          git rebase origin/agent/agents-md-architect
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:agent/agents-md-architect
