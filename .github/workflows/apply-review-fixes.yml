name: Apply audited review fixes

# One-shot bootstrap. The verified fix commit deletes this workflow.
on:
  push:
    branches: [refactor/skills-cleanup]
    paths:
      - .github/workflows/apply-review-fixes.yml
      - scripts/.apply_review_fixes.py.gz.b64

permissions:
  contents: write

concurrency:
  group: apply-audited-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/skills-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install deterministic dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Decode and apply exact reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/.apply_review_fixes.py.gz.b64 | gzip --decompress > /tmp/apply_review_fixes.py
          python /tmp/apply_review_fixes.py
      - name: Compile and validate documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts skills tests
          python skills/afds-doc-writer/validate.py README.md RECOVERY_AUDIT.md skills
      - name: Run affected regression suites
        run: >-
          python -m pytest -q
          tests/test_templates.py
          tests/test_decision_engine.py
          tests/test_mcp_generator.py
          tests/test_mcp_dotnet_generator.py
          tests/test_mcp_migration_standard.py
      - name: Run complete repository suite
        run: python -m pytest -q
      - name: Verify clean patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/workflows/apply-review-fixes.yml scripts/.apply_review_fixes.py.gz.b64
          git diff --check
      - name: Commit verified fixes to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "fix: harden generators, response handling, and release safety"
          git push origin HEAD:refactor/skills-cleanup
