name: Diagnose Windows portability regression

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_diagnose-windows-portability.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-windows-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply reviewed portability patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          patch = Path(".github/windows-portability.patch")
          patch.write_bytes(patch.read_bytes().replace(b"\r\n", b"\n"))
          observed = sha256(patch.read_bytes()).hexdigest()
          expected = "b2aa2727d78df8dd3eaae83fe24ed0d77bec2e080aa476904ef297f7312a16ac"
          if observed != expected:
              raise SystemExit(f"patch digest mismatch: {observed}")
          PY
          git apply .github/windows-portability.patch
      - name: Record Bash identity
        shell: pwsh
        run: |
          Get-Command bash | Format-List * | Out-File bash-identity.txt
          bash --version | Out-File -Append bash-identity.txt
      - name: Run regression tests with JUnit
        id: regression
        continue-on-error: true
        run: >-
          python -m pytest
          tests/test_post_review_regressions.py::test_dotnet_release_semver_rejects_leading_zeroes_and_empty_identifiers
          tests/test_templates.py::test_dotnet_package_release_uses_direct_nuspec_metadata_and_identity_set
          --junitxml=windows-portability.xml
          -vv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        if: always()
        with:
          name: windows-portability-diagnostics-${{ github.run_id }}
          path: |
            windows-portability.xml
            bash-identity.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce regression result
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: if ($env:REGRESSION_OUTCOME -ne "success") { exit 1 }
