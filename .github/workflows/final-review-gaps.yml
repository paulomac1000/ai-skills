# disposable exact-head repair; deleted by the resulting commit
name: Final trust evidence review gaps

on:
  push:
    branches:
      - fix/unified-contract-release-hardening
    paths:
      - .github/workflows/final-review-gaps.yml
      - scripts/repair_final_review_gaps.py

permissions:
  contents: write

concurrency:
  group: final-review-gaps
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py313.lock
      - name: Install reviewed dependency graph
        run: python -m pip install --require-hashes -r requirements-dev-linux-x64-py313.lock
      - name: Apply final review fixes
        run: python scripts/repair_final_review_gaps.py
      - name: Remove temporary repair machinery
        run: git rm -f .github/workflows/final-review-gaps.yml scripts/repair_final_review_gaps.py
      - name: Format and focused regressions
        run: |
          python -m ruff check --fix contracts scripts skills tests
          python -m ruff format contracts scripts skills tests
          python -m ruff check contracts scripts skills tests
          python -m pytest -q tests/test_final_review_gaps.py tests/test_real_usage_hardening.py tests/test_run_evidence_command.py
      - name: Run full local gate
        run: python scripts/ci.py
      - name: Verify final tree
        run: |
          git diff --check
          test ! -e .github/workflows/final-review-gaps.yml
          test ! -e scripts/repair_final_review_gaps.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "fix: bind evidence execution and release trust"
          git push origin HEAD:fix/unified-contract-release-hardening
