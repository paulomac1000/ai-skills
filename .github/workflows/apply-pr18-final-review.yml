name: Apply PR18 final review fixes

on:
  push:
    branches:
      - agent/agents-md-architect
    paths:
      - .github/scripts/pr18_review/**
      - .github/workflows/apply-pr18-final-review.yml

permissions:
  contents: write

concurrency:
  group: apply-pr18-final-review
  cancel-in-progress: false

# This workflow is intentionally self-removing after the production gate passes.
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install locked development graph
        run: python scripts/install_locked.py

      - name: Apply readable atomic transformation
        env:
          PYTHONPATH: .github/scripts
        run: python -m pr18_review.apply

      - name: Format changed Python
        run: |
          python -m ruff format \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/validate_agents_md.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/agents-md-architect/tools/discover_repository.py \
            tests/test_agents_md_review_regressions.py \
            tests/test_agents_md_codex_followup.py

      - name: Lint changed Python
        run: |
          python -m ruff check \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/validate_agents_md.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/agents-md-architect/tools/discover_repository.py \
            tests/test_agents_md_review_regressions.py \
            tests/test_agents_md_codex_followup.py

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_agents_md_codex_followup.py \
            tests/test_agents_md_review_regressions.py \
            tests/test_agents_md_validator.py \
            tests/test_agents_md_audit.py

      - name: Remove temporary review machinery
        run: |
          rm -rf .github/scripts/pr18_review
          rm -f .github/workflows/apply-pr18-final-review.yml

      - name: Execute complete repository gate
        run: python scripts/ci.py

      - name: Verify final diff
        run: |
          git diff --check
          test ! -e .github/scripts/pr18_review
          test ! -e .github/workflows/apply-pr18-final-review.yml
          git status --short

      - name: Commit verified production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(agents-md): address final reviewer findings"
          git push origin HEAD:agent/agents-md-architect
