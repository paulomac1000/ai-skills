name: Apply quality fixes v3

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-linux.lock
      - name: Apply reviewed functional fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/quality-fix.yml').read_text(encoding='utf-8')
          payload = source.split("cat > /tmp/fix.b64 <<'EOF'\n", 1)[1].split("\n          EOF", 1)[0]
          Path('/tmp/fix.b64').write_text(
              '\n'.join(line.removeprefix('          ') for line in payload.splitlines()) + '\n',
              encoding='utf-8',
          )
          PY
          base64 --decode /tmp/fix.b64 | gzip --decompress > /tmp/fix.patch
          test "$(sha256sum /tmp/fix.patch | cut -d' ' -f1)" = "15487b58e73d42b6fdd367b4840ebc479039bf3cc3c8f659d0a6aa8cad83a1e4"
          git apply /tmp/fix.patch
          python - <<'PY'
          from pathlib import Path

          validator = Path('contracts/validate_adoption.py')
          text = validator.read_text(encoding='utf-8')
          old = '''try:\n    from contracts.semver import is_semver\nexcept ModuleNotFoundError:\n    from semver import is_semver\n\nROOT = Path(__file__).resolve().parents[1]\n'''
          new = '''ROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\n# Direct script execution needs the repository root before the package import.\nfrom contracts.semver import is_semver  # noqa: E402\n'''
          if text.count(old) != 1:
              raise RuntimeError('unexpected SemVer import bootstrap shape')
          validator.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_mcp_generator.py')
          text = test.read_text(encoding='utf-8')
          old = 'parameters = StdioServerParameters(command="docker", args=["run", "--rm", image])'
          new = 'parameters = StdioServerParameters(command="docker", args=["run", "--rm", "-i", image])'
          if text.count(old) != 1:
              raise RuntimeError('unexpected Docker stdio invocation shape')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install complete hashed development graph
        run: python scripts/install_locked.py
      - name: Apply safe Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix contracts scripts \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            tests/test_mcp_generator.py
          python -m ruff format contracts scripts \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            tests/test_mcp_generator.py
      - name: Verify quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check contracts scripts \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            tests/test_mcp_generator.py
          python -m ruff format --check contracts scripts \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            tests/test_mcp_generator.py
          python -m mypy contracts/semver.py contracts/validate_adoption.py \
            scripts/ci.py scripts/install_locked.py scripts/select_lock.py \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools/decision_engine.py \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py
      - name: Run focused regression suite
        run: >-
          python -m pytest
          tests/test_adoption_contract.py
          tests/test_semver_contract.py
          tests/test_mcp_generator.py::test_generator_emits_complete_deterministic_project
          tests/test_mcp_generator.py::test_generator_concurrent_create_has_one_winner_and_never_replaces
          -vv
      - name: Run generated container smoke
        shell: bash
        run: >-
          python -m pytest tests/test_mcp_generator.py -m container -vv
      - name: Create clean final commit object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/quality-fix.yml \
            .github/workflows/quality-fix-v2.yml \
            .github/workflows/quality-fix-v3.yml
          git add contracts scripts skills tests/test_mcp_generator.py
          git diff --cached --check
          git config user.name "ai-skills hardening bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close final quality and artifact gaps"
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          parent = os.environ['PARENT_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()
          def post(endpoint: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{endpoint}',
                  data=json.dumps(payload).encode(),
                  method='POST',
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          raw = subprocess.check_output(
              ['git', 'diff', '--name-status', '-z', '--no-renames', parent, 'HEAD']
          )
          fields = raw.split(b'\0')
          if fields and fields[-1] == b'':
              fields.pop()
          entries = []
          for index in range(0, len(fields), 2):
              status = fields[index].decode()
              path = fields[index + 1].decode()
              if status.startswith('D'):
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              content = base64.b64encode(Path(path).read_bytes()).decode()
              blob = post('/git/blobs', {'content': content, 'encoding': 'base64'})['sha']
              mode = git('ls-files', '-s', '--', path).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'sha': blob})
          base_tree = git('rev-parse', f'{parent}^{{tree}}')
          tree = post('/git/trees', {'base_tree': base_tree, 'tree': entries})['sha']
          expected = git('rev-parse', 'HEAD^{tree}')
          if tree != expected:
              raise RuntimeError(f'tree mismatch: API={tree} local={expected}')
          commit = post('/git/commits', {
              'message': 'fix: close final quality and artifact gaps',
              'tree': tree,
              'parents': [parent],
          })['sha']
          Path('/tmp/final-sha.txt').write_text(commit + '\n', encoding='utf-8')
          print(f'FINAL_SHA={commit}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-fix-v3-final-sha-${{ github.run_id }}
          path: /tmp/final-sha.txt
          if-no-files-found: error
          retention-days: 1
