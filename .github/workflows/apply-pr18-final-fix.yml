name: Apply PR18 final fix

on:
  push:
    branches:
      - agent/agents-md-architect

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/pr18-final-fix/part-*.patch > "$RUNNER_TEMP/fix.patch"
          echo "c4358faf9d2f83a83b68a88f53d8361c98da437127bcb28078ed8fc29b65ddc3  $RUNNER_TEMP/fix.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"
          rm -rf .tmp/pr18-final-fix .github/workflows/apply-pr18-final-fix.yml
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Run focused AGENTS.md checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q skills/agents-md-architect/tools
          python -m ruff check \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/agents_md_completion_evidence.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_command_argv.py \
            tests/test_agents_md_latest_review.py \
            tests/test_agents_md_release_contract.py \
            tests/test_agents_md_validator.py
          python -m ruff format --check \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/agents_md_completion_evidence.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_command_argv.py \
            tests/test_agents_md_latest_review.py \
            tests/test_agents_md_release_contract.py \
            tests/test_agents_md_validator.py
          python -m pytest -q tests/test_agents_md*.py
          python skills/agents-md-architect/tools/validate_agents_md.py \
            --strict --repository-root . --layout single --profile application --language en AGENTS.md
          python skills/agents-md-architect/tools/audit_agents_md.py \
            --strict --layout single --profile application --language en .
      - name: Verify exact final diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git status --porcelain --untracked-files=all | sed 's/^...//' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/apply-pr18-final-fix.yml \
            .github/workflows/export-source-temp.yml \
            .tmp/pr18-final-fix/part-00.patch \
            .tmp/pr18-final-fix/part-01.patch \
            .tmp/pr18-final-fix/part-02.patch \
            .tmp/pr18-final-fix/part-03.patch \
            CHANGELOG.md \
            skills/agents-md-architect/STANDARD.md \
            skills/agents-md-architect/tools/agents_md_completion_evidence.py \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_command_argv.py \
            tests/test_agents_md_latest_review.py \
            tests/test_agents_md_release_contract.py \
            tests/test_agents_md_validator.py | sort)"
          test "$actual" = "$expected"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Apply the verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/pr18-final-fix/part-*.patch > "$RUNNER_TEMP/fix.patch"
          echo "c4358faf9d2f83a83b68a88f53d8361c98da437127bcb28078ed8fc29b65ddc3  $RUNNER_TEMP/fix.patch" | sha256sum --check --strict
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"
          rm -rf .tmp/pr18-final-fix .github/workflows/apply-pr18-final-fix.yml
          git diff --check
      - name: Commit verified production changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/agents-md-architect
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(agents-md): bind command evidence and unify parsing"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
