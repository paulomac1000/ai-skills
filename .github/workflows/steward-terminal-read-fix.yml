name: Steward terminal read repair

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/install_locked.py
      - name: Make public result terminal publication monotonic
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("skills/mcp-steward-architect/tools/steward-templates/python/steward_runtime.py.template")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?ms)^    def result\(self, job_id: str\) -> dict\[str, Any\]:\n.*?(?=^    def audit\(self, job_id: str \| None\))'
          )
          replacement = "\n".join([
              '    def result(self, job_id: str) -> dict[str, Any]:',
              '        # Read the job first. Terminal publication is monotonic: save_terminal commits',
              '        # completion, handoff and status=completed atomically, so once completed is',
              '        # observed, the sealed bundle must already be visible to later reads.',
              '        job = self.job(job_id)',
              '        terminal_publication = job["status"] == "completed"',
              '        with self._connect() as db:',
              '            completion = None',
              '            handoff = None',
              '            if terminal_publication:',
              '                completion = db.execute(',
              '                    "SELECT value_json FROM completion_evaluations WHERE job_id=?", (job_id,)',
              '                ).fetchone()',
              '                handoff = db.execute(',
              '                    "SELECT value_json FROM steward_handoffs WHERE job_id=?", (job_id,)',
              '                ).fetchone()',
              '            operations = [',
              '                dict(row)',
              '                for row in db.execute(',
              '                    "SELECT * FROM external_operations WHERE job_id=? ORDER BY created_at", (job_id,)',
              '                ).fetchall()',
              '            ]',
              '        if terminal_publication and (completion is None or handoff is None):',
              '            raise RuntimeError("completed Steward job is missing its sealed completion/handoff bundle")',
              '        return {',
              '            "job": job,',
              '            "operations": operations,',
              '            "evidence": self.evidence(job_id),',
              '            "completion": None if completion is None else json.loads(completion[0]),',
              '            "handoff": None if handoff is None else json.loads(handoff[0]),',
              '        }',
              '',
              '',
          ])
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one StewardStore.result replacement, found {count}")
          path.write_text(text, encoding="utf-8")
      - name: Exercise public MCP race regression repeatedly
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            python -m pytest -q tests/test_mcp_steward_architect.py::test_generated_public_mcp_controls_v3_durable_workflow
          done
          python -m pytest -q tests/test_mcp_steward_runtime_security.py
      - name: Remove one-shot workflow and commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/steward-terminal-read-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills/mcp-steward-architect/tools/steward-templates/python/steward_runtime.py.template .github/workflows/steward-terminal-read-fix.yml
          git diff --cached --check
          git commit -m "fix(steward): make terminal result reads monotonic"
          git push origin HEAD:feat/mcp-steward-architect
