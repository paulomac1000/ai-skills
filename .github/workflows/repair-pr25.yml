# One-shot native regeneration; removed after the lock refresh.
name: Refresh PR25 native locks

on:
  push:
    branches:
      - fix/unified-contract-release-hardening
    paths:
      - .github/workflows/repair-pr25.yml

permissions: {}

jobs:
  locks:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            architecture: x64
            expected: linux-x64-py312
          - os: ubuntu-24.04
            python: '3.13'
            architecture: x64
            expected: linux-x64-py313
          - os: ubuntu-24.04
            python: '3.14'
            architecture: x64
            expected: linux-x64-py314
          - os: macos-15
            python: '3.12'
            architecture: arm64
            expected: macos-arm64-py312
          - os: windows-2025
            python: '3.12'
            architecture: x64
            expected: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install current native graph
        run: python scripts/install_locked.py
      - name: Compile native locks
        shell: bash
        env:
          EXPECTED_ID: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          identifier="$(python scripts/compile_locks.py | tail -n 1)"
          test "$identifier" = "$EXPECTED_ID"
          mkdir repair-out
          cp "requirements-dev-${identifier}.lock" repair-out/root.lock
          cp "skills/mcp-server-architect/locks/runtime-${identifier}.lock" repair-out/runtime.lock
          cp "skills/mcp-server-architect/locks/dev-${identifier}.lock" repair-out/dev.lock
          printf '%s\n' "$identifier" > repair-out/id.txt
          grep -q 'build==1.5.0' repair-out/root.lock
          grep -q 'build==1.5.0' repair-out/dev.lock
          ! grep -q 'build==1.5.1' repair-out/root.lock
          ! grep -q 'build==1.5.1' repair-out/dev.lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: locks-${{ matrix.expected }}
          path: repair-out/
          if-no-files-found: error
          retention-days: 1

  publish-locks:
    needs: locks
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: locks-*
          path: repair-download
          merge-multiple: false
      - name: Assemble exact native outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil

          roots = sorted(Path('repair-download').glob('locks-*'))
          if len(roots) != 5:
              raise SystemExit(f'expected 5 artifacts, got {len(roots)}')
          seen = set()
          for root in roots:
              identifier = (root / 'id.txt').read_text(encoding='utf-8').strip()
              if not identifier or identifier in seen:
                  raise SystemExit(f'invalid lock id: {identifier!r}')
              seen.add(identifier)
              shutil.copy2(root / 'root.lock', f'requirements-dev-{identifier}.lock')
              shutil.copy2(root / 'runtime.lock', f'skills/mcp-server-architect/locks/runtime-{identifier}.lock')
              shutil.copy2(root / 'dev.lock', f'skills/mcp-server-architect/locks/dev-{identifier}.lock')
          expected = {
              'linux-x64-py312', 'linux-x64-py313', 'linux-x64-py314',
              'macos-arm64-py312', 'windows-x64-py312',
          }
          if seen != expected:
              raise SystemExit(f'wrong lock targets: {seen}')
          PY
          for lock in requirements-dev-*.lock skills/mcp-server-architect/locks/dev-*.lock; do
            ! grep -q 'build==1.5.1' "$lock"
          done
          git add requirements-dev-*.lock skills/mcp-server-architect/locks/*.lock
          git diff --cached --check
      - name: Commit lock refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ai-skills lock refresh'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh native Python lock graphs'
      - name: Fast-forward push lock refresh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/fix/unified-contract-release-hardening | cut -f1)" = "$START_SHA"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fix/unified-contract-release-hardening
