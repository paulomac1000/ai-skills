name: Repair PR 25 final pass

on:
  push:
    branches: ["fix/unified-contract-release-hardening"]
    paths: [".github/workflows/repair-pr25.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/unified-contract-release-hardening
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py313.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.302"
      - name: Install reviewed dependency graph
        run: python -m pip install --require-hashes -r requirements-dev-linux-x64-py313.lock
      - name: Apply verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all(path: str, old: str, new: str, *, minimum: int = 1) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected at least {minimum} replacements, found {count}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Validators must fail closed on malformed schema shapes before semantic processing.
          replace_once(
              "contracts/validate_atomic_claims.py",
              "    findings = _schema_findings(report, schema)\n    skill = report.get(\"skill\")\n",
              "    findings = _schema_findings(report, schema)\n    if findings:\n        return findings\n    skill = report.get(\"skill\")\n",
          )
          replace_once(
              "contracts/validate_capability_manifest.py",
              "    findings.extend(_semantic_findings(manifest, require_active=require_active))\n    return findings\n",
              "    if findings:\n        return findings\n    findings.extend(_semantic_findings(manifest, require_active=require_active))\n    return findings\n",
          )

          # The public workflow facade must share the implementation's write-scope semantics.
          replace_once(
              "skills/ci-cd-architect/tools/check_github_actions_policy.py",
              "def _permissions_write(value: object) -> bool:\n    return isinstance(value, Mapping) and any(\n        isinstance(scope, str) and scope.casefold() == \"write\"\n        for scope in value.values()\n    )\n",
              "def _permissions_write(value: object) -> bool:\n    return _impl._permission_has_write(\n        dict(value) if isinstance(value, Mapping) else value\n    )\n",
          )

          # Missing versions are invalid even when both report and manifest omit them.
          replace_once(
              "contracts/validate_conformance.py",
              "    if skill.get(\"version\") != manifest.get(\"version\"):\n        errors.append(\"skill.version: must equal the local skill manifest\")\n",
              "    reported_version = skill.get(\"version\")\n    manifest_version = manifest.get(\"version\")\n    if not isinstance(reported_version, str) or not reported_version:\n        errors.append(\"skill.version: must be a non-empty string\")\n    elif not isinstance(manifest_version, str) or reported_version != manifest_version:\n        errors.append(\"skill.version: must equal the local skill manifest\")\n",
          )

          # Legacy compatibility internals must not publish competing trust-boundary type names.
          replace_all(
              "skills/mcp-server-consumer/tools/decision_engine_legacy.py",
              "TrustedCapabilityPolicy",
              "_LegacyTrustedCapabilityPolicy",
              minimum=3,
          )
          replace_all(
              "skills/mcp-server-consumer/tools/decision_engine_legacy.py",
              "TrustedCapabilityContract",
              "_LegacyTrustedCapabilityContract",
              minimum=3,
          )
          legacy = ROOT / "skills/mcp-server-consumer/tools/decision_engine_legacy.py"
          legacy_text = legacy.read_text(encoding="utf-8")
          legacy_text = legacy_text.replace(
              "trusted_policy must be _LegacyTrustedCapabilityPolicy or None",
              "trusted_policy must be TrustedCapabilityPolicy or None",
          ).replace(
              "trusted_contract must be _LegacyTrustedCapabilityContract or None",
              "trusted_contract must be TrustedCapabilityContract or None",
          )
          legacy.write_text(legacy_text, encoding="utf-8")

          # Remove obsolete trust tests instead of maintaining a name-based denylist.
          cases_path = ROOT / "tests/decision_engine_cases.py"
          cases_text = cases_path.read_text(encoding="utf-8")
          module = ast.parse(cases_text)
          obsolete = {
              "test_tools_package_public_entry_point_imports",
              "test_untrusted_signals_can_only_increase_risk_and_preserve_confidentiality",
              "test_typed_trust_channels_reject_boolean_upgrade_switches",
              "test_annotations_require_consumer_controlled_server_trust",
              "test_positive_idempotency_comes_only_from_typed_external_values",
          }
          lines = cases_text.splitlines(keepends=True)
          ranges = [
              (node.lineno - 1, node.end_lineno)
              for node in module.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in obsolete
          ]
          if len(ranges) != len(obsolete):
              raise RuntimeError(f"expected {len(obsolete)} obsolete trust tests, found {len(ranges)}")
          for start, end in sorted(ranges, reverse=True):
              del lines[start:end]
          cases_path.write_text("".join(lines), encoding="utf-8")
          decision_tests = ROOT / "tests/test_decision_engine.py"
          decision_text = decision_tests.read_text(encoding="utf-8")
          start = decision_text.index("LEGACY_TRUST_CASES = {")
          end = decision_text.index("}\n\n\nfor _name", start) + 2
          decision_text = decision_text[:start] + decision_text[end:]
          decision_text = decision_text.replace(
              "if _name.startswith(\"test_\") and _name not in LEGACY_TRUST_CASES:",
              "if _name.startswith(\"test_\"):",
          )
          decision_tests.write_text(decision_text, encoding="utf-8")

          # AFDS: distinguish its metadata dialect, preserve literal # vs percent-encoded path data,
          # document precedence, and fail closed for an explicitly requested missing governance file.
          replace_once(
              "skills/afds-doc-writer/validate.py",
              "AFDS_DIALECT_KEYS = {\"type\", \"status\", \"rigor\", \"owners\", \"verification\"}\n",
              "AFDS_DIALECT_KEYS = {\"afds_schema_version\", \"doc_id\", \"rigor\", \"owners\", \"verification\"}\n",
          )
          replace_once(
              "skills/afds-doc-writer/validate.py",
              "def _profile_for(path: Path, root: Path, governance: Governance) -> GovernanceProfile | None:\n    relative = _repository_relative(path, root)\n",
              "def _profile_for(path: Path, root: Path, governance: Governance) -> GovernanceProfile | None:\n    \"\"\"Return the last matching governance profile; later entries intentionally win.\"\"\"\n    relative = _repository_relative(path, root)\n",
          )
          replace_once(
              "skills/afds-doc-writer/validate.py",
              "        decoded = unquote(destination)\n        parsed = urlparse(decoded)\n        if parsed.scheme or parsed.netloc:\n            continue\n        raw_path, separator, fragment = decoded.partition(\"#\")\n        target = path if raw_path == \"\" else path.parent / raw_path\n",
              "        raw_path, separator, raw_fragment = destination.partition(\"#\")\n        decoded_path = unquote(raw_path)\n        decoded_fragment = unquote(raw_fragment) if separator else \"\"\n        parsed = urlparse(decoded_path)\n        if parsed.scheme or parsed.netloc:\n            continue\n        target = path if decoded_path == \"\" else path.parent / decoded_path\n",
          )
          replace_all(
              "skills/afds-doc-writer/validate.py",
              "fragment",
              "decoded_fragment",
              minimum=2,
          )
          # Undo replacements in identifiers that are not part of the local link fragment variable.
          afds_path = ROOT / "skills/afds-doc-writer/validate.py"
          afds_text = afds_path.read_text(encoding="utf-8")
          afds_text = afds_text.replace("decoded_decoded_fragment", "decoded_fragment")
          afds_text = afds_text.replace("_validate_decoded_fragments", "_validate_fragments")
          afds_text = afds_text.replace("missing decoded_fragment", "missing fragment")
          afds_path.write_text(afds_text, encoding="utf-8")
          replace_once(
              "skills/afds-doc-writer/validate.py",
              "    governance_path = args.governance or root / \"skills/afds-doc-writer/governance.yaml\"\n    governance = DEFAULT_GOVERNANCE\n    if governance_path.exists():\n",
              "    governance_path = args.governance or root / \"skills/afds-doc-writer/governance.yaml\"\n    governance = DEFAULT_GOVERNANCE\n    if args.governance is not None and not governance_path.is_file():\n        print(f\"ERROR: governance file does not exist: {governance_path}\")\n        return 1\n    if governance_path.exists():\n",
          )

          # Machine-derived MCP applicability: declared status may not override catalog applicability.
          replace_once(
              "contracts/validate_adoption.py",
              "from contracts.evidence import EvidenceVerifier, GitHubEvidenceVerifier  # noqa: E402\nfrom contracts.semver import is_semver  # noqa: E402\n",
              "from contracts.evidence import EvidenceVerifier, GitHubEvidenceVerifier  # noqa: E402\nfrom contracts.rule_applicability import RuleContext, expected_rules  # noqa: E402\nfrom contracts.semver import is_semver  # noqa: E402\n",
          )
          replace_once(
              "contracts/validate_adoption.py",
              "def _validate_applicability(\n    assessment: Mapping[str, Any],\n    catalog_rules: set[str],\n    findings: list[Finding],\n",
              "def _validate_applicability(\n    assessment: Mapping[str, Any],\n    catalog_rules: set[str],\n    findings: list[Finding],\n    *,\n    machine_applicable_rules: set[str] | None = None,\n",
          )
          replace_once(
              "contracts/validate_adoption.py",
              "    *,\n    as_of: date,\n    repository: str,\n",
              "    as_of: date,\n    repository: str,\n",
          )
          replace_once(
              "contracts/validate_adoption.py",
              "        status_value = entry.get(\"status\")\n        if status_value not in ALLOWED_STATUSES:\n            findings.append(Finding(f\"{location}.status\", f\"must be one of {sorted(ALLOWED_STATUSES)}\"))\n",
              "        status_value = entry.get(\"status\")\n        if status_value not in ALLOWED_STATUSES:\n            findings.append(Finding(f\"{location}.status\", f\"must be one of {sorted(ALLOWED_STATUSES)}\"))\n        if machine_applicable_rules is not None and rule_id in catalog_rules:\n            machine_applies = rule_id in machine_applicable_rules\n            if machine_applies and status_value == \"not-applicable\":\n                findings.append(Finding(f\"{location}.status\", \"catalog applicability requires this rule to be applicable or explicitly deferred\"))\n            elif not machine_applies and status_value != \"not-applicable\":\n                findings.append(Finding(f\"{location}.status\", \"catalog applicability requires this rule to be not-applicable\"))\n",
          )
          replace_once(
              "contracts/validate_adoption.py",
              "        elif status_value == \"not-applicable\":\n            if waiver_id is not None:\n                findings.append(Finding(f\"{location}.waiver_id\", \"not-applicable rule must not use a waiver\"))\n",
              "        elif status_value == \"not-applicable\":\n            if waiver_id is not None:\n                findings.append(Finding(f\"{location}.waiver_id\", \"not-applicable rule must not use a waiver\"))\n            if entry.get(\"implementation\"):\n                findings.append(Finding(f\"{location}.implementation\", \"not-applicable rule must not claim implementation evidence\"))\n            if entry.get(\"verification\"):\n                findings.append(Finding(f\"{location}.verification\", \"not-applicable rule must not claim verification evidence\"))\n",
          )
          replace_once(
              "contracts/validate_adoption.py",
              "    _text_list(mcp.get(\"profiles\"), \"extensions.mcp.profiles\", findings, nonempty=True)\n    advertised = set(\n",
              "    _text_list(mcp.get(\"profiles\"), \"extensions.mcp.profiles\", findings, nonempty=True)\n    _text_list(mcp.get(\"capabilities\"), \"extensions.mcp.capabilities\", findings)\n    advertised = set(\n",
          )
          replace_once(
              "contracts/validate_adoption.py",
              "    catalog_rules = _catalog_rules(catalog, skill_name, findings) if skill_name else set()\n    _validate_applicability(\n        assessment,\n        catalog_rules,\n        findings,\n        as_of=as_of,\n",
              "    catalog_rules = _catalog_rules(catalog, skill_name, findings) if skill_name else set()\n    machine_applicable_rules: set[str] | None = None\n    if skill_name == \"mcp-server-architect\":\n        raw_extensions = assessment.get(\"extensions\")\n        raw_mcp = raw_extensions.get(\"mcp\") if isinstance(raw_extensions, Mapping) else None\n        if isinstance(raw_mcp, Mapping):\n            level = raw_mcp.get(\"target_level\")\n            profiles = raw_mcp.get(\"profiles\")\n            capabilities = raw_mcp.get(\"capabilities\", [])\n            if (\n                isinstance(level, str)\n                and isinstance(profiles, list)\n                and all(isinstance(item, str) for item in profiles)\n                and isinstance(capabilities, list)\n                and all(isinstance(item, str) for item in capabilities)\n            ):\n                try:\n                    context = RuleContext(\n                        target_level=level,\n                        profiles=frozenset(profiles),\n                        capabilities=frozenset(capabilities),\n                    )\n                    machine_applicable_rules = {\n                        str(rule[\"id\"])\n                        for rule in expected_rules(catalog, skill_name, context)\n                    }\n                except (KeyError, TypeError, ValueError) as exc:\n                    findings.append(Finding(\"extensions.mcp\", f\"cannot derive catalog applicability: {exc}\"))\n    _validate_applicability(\n        assessment,\n        catalog_rules,\n        findings,\n        machine_applicable_rules=machine_applicable_rules,\n        as_of=as_of,\n",
          )

          # Extend the shared adoption schema and MCP template with capability context.
          schema_path = ROOT / "contracts/adoption-assessment.schema.json"
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          mcp_schema = schema["properties"]["extensions"]["properties"]["mcp"]
          mcp_schema["properties"]["capabilities"] = {
              "type": "array",
              "items": {"$ref": "#/$defs/text"},
              "uniqueItems": True,
          }
          required = mcp_schema["required"]
          if "capabilities" not in required:
              required.insert(required.index("advertised_transports"), "capabilities")
          schema_path.write_text(json.dumps(schema, separators=(",", ":")) + "\n", encoding="utf-8")
          replace_once(
              "skills/mcp-server-architect/templates/migration-assessment.yaml.template",
              "    profiles: [REPLACE_WITH_IMPLEMENTED_PROFILE]\n    advertised_transports:",
              "    profiles: [REPLACE_WITH_IMPLEMENTED_PROFILE]\n    capabilities: []\n    advertised_transports:",
          )
          replace_once(
              "tests/test_adoption_contract.py",
              "                \"profiles\": [\"python\"],\n                \"advertised_transports\": [\"stdio\"],\n",
              "                \"profiles\": [\"python\"],\n                \"capabilities\": [],\n                \"advertised_transports\": [\"stdio\"],\n",
          )

          # CI/CD on-demand execution is a stable standard invariant, not an unmapped heading.
          replace_once(
              "contracts/rule-catalog.yaml",
              "    - id: cicd.workflow.profiled\n      source: STANDARD.md#workflow-policy-profiles\n      description: Pull request, trusted CI, and protected release workflows are audited under explicit fail-closed profiles.\n",
              "    - id: cicd.workflow.profiled\n      source: STANDARD.md#workflow-policy-profiles\n      description: Pull request, trusted CI, and protected release workflows are audited under explicit fail-closed profiles.\n    - id: cicd.execution.on-demand\n      source: STANDARD.md#execution-policy-and-hosted-runner-budget\n      description: Cost-aware workflows remain manually dispatchable on development refs while preserving exact-SHA full acceptance gates.\n",
          )
          replace_once(
              "contracts/standard-rule-map.yaml",
              "      workflow-policy-profiles: {rule_id: cicd.workflow.profiled, primary: true}\n      python-quality:",
              "      workflow-policy-profiles: {rule_id: cicd.workflow.profiled, primary: true}\n      execution-policy-and-hosted-runner-budget: {rule_id: cicd.execution.on-demand, primary: true}\n      python-quality:",
          )

          # Migrate changed governed CI/CD documents to the current AFDS metadata schema.
          for relative, kind in (
              ("skills/ci-cd-architect/STANDARD.md", "command"),
              ("skills/ci-cd-architect/references/finding-triage.md", "ci-job"),
              ("skills/ci-cd-architect/references/on-demand-ci.md", "command"),
              ("skills/ci-cd-architect/references/protected-release-workflows.md", "command"),
          ):
              path = ROOT / relative
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  raise RuntimeError(f"{relative}: expected frontmatter")
              end = text.index("\n---\n", 4)
              front = text[4:end]
              if "afds_schema_version:" not in front:
                  front = "afds_schema_version: 2\n" + front
              lines = front.splitlines()
              verification_index = next(i for i, line in enumerate(lines) if line.startswith("verification:"))
              verification_line = lines[verification_index]
              if verification_line != "verification:":
                  value = verification_line.split(":", 1)[1].strip()
                  lines[verification_index:verification_index + 1] = [
                      "verification:",
                      f"  kind: {kind}",
                      f"  value: {value}",
                  ]
              front = "\n".join(lines)
              path.write_text("---\n" + front + text[end:], encoding="utf-8")

          # Render harness must pair interpreter and lock graph.
          replace_all(
              "tests/test_templates.py",
              "requirements-dev-linux-x64-py312.lock",
              "requirements-dev-linux-x64-py313.lock",
              minimum=3,
          )

          # Generated exact-artifact CI must use the SHA actually checked out, including pull requests.
          replace_once(
              "skills/mcp-server-architect/tools/python-template/.github/workflows/ci.yml.template",
              "      - name: Build image from the tested wheel\n        shell: bash\n        run: |\n          set -euo pipefail\n          IMAGE=\"__DISTRIBUTION__:sha-${GITHUB_SHA}\"\n          docker build --build-arg WHEEL_FILE=\"$(basename \"$WHEEL_FILE\")\" --build-arg WHEEL_SHA256=\"$WHEEL_SHA256\" -t \"$IMAGE\" .\n          echo \"IMAGE=$IMAGE\" >> \"$GITHUB_ENV\"\n",
              "      - name: Build image from the tested wheel\n        shell: bash\n        env:\n          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}\n        run: |\n          set -euo pipefail\n          test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\n          IMAGE=\"__DISTRIBUTION__:sha-${EXPECTED_SHA}\"\n          docker build --build-arg WHEEL_FILE=\"$(basename \"$WHEEL_FILE\")\" --build-arg WHEEL_SHA256=\"$WHEEL_SHA256\" -t \"$IMAGE\" .\n          echo \"IMAGE=$IMAGE\" >> \"$GITHUB_ENV\"\n",
          )

          # Split independent lock-negative assertions so one failure cannot mask the other.
          replace_once(
              "tests/test_audit_contract_extensions.py",
              "def test_skill_lock_rejects_moving_revision_and_cross_skill_entrypoint(tmp_path: Path) -> None:\n    lock = _write_yaml(\n        tmp_path / \"ai-skills.lock.yaml\",\n        {\n            \"schema_version\": 1,\n            \"repository\": \"paulomac1000/ai-skills\",\n            \"revision\": \"main\",\n            \"skills\": {\n                \"example\": {\n                    \"version\": \"1.2.0\",\n                    \"revision\": FULL_SHA,\n                    \"normative_entrypoint\": \"skills/other/STANDARD.md\",\n                }\n            },\n        },\n    )\n    findings = validate_lock(lock)\n    assert any(\n        \"full commit SHA\" in finding or \"does not match\" in finding\n        for finding in findings\n    )\n    assert any(\"locked skill\" in finding for finding in findings)\n",
              "def test_skill_lock_rejects_moving_repository_revision(tmp_path: Path) -> None:\n    lock = _write_yaml(\n        tmp_path / \"ai-skills.lock.yaml\",\n        {\n            \"schema_version\": 1,\n            \"repository\": \"paulomac1000/ai-skills\",\n            \"revision\": \"main\",\n            \"skills\": {\n                \"example\": {\n                    \"version\": \"1.2.0\",\n                    \"revision\": FULL_SHA,\n                    \"normative_entrypoint\": \"skills/example/STANDARD.md\",\n                }\n            },\n        },\n    )\n    findings = validate_lock(lock)\n    assert any(\"full commit SHA\" in finding or \"does not match\" in finding for finding in findings)\n\n\ndef test_skill_lock_rejects_cross_skill_entrypoint(tmp_path: Path) -> None:\n    lock = _write_yaml(\n        tmp_path / \"ai-skills.lock.yaml\",\n        {\n            \"schema_version\": 1,\n            \"repository\": \"paulomac1000/ai-skills\",\n            \"revision\": FULL_SHA,\n            \"skills\": {\n                \"example\": {\n                    \"version\": \"1.2.0\",\n                    \"revision\": FULL_SHA,\n                    \"normative_entrypoint\": \"skills/other/STANDARD.md\",\n                }\n            },\n        },\n    )\n    findings = validate_lock(lock)\n    assert any(\"locked skill\" in finding for finding in findings)\n",
          )

          # Fail-closed CLI tests must prove non-zero exits.
          replace_once(
              "tests/test_python_generator_cli.py",
              "    with pytest.raises(SystemExit):\n        generator.main([str(tmp_path / \"missing\")])\n    with pytest.raises(SystemExit):\n        generator.main(\n",
              "    with pytest.raises(SystemExit) as missing:\n        generator.main([str(tmp_path / \"missing\")])\n    assert missing.value.code != 0\n    with pytest.raises(SystemExit) as conflict:\n        generator.main(\n",
          )
          replace_once(
              "tests/test_python_generator_cli.py",
              "        )\n    assert not (tmp_path / \"missing\").exists()\n",
              "        )\n    assert conflict.value.code != 0\n    assert not (tmp_path / \"missing\").exists()\n",
          )

          # Rename implementation-history regression module and strengthen exact lifecycle mappings.
          old_test = ROOT / "tests/test_coderabbit_followup.py"
          new_test = ROOT / "tests/test_contract_hardening_regressions.py"
          if new_test.exists():
              raise RuntimeError(f"target test already exists: {new_test}")
          old_test.rename(new_test)
          for path in ROOT.rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if "test_coderabbit_followup.py" in text:
                  path.write_text(text.replace("test_coderabbit_followup.py", "test_contract_hardening_regressions.py"), encoding="utf-8")
          replace_once(
              "tests/test_contract_hardening_regressions.py",
              "    assert \"CapabilityActiveState.Disabled\" in adapter\n    assert \"CapabilityActiveState.Degraded\" in adapter\n    assert \"CapabilityActiveState.Unavailable\" in adapter\n",
              "    assert 'CapabilityActiveState.Disabled => \"inactive\"' in adapter\n    assert 'CapabilityActiveState.Degraded => \"inactive\"' in adapter\n    assert 'CapabilityActiveState.Unavailable => \"inactive\"' in adapter\n",
          )

          # Add behavioral regressions for newly repaired fail-closed boundaries.
          regressions = ROOT / "tests/test_latest_bot_followup.py"
          regression_text = regressions.read_text(encoding="utf-8")
          regression_text += r'''


def test_capability_manifest_schema_error_stops_unhashable_semantics(tmp_path: Path) -> None:
    import json
    from contracts.validate_capability_manifest import validate_manifest

    manifest = {
        "schema_version": 1,
        "id": "dangerous.write",
        "name": "Dangerous write",
        "description": "Malformed approval binds must produce findings, not a traceback.",
        "operation_kind": "write",
        "risk": "high",
        "determinism": "deterministic",
        "latency": "interactive",
        "impact": "external",
        "active_state": "active",
        "retryable": False,
        "idempotent": False,
        "reversible": False,
        "requires_confirmation": True,
        "idempotency_key_required": False,
        "authorization_scopes": ["write"],
        "concurrency": {"scope": "principal", "limit": 1, "queue_limit": 1},
        "max_response_bytes": 1024,
        "protocol_revisions": ["2026-07-28"],
        "approval": {"binds": [{}]},
    }
    path = tmp_path / "manifest.json"
    path.write_text(json.dumps(manifest), encoding="utf-8")
    assert validate_manifest(path)


def test_atomic_claim_schema_error_stops_unhashable_semantics() -> None:
    from contracts.validate_atomic_claims import validate_report

    malformed = {
        "schema_version": 1,
        "skill": "mcp-server-architect",
