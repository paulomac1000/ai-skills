# exact-head final validation; removed by the repair commit
name: Repair PR 25 final pass

on:
  push:
    branches:
      - fix/unified-contract-release-hardening
    paths:
      - .github/workflows/repair-pr25.yml
      - scripts/repair_pr25_once.py
      - scripts/adapt_repair_pr25_once.py
      - scripts/repair_pr25_additional.py
      - scripts/repair_pr25_projection.py
      - scripts/repair_pr25_practical_feedback.py
      - scripts/adapt_practical_feedback_once.py
      - scripts/repair_pr25_coverage.py
      - scripts/repair_pr25_coverage_extra.py
      - scripts/repair_pr25_generator_coverage.py

permissions:
  contents: write

concurrency:
  group: repair-pr25-final
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py313.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.302"
      - name: Install reviewed dependency graph
        run: python -m pip install --require-hashes -r requirements-dev-linux-x64-py313.lock
      - name: Resolve current immutable Python base-image digest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect python:3.12.11-slim-bookworm --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "PYTHON_BASE_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Align one-shot repair with exact head
        run: python scripts/adapt_repair_pr25_once.py
      - name: Apply exact-head repair
        shell: bash
        run: |
          set +e
          python scripts/repair_pr25_once.py > repair-pr25.log 2>&1
          status=$?
          cat repair-pr25.log
          if (( status != 0 )); then
            message="$(tail -n 2 repair-pr25.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error::$message"
            exit "$status"
          fi
      - name: Apply remaining verified regression alignment
        run: python scripts/repair_pr25_additional.py
      - name: Apply shared applicability and exact-test repair
        run: python scripts/repair_pr25_projection.py
      - name: Align practical-feedback repair fixture
        run: python scripts/adapt_practical_feedback_once.py
      - name: Apply practical consumer-driven repair
        run: python scripts/repair_pr25_practical_feedback.py
      - name: Add policy and generator boundary coverage
        run: |
          python scripts/repair_pr25_coverage.py
          python scripts/repair_pr25_coverage_extra.py
          python scripts/repair_pr25_generator_coverage.py
      - name: Remove one-shot repair machinery and stage final tree
        run: |
          git rm -f .github/workflows/repair-pr25.yml scripts/repair_pr25_once.py scripts/adapt_repair_pr25_once.py scripts/repair_pr25_additional.py scripts/repair_pr25_projection.py scripts/repair_pr25_practical_feedback.py scripts/adapt_practical_feedback_once.py scripts/repair_pr25_coverage.py scripts/repair_pr25_coverage_extra.py scripts/repair_pr25_generator_coverage.py
          git add -A
      - name: Format and run focused regressions
        run: |
          python -m ruff check --fix contracts skills tests scripts
          python -m ruff format contracts skills tests scripts
          python -m ruff check contracts skills tests scripts
          git add -A
          python -m pytest -q tests/test_latest_bot_followup.py tests/test_contract_hardening_regressions.py tests/test_adoption_contract.py tests/test_audit_contract_extensions.py tests/test_atomic_claim_contract.py tests/test_decision_engine.py tests/test_templates.py tests/test_python_generator_cli.py tests/test_conformance_report.py tests/test_mcp_migration_standard.py tests/test_post_review_regressions.py tests/test_python_sdk_profile_routing.py tests/test_repository_completion_contract.py tests/test_rule_catalog_contract.py tests/test_practical_consumer_feedback.py tests/test_contract_boundary_coverage.py
      - name: Run repository quality gate
        run: python scripts/ci.py
      - name: Run immutable real-consumer source canaries
        run: >-
          python skills/mcp-server-architect/tools/check_consumer_canaries.py
          --catalog contracts/consumer-canaries.yaml
          --workspace "${RUNNER_TEMP}/ai-skills-consumer-canaries"
      - name: Run generated Python container gate
        run: python -m pytest -q tests/test_mcp_generator.py -m container
      - name: Verify final tree
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f | sort)" = ".github/workflows/ci.yml"
          git diff --check
          git status --short
      - name: Commit and push reviewed fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "feat: validate ai-skills against real consumers"
          git push origin HEAD:fix/unified-contract-release-hardening
