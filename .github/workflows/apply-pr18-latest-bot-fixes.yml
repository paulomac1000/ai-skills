name: Apply latest PR18 bot fixes

on:
  pull_request:
    types: [synchronize]

permissions: {}

concurrency:
  group: pr18-latest-bot-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/agents-md-architect'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify and apply reviewed patch
        run: |
          set -euo pipefail
          cat \
            .github/scripts/pr18-bot-fixes.part00 \
            .github/scripts/pr18-bot-fixes.part01a \
            .github/scripts/pr18-bot-fixes.part01b \
            .github/scripts/pr18-bot-fixes.part02 \
            .github/scripts/pr18-bot-fixes.part03 \
            > /tmp/pr18-bot-fixes.patch
          echo '58da195b016357d35802a981faea0ad20b5f1e711955f90348e55a01393c3eb6  /tmp/pr18-bot-fixes.patch' | sha256sum --check
          git apply --check /tmp/pr18-bot-fixes.patch
          git apply /tmp/pr18-bot-fixes.patch
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            skills/agents-md-architect/tools/agents_md_python_evidence.py \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py \
            skills/ci-cd-architect/tools/check_github_actions_policy.py \
            skills/ci-cd-architect/tools/check_github_actions_policy_impl.py \
            tests/test_agents_md_latest_review.py \
            tests/test_ci_cd_workflow_policy.py | sort)"

      - name: Install locked development dependencies
        run: python scripts/install_locked.py

      - name: Run focused quality and regressions
        run: |
          set -euo pipefail
          files=(
            skills/agents-md-architect/tools/agents_md_python_evidence.py
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
            skills/ci-cd-architect/tools/check_github_actions_policy.py
            skills/ci-cd-architect/tools/check_github_actions_policy_impl.py
            tests/test_agents_md_latest_review.py
            tests/test_ci_cd_workflow_policy.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m py_compile "${files[@]}"
          python -m pytest -q \
            tests/test_agents_md_latest_review.py \
            tests/test_ci_cd_workflow_policy.py \
            tests/test_agents_md_structural_followup.py \
            tests/test_agents_md_codex_followup.py

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact verified head without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Commit verified fixes and remove transport files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          cat \
            .github/scripts/pr18-bot-fixes.part00 \
            .github/scripts/pr18-bot-fixes.part01a \
            .github/scripts/pr18-bot-fixes.part01b \
            .github/scripts/pr18-bot-fixes.part02 \
            .github/scripts/pr18-bot-fixes.part03 \
            > /tmp/pr18-bot-fixes.patch
          echo '58da195b016357d35802a981faea0ad20b5f1e711955f90348e55a01393c3eb6  /tmp/pr18-bot-fixes.patch' | sha256sum --check
          git apply --check /tmp/pr18-bot-fixes.patch
          git apply /tmp/pr18-bot-fixes.patch
          rm .github/scripts/pr18-bot-fixes.part*
          rm .github/workflows/apply-pr18-latest-bot-fixes.yml
          git diff --check
          test "$(git status --porcelain --untracked-files=all | awk '{print $NF}' | sort)" = "$(printf '%s\n' \
            .github/scripts/pr18-bot-fixes.part00 \
            .github/scripts/pr18-bot-fixes.part01 \
            .github/scripts/pr18-bot-fixes.part01a \
            .github/scripts/pr18-bot-fixes.part01b \
            .github/scripts/pr18-bot-fixes.part02 \
            .github/scripts/pr18-bot-fixes.part03 \
            .github/workflows/apply-pr18-latest-bot-fixes.yml \
            skills/agents-md-architect/tools/agents_md_python_evidence.py \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py \
            skills/ci-cd-architect/tools/check_github_actions_policy.py \
            skills/ci-cd-architect/tools/check_github_actions_policy_impl.py \
            tests/test_agents_md_latest_review.py \
            tests/test_ci_cd_workflow_policy.py | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: address latest review findings'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_HEAD_REF}"
