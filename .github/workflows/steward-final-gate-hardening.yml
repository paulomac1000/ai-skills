name: Steward final gate hardening

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.302"
      - run: python scripts/install_locked.py
      - name: Apply compositional gate hardening
        run: python scripts/_steward_final_gate_patch.py
      - name: Format governed Python sources
        run: >-
          python -m ruff format
          skills/mcp-steward-architect/tools/generate_steward.py
          skills/mcp-steward-architect/tools/validate_steward.py
          tests/test_mcp_steward_architect.py
          tests/test_mcp_steward_runtime_security.py
          tests/test_mcp_steward_evidence_selectors.py
      - name: Verify patch integrity
        run: |
          git diff --check
          python -m py_compile skills/mcp-steward-architect/tools/generate_steward.py skills/mcp-steward-architect/tools/validate_steward.py tests/test_mcp_steward_architect.py tests/test_mcp_steward_runtime_security.py tests/test_mcp_steward_evidence_selectors.py
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in (
              'contracts/steward-job.schema.json',
              'contracts/external-operation-receipt.schema.json',
              'contracts/steward-mutation-policy.schema.json',
              'contracts/evidence-claim-plan.yaml',
          ):
              text = Path(path).read_text(encoding='utf-8')
              json.loads(text) if path.endswith('.json') else yaml.safe_load(text)
          PY
      - name: Run Steward validator and generated runtime regressions
        run: >-
          python -m pytest -q
          tests/test_mcp_steward_architect.py
          tests/test_mcp_steward_runtime_security.py
          tests/test_mcp_steward_evidence_selectors.py
      - name: Build publish and smoke exact generated dotnet Steward
        run: python -m pytest -q tests/test_mcp_steward_dotnet_generator.py
      - name: Execute complete canonical local gate
        run: python scripts/ci.py
      - name: Publish verified target changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/steward-job.schema.json \
            contracts/external-operation-receipt.schema.json \
            contracts/steward-mutation-policy.schema.json \
            contracts/evidence-claim-plan.yaml \
            skills/mcp-steward-architect/templates/mutation-policy.yaml.template \
            skills/mcp-steward-architect/tools/generate_steward.py \
            skills/mcp-steward-architect/tools/validate_steward.py \
            skills/mcp-steward-architect/tools/steward-templates/python/steward_runtime.py.template \
            skills/mcp-steward-architect/tools/steward-templates/python/test_steward_runtime.py.template \
            skills/mcp-steward-architect/tools/steward-templates/dotnet/StewardSeedRuntime.cs.template \
            skills/mcp-steward-architect/tools/steward-templates/dotnet/SmokeProgram.cs.template \
            tests/test_mcp_steward_architect.py \
            tests/test_mcp_steward_runtime_security.py \
            tests/test_mcp_steward_evidence_selectors.py
          git diff --cached --check
          git commit -m "fix(steward): enforce compositional mutation gate end to end"
          git push origin HEAD:feat/mcp-steward-architect
