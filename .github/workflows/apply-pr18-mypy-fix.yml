name: Apply PR18 mypy fix

on:
  pull_request:
    types: [synchronize]

permissions: {}

concurrency:
  group: pr18-mypy-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/agents-md-architect'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply exact typing correction
        run: |
          set -euo pipefail
          echo '76cdb0aaca453f1842936441462004b9ccc8f943a67d3784cee919642047b573  .github/scripts/pr18-mypy-fix.py' | sha256sum --check
          python .github/scripts/pr18-mypy-fix.py
          git diff --check
          test "$(git diff --name-only)" = 'skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py'

      - name: Install locked development dependencies
        run: python scripts/install_locked.py

      - name: Run typing and focused regressions
        run: |
          set -euo pipefail
          python -m ruff check skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
          python -m ruff format --check skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
          python -m mypy skills/agents-md-architect/tools/audit_agents_md.py
          python -m pytest -q \
            tests/test_agents_md_latest_review.py \
            tests/test_agents_md_structural_followup.py

      - name: Stage verified production file
        run: |
          set -euo pipefail
          root=verified-mypy-fix
          mkdir -p "$root/skills/agents-md-architect/tools"
          cp \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py \
            "$root/skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py"
          printf '%s\n' \
            "source_head=${{ github.event.pull_request.head.sha }}" \
            > "$root/MANIFEST.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"

      - name: Upload verified production file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr18-mypy-fix-${{ github.event.pull_request.head.sha }}
          path: verified-mypy-fix
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact verified head without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified production file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr18-mypy-fix-${{ github.event.pull_request.head.sha }}
          path: verified-output

      - name: Verify artifact and create clean commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          root=verified-output
          test "$(find "$root" -type f -printf '%P\n' | sort)" = "$(printf '%s\n' \
            MANIFEST.txt \
            SHA256SUMS \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py | sort)"
          grep -Fx "source_head=$EXPECTED_HEAD" "$root/MANIFEST.txt"
          sed "s#  verified-mypy-fix/#  ${root}/#" "$root/SHA256SUMS" | sha256sum --check
          cp \
            "$root/skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py" \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
          rm -rf "$root"
          rm -f \
            .github/scripts/pr18-mypy-fix.patch \
            .github/scripts/pr18-mypy-fix.py \
            .github/workflows/apply-pr18-mypy-fix.yml
          git diff --check
          test "$(git status --porcelain --untracked-files=all | awk '{print $NF}' | sort)" = "$(printf '%s\n' \
            .github/scripts/pr18-mypy-fix.patch \
            .github/scripts/pr18-mypy-fix.py \
            .github/workflows/apply-pr18-mypy-fix.yml \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(agents-md): keep Jenkins match types distinct'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_HEAD_REF}"
