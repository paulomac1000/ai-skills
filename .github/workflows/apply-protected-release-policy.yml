name: Apply protected release policy

on:
  push:
    branches: [fix/protected-container-release-policy]
    paths:
      - scripts/apply-protected-release-policy.py
      - .github/workflows/apply-protected-release-policy.yml

permissions:
  contents: write

concurrency:
  group: apply-protected-release-policy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: fix/protected-container-release-policy
          fetch-depth: 0
      - name: Repair and apply migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-protected-release-policy.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(publish, "runs-on: ubuntu-latest", "runs-on: ubuntu-24.04")
          # Template contains two runner declarations.
          text = publish.read_text(encoding="utf-8")
          text = text.replace("runs-on: ubuntu-latest", "runs-on: ubuntu-24.04")
          publish.write_text(text, encoding="utf-8")
          '''
          new = '''text = publish.read_text(encoding="utf-8")
          if text.count("runs-on: ubuntu-latest") != 2:
              raise SystemExit("publish template runner count changed")
          publish.write_text(text.replace("runs-on: ubuntu-latest", "runs-on: ubuntu-24.04"), encoding="utf-8")
          '''
          if old not in text:
              raise SystemExit('migration repair target not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python scripts/apply-protected-release-policy.py
      - name: Commit migrated policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(cicd): support protected container releases'
          git push origin HEAD:fix/protected-container-release-policy
