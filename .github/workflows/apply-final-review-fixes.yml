name: Apply final bot review fixes retry

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/apply-final-review-fixes.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: apply-final-bot-review-fixes
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install exact locked development graph
        run: python scripts/install_locked.py
      - name: Apply deterministic review fixes from an untracked helper copy
        run: |
          set -euo pipefail
          HELPER=.github/scripts/.apply_final_review_fixes.py
          python .github/scripts/fix_final_review_helper_escape.py \
            .github/scripts/apply_final_review_fixes.py \
            "$HELPER"
          python "$HELPER"
          rm "$HELPER"
      - name: Format and lint changed Python
        run: |
          python -m ruff format \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            tests/test_agents_md_codex_followup.py \
            tests/test_mcp_migration_standard.py
          python -m ruff check \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            tests/test_agents_md_codex_followup.py \
            tests/test_mcp_migration_standard.py
      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_agents_md_codex_followup.py \
            tests/test_mcp_migration_standard.py \
            tests/test_mcp_generator.py -m "not container"
      - name: Execute complete repository gate
        run: python scripts/ci.py
      - name: Verify exact production diff
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain --untracked-files=all | sed -E 's/^.. //' | sort)" = "$(printf '%s\n' \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/mcp-server-architect/examples/python/server_composition.py.example \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            tests/test_agents_md_codex_followup.py \
            tests/test_mcp_migration_standard.py | sort)"
      - name: Commit verified production files only
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/mcp-server-architect/examples/python/server_composition.py.example \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            tests/test_agents_md_codex_followup.py \
            tests/test_mcp_migration_standard.py
          git diff --cached --quiet && { echo "No review fixes to commit"; exit 1; }
          git commit -m "fix: address final bot review findings"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${PR_HEAD_REF}"
