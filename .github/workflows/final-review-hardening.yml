# Disposable exact-head repair; removed by the resulting commit.
name: Final real-usage hardening

on:
  push:
    branches:
      - fix/unified-contract-release-hardening
    paths:
      - .github/workflows/final-review-hardening.yml
      - scripts/apply_final_review_hardening.py
      - scripts/apply_final_review_hardening_extra.py
      - scripts/apply_final_review_type_fix.py

permissions:
  contents: write

concurrency:
  group: final-real-usage-hardening
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py313.lock
      - name: Install reviewed dependency graph
        run: python -m pip install --require-hashes -r requirements-dev-linux-x64-py313.lock
      - name: Apply final real-usage hardening
        run: |
          python scripts/apply_final_review_hardening.py
          python scripts/apply_final_review_hardening_extra.py
          python scripts/apply_final_review_type_fix.py
      - name: Remove temporary repair machinery
        run: git rm -f .github/workflows/final-review-hardening.yml scripts/apply_final_review_hardening.py scripts/apply_final_review_hardening_extra.py scripts/apply_final_review_type_fix.py
      - name: Format and focused regressions
        run: |
          python -m ruff check --fix contracts scripts skills tests
          python -m ruff format contracts scripts skills tests
          python -m ruff check contracts scripts skills tests
          python -m pytest -q \
            tests/test_atomic_claim_contract.py \
            tests/test_consumer_driven_contract_tools.py \
            tests/test_real_usage_followup_contracts.py \
            tests/test_real_usage_hardening.py \
            tests/test_practical_consumer_feedback.py \
            tests/test_decision_engine.py
      - name: Run full local gate
        run: python scripts/ci.py
      - name: Verify final tree
        run: |
          git diff --check
          test ! -e .github/workflows/final-review-hardening.yml
          test ! -e scripts/apply_final_review_hardening.py
          test ! -e scripts/apply_final_review_hardening_extra.py
          test ! -e scripts/apply_final_review_type_fix.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "fix: harden field-derived validation boundaries"
          git push origin HEAD:fix/unified-contract-release-hardening
