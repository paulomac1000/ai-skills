name: Apply exact-wheel container parity

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_apply-wheel-parity.yml

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install exact development graph
        run: python scripts/install_locked.py
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/wheel-parity.patch.gz.b64 > /tmp/wheel-parity.patch.gz
          printf '%s  %s\n' e2b921ee9311867276370d1e84249052ffd8b4438b457db1ff218d5303ee8905 /tmp/wheel-parity.patch.gz | sha256sum --check --strict
          gzip -dc /tmp/wheel-parity.patch.gz > /tmp/wheel-parity.patch
          git apply --binary /tmp/wheel-parity.patch
      - name: Format and inspect patch
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format \
            skills/mcp-server-architect/tools/generate_python_server.py \
            tests/test_mcp_generator.py
          python -m ruff check \
            skills/mcp-server-architect/tools/generate_python_server.py \
            tests/test_mcp_generator.py
          python -m ruff format --check \
            skills/mcp-server-architect/tools/generate_python_server.py \
            tests/test_mcp_generator.py
          git diff --check
      - name: Run complete repository gate
        run: python scripts/ci.py
      - name: Build exact wheel image and run official-client smoke
        run: python -m pytest tests/test_mcp_generator.py -m container -q
      - name: Commit verified target files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git add \
            skills/mcp-server-architect/SKILL.md \
            skills/mcp-server-architect/STANDARD.md \
            skills/mcp-server-architect/references/python-fastmcp.md \
            skills/mcp-server-architect/tools/generate_python_server.py \
            tests/test_mcp_generator.py
          test "$(git diff --cached --name-only | wc -l)" -eq 5
          git diff --cached --check
          git config user.name ai-skills-audit-bot
          git config user.email ai-skills-audit-bot@users.noreply.github.com
          git commit -m "fix: install verified wheel in generated container"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push \
            --force-with-lease=refs/heads/refactor/skills-cleanup:${PARENT_SHA} \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/refactor/skills-cleanup
