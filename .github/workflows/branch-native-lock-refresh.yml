name: Branch native lock refresh

on:
  push:
    branches:
      - fix/unified-contract-release-hardening

permissions:
  contents: read

env:
  BASE_TREE: b355475528425b52507a8933d535066237585c3d

concurrency:
  group: branch-native-lock-refresh
  cancel-in-progress: true

jobs:
  generate:
    name: Generate ${{ matrix.lock_id }}
    if: ${{ !contains(github.event.head_commit.message, '[native-locks-complete]') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.12'
            architecture: x64
            lock_id: linux-x64-py312
          - os: ubuntu-24.04
            python: '3.13'
            architecture: x64
            lock_id: linux-x64-py313
          - os: ubuntu-24.04
            python: '3.14'
            architecture: x64
            lock_id: linux-x64-py314
          - os: macos-15
            python: '3.12'
            architecture: arm64
            lock_id: macos-arm64-py312
          - os: windows-2025
            python: '3.12'
            architecture: x64
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Materialize staged source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import json
          import os
          import shutil
          import stat
          import urllib.request
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tree_sha = os.environ["BASE_TREE"]
          token = os.environ["GH_TOKEN"]

          def get_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          tree = get_json(f"{api}/repos/{repo}/git/trees/{tree_sha}?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("staged Git tree was truncated")
          for child in list(root.iterdir()):
              if child.name == ".git":
                  continue
              if child.is_dir() and not child.is_symlink():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          for entry in tree["tree"]:
              if entry.get("type") != "blob":
                  continue
              relative = PurePosixPath(entry["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe staged path: {relative}")
              blob = get_json(f"{api}/repos/{repo}/git/blobs/{entry['sha']}")
              content = base64.b64decode(blob["content"], validate=False)
              target = root.joinpath(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              if entry.get("mode") == "100755":
                  target.chmod(target.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
      - name: Install lock compiler
        run: python -m pip install "pip<26" pip-tools==7.6.0
      - name: Compile native locks
        run: python scripts/compile_locks.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: locks-${{ matrix.lock_id }}
          path: |
            requirements-dev-${{ matrix.lock_id }}.lock
            skills/mcp-server-architect/locks/runtime-${{ matrix.lock_id }}.lock
            skills/mcp-server-architect/locks/dev-${{ matrix.lock_id }}.lock
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish staged final tree
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/unified-contract-release-hardening
          fetch-depth: 2
          persist-credentials: true
      - name: Save staged authority payloads
        run: cp -R .transport "$RUNNER_TEMP/transport-payload"
      - name: Materialize staged source tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import shutil
          import stat
          import urllib.request
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tree_sha = os.environ["BASE_TREE"]
          token = os.environ["GH_TOKEN"]

          def get_json(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read())

          tree = get_json(f"{api}/repos/{repo}/git/trees/{tree_sha}?recursive=1")
          if tree.get("truncated"):
              raise SystemExit("staged Git tree was truncated")
          for child in list(root.iterdir()):
              if child.name == ".git":
                  continue
              if child.is_dir() and not child.is_symlink():
                  shutil.rmtree(child)
              else:
                  child.unlink()
          for entry in tree["tree"]:
              if entry.get("type") != "blob":
                  continue
              relative = PurePosixPath(entry["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe staged path: {relative}")
              blob = get_json(f"{api}/repos/{repo}/git/blobs/{entry['sha']}")
              content = base64.b64decode(blob["content"], validate=False)
              target = root.joinpath(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              if entry.get("mode") == "100755":
                  target.chmod(target.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY
      - name: Overlay final authority payloads
        run: |
          cp "$RUNNER_TEMP/transport-payload/adoption-assessment.schema.json" contracts/adoption-assessment.schema.json
          cp "$RUNNER_TEMP/transport-payload/validate_adoption.py" contracts/validate_adoption.py
          chmod +x contracts/validate_adoption.py
          cp "$RUNNER_TEMP/transport-payload/afds_validate.py" skills/afds-doc-writer/validate.py
          chmod +x skills/afds-doc-writer/validate.py
          cp "$RUNNER_TEMP/transport-payload/test_templates.py" tests/test_templates.py
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('contracts/adoption-assessment.schema.json')
          schema = json.loads(path.read_text(encoding='utf-8'))
          base = schema['$defs']['compatibility']['properties']
          properties = dict(base)
          properties.update({
              'command': {'type': 'string', 'minLength': 1},
              'evidence': {'oneOf': [{'type': 'null'}, {'$ref': '#/$defs/evidence'}]},
              'result': {'enum': ['passed', 'failed', 'not-run', 'not-applicable']},
          })
          schema['$defs']['compatibilityResult'] = {
              'type': 'object',
              'additionalProperties': False,
              'required': [*base.keys(), 'command', 'evidence', 'result'],
              'properties': properties,
          }
          path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: locks-*
          merge-multiple: true
          path: .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify and test final staged tree
        run: |
          set -euo pipefail
          test ! -e .transport
          test ! -e .github/workflows/branch-native-lock-refresh.yml
          test "$(grep -R -l 'build==1.5.1' requirements-dev-*.lock skills/mcp-server-architect/locks || true)" = ""
          grep -q 'build==1.5.0' requirements-dev-linux-x64-py312.lock
          python scripts/install_locked.py
          python -m compileall -q contracts scripts skills
          python skills/afds-doc-writer/validate.py --repository-root . --minimum-document-schema 2 README.md RECOVERY_AUDIT.md AGENTS.md contracts skills
          python -m pytest tests/test_adoption_contract.py tests/test_contract_edge_cases.py tests/test_afds_contract.py tests/test_afds_governance.py tests/test_afds_edge_cases.py tests/test_afds_profiles.py tests/test_afds_links.py tests/test_lock_contract.py tests/test_templates.py tests/test_final_audit_fixes.py
          git diff --check
      - name: Commit final staged tree
        run: |
          set -euo pipefail
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: enforce canonical contracts and repository self-compliance [native-locks-complete]'
          git push origin HEAD:fix/unified-contract-release-hardening
