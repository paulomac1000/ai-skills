name: Apply final audit fixes v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_apply-final-v2.yml
      - .github/materialize-final.py

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install exact formatter
        run: python -m pip install --require-hashes -r requirements-dev-linux.lock
      - name: Assemble and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-code.patch.part{00..07} > /tmp/final-code.patch.gz.b64
          test "$(wc -c < /tmp/final-code.patch.gz.b64)" -eq 52088
          base64 -d /tmp/final-code.patch.gz.b64 > /tmp/final-code.patch.gz
          printf '%s  %s\n' 99c77e28a69499c8b4f5b7dd9ee5e5452581369496fa05102650ae45f7fd9f4e /tmp/final-code.patch.gz | sha256sum --check --strict
          gzip -dc /tmp/final-code.patch.gz > /tmp/final-code.patch
          git apply --index --binary /tmp/final-code.patch
          cp .github/materialize-final.py /tmp/materialize-final.py
      - name: Verify native locks and final tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python /tmp/materialize-final.py stage
      - name: Install exact development graph
        run: python scripts/install_locked.py
      - name: Run complete local gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci.py 2>&1 | tee /tmp/final-gate.log
      - name: Upload final gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: final-gate-diagnostics-${{ github.run_id }}
          path: /tmp/final-gate.log
          if-no-files-found: warn
          retention-days: 1
      - name: Create verified clean commit object
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: python /tmp/materialize-final.py commit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: final-audit-fix-v2-${{ github.run_id }}
          path: final-commit.txt
          if-no-files-found: error
          retention-days: 1
