# ai-skills-policy-profile: trusted-ci
name: Consumer acceptance authority

on:
  workflow_call:
    inputs:
      candidate_repository:
        description: GitHub owner/name repository to assess.
        required: true
        type: string
      candidate_sha:
        description: Full lowercase SHA of the candidate revision to assess.
        required: true
        type: string
      assessment_path:
        description: Repository-relative adoption assessment path.
        required: false
        default: adoption-assessment.yaml
        type: string
      trust_lock_path:
        description: Repository-relative trusted executable source lock path.
        required: false
        default: trusted-executable-sources.lock.yaml
        type: string
      required_check:
        description: Optional provider status-check identity selected by the authority caller.
        required: false
        default: ''
        type: string
    secrets:
      consumer_read_token:
        description: Authority-owned read token for candidate contents, Actions, pull requests, and provider controls.
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: consumer-acceptance-${{ inputs.candidate_repository }}-${{ inputs.candidate_sha }}
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate authority-owned orchestration and candidate identity
        shell: bash
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_REF_PROTECTED: ${{ github.ref_protected }}
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONSUMER_READ_TOKEN: ${{ secrets.consumer_read_token }}
        run: |
          set -euo pipefail
          if [[ "$CALLER_REPOSITORY" != "$AUTHORITY_REPOSITORY" ]]; then
            echo "provider-backed acceptance must be orchestrated by the authority repository, not the candidate" >&2
            exit 1
          fi
          if [[ "$CALLER_SHA" != "$AUTHORITY_SHA" ]]; then
            echo "authority caller and reusable workflow must execute from the same immutable commit" >&2
            exit 1
          fi
          if [[ "$CALLER_REF_PROTECTED" != "true" ]]; then
            echo "authority orchestration must run from a provider-protected ref" >&2
            exit 1
          fi
          if [[ ! "$AUTHORITY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reusable workflow authority did not expose a full immutable SHA" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "candidate_repository must use GitHub owner/name syntax" >&2
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ -z "$CONSUMER_READ_TOKEN" ]]; then
            echo "consumer_read_token is required for provider-backed acceptance" >&2
            exit 1
          fi
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.candidate_repository }}
          ref: ${{ inputs.candidate_sha }}
          token: ${{ secrets.consumer_read_token }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout acceptance authority revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: authority
          persist-credentials: false
          fetch-depth: 1
      - name: Verify both immutable checkouts
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C authority rev-parse HEAD)" = "$AUTHORITY_SHA"
      - name: Set up authority runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: authority/requirements-dev-linux-x64-py312.lock
      - name: Install authority dependency graph
        working-directory: authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/install_locked.py
      - name: Bind candidate trust declaration to external authority
        shell: bash
        env:
          TRUST_LOCK_PATH: ${{ inputs.trust_lock_path }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python authority/contracts/validate_external_trust_lock.py "$TRUST_LOCK_PATH" \
            --candidate-root candidate \
            --candidate-repository "$CANDIDATE_REPOSITORY" \
            --candidate-revision "$CANDIDATE_SHA" \
            --authority-root authority \
            --expected-repository "$AUTHORITY_REPOSITORY" \
            --expected-revision "$AUTHORITY_SHA" \
            --require-authority-path contracts/validate_external_adoption.py \
            --require-authority-path skills/ci-cd-architect/tools/check_github_provider_controls.py
      - name: Verify provider-side branch and release-environment controls
        shell: bash
        env:
          AI_SKILLS_PROVIDER_TOKEN: ${{ secrets.consumer_read_token }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REQUIRED_CHECK: ${{ inputs.required_check }}
        run: |
          set -euo pipefail
          args=(candidate --repository "$CANDIDATE_REPOSITORY" --revision "$CANDIDATE_SHA" --token-env AI_SKILLS_PROVIDER_TOKEN)
          if [[ -n "$REQUIRED_CHECK" ]]; then
            args+=(--required-check "$REQUIRED_CHECK")
          fi
          python authority/skills/ci-cd-architect/tools/check_github_provider_controls.py "${args[@]}"
      - name: Verify provider-backed adoption and independent review
        shell: bash
        env:
          ASSESSMENT_PATH: ${{ inputs.assessment_path }}
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          AUTHORITY_REPOSITORY: ${{ job.workflow_repository }}
          AUTHORITY_SHA: ${{ job.workflow_sha }}
          AUTHORITY_WORKFLOW_PATH: ${{ job.workflow_file_path }}
          GITHUB_TOKEN: ${{ secrets.consumer_read_token }}
        run: |
          set -euo pipefail
          python authority/contracts/validate_external_adoption.py "$ASSESSMENT_PATH" \
            --candidate-root candidate \
            --candidate-repository "$CANDIDATE_REPOSITORY" \
            --candidate-revision "$CANDIDATE_SHA" \
            --authority-root authority \
            --authority-repository "$AUTHORITY_REPOSITORY" \
            --authority-revision "$AUTHORITY_SHA" \
            --authority-workflow-path "$AUTHORITY_WORKFLOW_PATH"
