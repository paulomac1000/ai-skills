name: Fix import order

on:
  push:
    branches: ["agent/fix-contract-consistency"]
    paths: [".github/workflows/fix-import-order.yml"]

permissions:
  contents: write

concurrency:
  group: fix-import-order
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-contract-consistency
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply Ruff import fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix \
            contracts/validate_conformance.py \
            skills/ci-cd-architect/tools/check_github_actions_policy.py
          python -m ruff check \
            contracts/validate_conformance.py \
            skills/ci-cd-architect/tools/check_github_actions_policy.py
          rm .github/workflows/fix-import-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: normalize import order"
          git push origin HEAD:agent/fix-contract-consistency
