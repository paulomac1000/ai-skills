name: Apply AGENTS.md review fixes

on:
  pull_request:
    paths:
      - '.github/workflows/_apply-agents-md-review-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install locked development graph
        run: python scripts/install_locked.py
      - name: Apply bounded review patch
        run: |
          cat .tmp/agents-md-fix/part0{0..6} | base64 --decode > /tmp/apply_agents_md_review_fixes.py
          base64 --decode .tmp/agents-md-fix/part07 > /tmp/supplement.py
          cat .tmp/agents-md-fix/part08a .tmp/agents-md-fix/part08b | base64 --decode > tests/test_agents_md_review_regressions.py
          python /tmp/apply_agents_md_review_fixes.py
          python /tmp/supplement.py
      - name: Apply canonical formatting
        run: >-
          python -m ruff format
          skills/agents-md-architect/tools
          tests/test_agents_md_validator.py
          tests/test_agents_md_audit.py
          tests/test_agents_md_composition_and_language.py
          tests/test_agents_md_review_regressions.py
      - name: Run focused lint
        run: >-
          python -m ruff check
          skills/agents-md-architect/tools
          tests/test_agents_md_validator.py
          tests/test_agents_md_audit.py
          tests/test_agents_md_discovery.py
          tests/test_agents_md_composition_and_language.py
          tests/test_agents_md_review_regressions.py
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_agents_md_validator.py
          tests/test_agents_md_audit.py
          tests/test_agents_md_discovery.py
          tests/test_agents_md_composition_and_language.py
          tests/test_agents_md_review_regressions.py
          tests/test_agents_md_standard.py
          tests/test_repository.py
      - name: Execute complete local gate
        run: python scripts/ci.py
      - name: Remove temporary patch machinery
        run: |
          rm -rf .tmp/agents-md-fix
          rm -f .github/workflows/_apply-agents-md-review-fixes.yml
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(agents-md): close final review findings'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
