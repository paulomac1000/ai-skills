name: Format evidence audit files

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_format-evidence-audit.yml

permissions:
  contents: write

jobs:
  format-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Format, verify, and publish exact files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python -m ruff format contracts/evidence.py contracts/validate_adoption.py
          python -m ruff check contracts/evidence.py contracts/validate_adoption.py
          python -m ruff format --check contracts/evidence.py contracts/validate_adoption.py
          python -m mypy contracts/evidence.py contracts/validate_adoption.py
          git add contracts/evidence.py contracts/validate_adoption.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -le 2
          git config user.name ai-skills-audit-bot
          git config user.email ai-skills-audit-bot@users.noreply.github.com
          git commit -m "style: apply pinned Ruff formatting to evidence contracts"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push \
            --force-with-lease=refs/heads/refactor/skills-cleanup:${PARENT_SHA} \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/refactor/skills-cleanup
