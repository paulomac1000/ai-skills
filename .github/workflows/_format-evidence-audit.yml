name: Format evidence audit files

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_format-evidence-audit.yml

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Format exact files
        run: python -m ruff format contracts/evidence.py contracts/validate_adoption.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-evidence-${{ github.run_id }}
          path: |
            contracts/evidence.py
            contracts/validate_adoption.py
          retention-days: 1
          if-no-files-found: error
