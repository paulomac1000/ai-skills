name: Steward Windows lock repair

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

concurrency:
  group: steward-windows-lock-repair
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  repair:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.302"
      - run: python scripts/install_locked.py
      - name: Patch constructor exception safety
        run: python scripts/_steward_windows_lock_patch.py
      - name: Verify exact generated .NET artifact on Windows
        run: python -m pytest -q tests/test_mcp_steward_dotnet_generator.py
      - name: Verify target diff and remove repair machinery
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -f .github/workflows/steward-windows-lock-repair.yml scripts/_steward_windows_lock_patch.py
          test ! -e .github/workflows/steward-windows-lock-repair.yml
          test ! -e scripts/_steward_windows_lock_patch.py
          git diff --check
          git diff --cached --check
      - name: Publish verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(steward): release owner lock on failed initialization"
          git push origin HEAD:feat/mcp-steward-architect
