name: Finalize AI Skills

# One-shot finalization workflow; removed from the final repository tree.
on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/skills-cleanup]
    paths:
      - ".github/finalize_ai_skills.py.gz.b64"
      - ".github/workflows/finalize-ai-skills.yml"

permissions:
  contents: read

concurrency:
  group: finalize-ai-skills-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'paulomac1000/ai-skills' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'refactor/skills-cleanup') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/refactor/skills-cleanup'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64
      - name: Decode and apply final patch
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          source = Path(".github/finalize_ai_skills.py.gz.b64").read_bytes()
          Path("/tmp/finalize_ai_skills.py").write_bytes(
              gzip.decompress(base64.b64decode(source))
          )
          PY
          python /tmp/finalize_ai_skills.py > finalizer.log 2>&1
      - name: Upload finalizer diagnostics
        if: steps.apply.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: finalizer-diagnostics-${{ github.run_id }}
          path: finalizer.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce patch application
        if: steps.apply.outcome != 'success'
        run: |
          cat finalizer.log
          exit 1
      - name: Install locked environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python scripts/install_locked.py
      - name: Format and lint touched Python
        shell: bash
        run: |
          files=(
            contracts/run_evidence_command.py
            contracts/write_evidence_report.py
            contracts/validate_adoption.py
            tests/test_run_evidence_command.py
            tests/test_repository_hygiene.py
            tests/test_write_evidence_report.py
            tests/test_evidence_verifier.py
            tests/test_contract_edge_cases.py
          )
          .venv/bin/python -m ruff format "${files[@]}"
          .venv/bin/python -m ruff check --fix "${files[@]}"
      - name: Stage final tree for git-aware tests
        run: git add -A
      - name: Run focused regressions
        shell: bash
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_run_evidence_command.py \
            tests/test_write_evidence_report.py \
            tests/test_repository_hygiene.py \
            tests/test_evidence_verifier.py \
            tests/test_contract_edge_cases.py
      - name: Validate repository entry documents
        run: .venv/bin/python skills/afds-doc-writer/validate.py AGENTS.md README.md CHANGELOG.md
      - name: Run full local gate
        run: .venv/bin/python scripts/ci.py
      - name: Commit and push final tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize production skill release"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
