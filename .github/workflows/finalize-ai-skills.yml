name: Finalize AI Skills

# One-shot finalization workflow; removed from the final repository tree.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finalize-ai-skills-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.repository == 'paulomac1000/ai-skills' &&
      github.event.pull_request.head.ref == 'refactor/skills-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64
      - name: Decode and apply final patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          chunks = sorted(Path(".github/finalizer-chunks").glob("*.txt"))
          if [path.name for path in chunks] != ["00.txt", "01.txt", "02.txt", "03.txt"]:
              raise SystemExit("expected exactly four ordered finalizer chunks")
          source = b"".join(path.read_bytes() for path in chunks)
          if len(source) != 15696:
              raise SystemExit(f"unexpected finalizer payload length: {len(source)}")
          digest = hashlib.sha256(source).hexdigest()
          if digest != "35cf30b2067ac6dadd0de824b64ab33ab88bbd58abada5819bddc96d1b3f6075":
              raise SystemExit(f"unexpected finalizer payload digest: {digest}")
          payload = gzip.decompress(base64.b64decode(source, validate=True))
          if hashlib.sha256(payload).hexdigest() != "5fdd3f956dd497905b5edfd83dfe2193b40af7a3534a75a75902e4e783887238":
              raise SystemExit("decoded finalizer digest mismatch")
          Path("/tmp/finalize_ai_skills.py").write_bytes(payload)
          PY
          python /tmp/finalize_ai_skills.py
          rm -rf .github/finalizer-chunks
          rm -f .github/finalize_ai_skills.py.gz.b64 .github/finalizer-error.txt finalizer.log
          rm -f .github/workflows/finalize-ai-skills.yml
      - name: Install locked environment
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python scripts/install_locked.py
      - name: Format and lint touched Python
        shell: bash
        run: |
          files=(
            contracts/run_evidence_command.py
            contracts/write_evidence_report.py
            contracts/validate_adoption.py
            tests/test_run_evidence_command.py
            tests/test_repository_hygiene.py
            tests/test_write_evidence_report.py
            tests/test_evidence_verifier.py
            tests/test_contract_edge_cases.py
          )
          .venv/bin/python -m ruff format "${files[@]}"
          .venv/bin/python -m ruff check --fix "${files[@]}"
      - name: Stage final tree for git-aware tests
        run: git add -A
      - name: Run focused regressions
        shell: bash
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_run_evidence_command.py \
            tests/test_write_evidence_report.py \
            tests/test_repository_hygiene.py \
            tests/test_evidence_verifier.py \
            tests/test_contract_edge_cases.py
      - name: Validate repository entry documents
        run: .venv/bin/python skills/afds-doc-writer/validate.py AGENTS.md README.md CHANGELOG.md
      - name: Run full local gate
        run: .venv/bin/python scripts/ci.py
      - name: Commit and push final tree
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize production skill release"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
