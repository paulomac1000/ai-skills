name: Decision Engine Quality Autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply-reviewed-fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/skills-cleanup'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/skills-cleanup
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Apply reviewed source transformation
        shell: bash
        run: |
          set -o pipefail
          python scripts/apply_decision_engine_quality_fix.py 2>&1 | tee decision-engine-autofix.log
      - name: Apply deterministic Ruff modernization and formatting
        run: |
          python -m pip install ruff==0.15.22
          python -m ruff check --fix --unsafe-fixes skills/mcp-server-consumer/tools/decision_engine.py
          python -m ruff format skills/mcp-server-consumer/tools/decision_engine.py
          python -m py_compile skills/mcp-server-consumer/tools/decision_engine.py
      - name: Publish only the reviewed source result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- skills/mcp-server-consumer/tools/decision_engine.py; then
            echo "Decision engine already matches the reviewed result."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/mcp-server-consumer/tools/decision_engine.py
          git commit -m "style: enforce consumer decision engine quality gates"
          git push origin HEAD:refactor/skills-cleanup
