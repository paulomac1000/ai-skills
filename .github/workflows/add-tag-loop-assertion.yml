name: Add exact tag loop assertion

on:
  push:
    branches: [fix/protected-container-release-policy]
    paths:
      - .github/workflows/add-tag-loop-assertion.yml

permissions:
  contents: write

concurrency:
  group: add-tag-loop-assertion
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/protected-container-release-policy
          fetch-depth: 0
      - name: Add only the missing assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_templates.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert 'docker push "$image_tag"' in push_script
          '''
          new = '''    assert 'docker push "$image_tag"' in push_script
              assert 'done <<< "$IMAGE_TAGS"' in push_script
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one assertion target, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit exact test change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_templates.py
          git diff --cached --quiet && exit 0
          git commit -m 'test(cicd): bind explicit tag loop input'
          git push origin HEAD:fix/protected-container-release-policy
