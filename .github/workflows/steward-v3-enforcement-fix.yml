name: Steward v3 enforcement repair

on:
  push:
    branches: [feat/mcp-steward-architect]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/mcp-steward-architect
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.302'
      - run: python scripts/install_locked.py
      - name: Apply fail-closed Steward enforcement patch
        run: python scripts/_steward_v3_enforcement_patch.py
      - name: Format patched Python enforcement sources
        run: >-
          python -m ruff format
          skills/mcp-steward-architect/tools/validate_steward.py
          skills/mcp-steward-architect/tools/generate_steward.py
          tests/test_mcp_steward_architect.py
          tests/test_mcp_steward_runtime_security.py
      - name: Exercise validator and generated Python runtime regressions
        run: >-
          python -m pytest -q
          tests/test_mcp_steward_architect.py
          tests/test_mcp_steward_runtime_security.py
          tests/test_mcp_steward_evidence_selectors.py
      - name: Build publish and smoke exact generated dotnet Steward
        run: python -m pytest -q tests/test_mcp_steward_dotnet_generator.py
      - name: Verify patched sources compile and diff is clean
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q skills/mcp-steward-architect/tools tests/test_mcp_steward_architect.py tests/test_mcp_steward_runtime_security.py
          git diff --check
      - name: Remove one-shot machinery and publish verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/_steward_v3_enforcement_patch.py .github/workflows/steward-v3-enforcement-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(steward): enforce v3 mutation and evidence gates end to end"
          git push origin HEAD:feat/mcp-steward-architect
