name: Format protected release policy

on:
  push:
    branches: [fix/protected-container-release-policy]
    paths:
      - .github/workflows/format-protected-release-policy.yml

permissions:
  contents: write

concurrency:
  group: format-protected-release-policy
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/protected-container-release-policy
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python scripts/install_locked.py
      - name: Format changed policy files
        run: python -m ruff format skills/ci-cd-architect/tools/check_github_actions_policy_impl.py tests/test_ci_cd_workflow_policy.py
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add skills/ci-cd-architect/tools/check_github_actions_policy_impl.py tests/test_ci_cd_workflow_policy.py
          git diff --cached --quiet && exit 0
          git commit -m 'style(cicd): format protected release policy'
          git push origin HEAD:fix/protected-container-release-policy
