name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deterministic dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts skills
      - name: Validate governed documentation
        run: >-
          python skills/afds-doc-writer/validate.py
          README.md RECOVERY_AUDIT.md skills
      - name: Verify generated Python MCP server end to end
        run: python -m pytest -q tests/test_mcp_generator.py
      - name: Verify language-neutral migration invariants
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_language_neutral_standard_owns_migration_invariants
      - name: Verify manifest migration invariants
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_manifest_contract_rejects_class_wide_optimistic_defaults
      - name: Verify Python profile migration invariants
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_python_profile_covers_real_migration_failure_modes
      - name: Verify transport migration invariants
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_transport_contract_prevents_adapter_policy_drift
      - name: Verify runtime boundary invariants
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_runtime_boundary_contract_covers_files_tasks_sessions_and_browsers
      - name: Verify server archetype coverage
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_simulation_covers_each_server_archetype
      - name: Verify migration test evidence
        run: >-
          python -m pytest -q
          tests/test_mcp_migration_standard.py::test_testing_strategy_has_executable_migration_evidence
      - name: Run remaining repository tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_mcp_generator.py
          --ignore=tests/test_mcp_migration_standard.py
