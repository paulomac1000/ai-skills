name: Stage verified production workflow blob

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stage-verified-production-workflow
  cancel-in-progress: false

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out writable PR branch for blob staging only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          persist-credentials: true
      - name: Download verified final tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30772531446
          name: verified-dependency-refresh-30772531446
          path: verified-refresh
      - name: Verify and stage exact workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          cd verified-refresh
          test "$(cat dependency-refresh-base.txt)" = "8533e6f4885ab694e34cb70533576d5eb15e73cb"
          sha256sum -c dependency-refresh.sha256
          cd ..
          mkdir -p .ci-final
          cp verified-refresh/final-tree/.github/workflows/ci.yml .ci-final/ci.yml
          test "$(head -n 1 .ci-final/ci.yml)" = "name: CI"
          rm -rf verified-refresh
      - name: Commit neutral-path workflow blob
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-final/ci.yml
          test "$(git diff --cached --name-only)" = ".ci-final/ci.yml"
          git commit -m "chore(ci): stage verified production workflow blob"
          git push origin "HEAD:${BRANCH}"
