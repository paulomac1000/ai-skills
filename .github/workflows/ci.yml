name: Build verified dependency refresh

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-verified-dependency-refresh
  cancel-in-progress: true

jobs:
  locks:
    name: Build locks (${{ matrix.lock_id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            python: "3.12"
            lock_id: linux-x64-py312
          - os: ubuntu-24.04
            architecture: x64
            python: "3.13"
            lock_id: linux-x64-py313
          - os: ubuntu-24.04
            architecture: x64
            python: "3.14"
            lock_id: linux-x64-py314
          - os: macos-15
            architecture: arm64
            python: "3.12"
            lock_id: macos-arm64-py312
          - os: windows-2025
            architecture: x64
            python: "3.12"
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out exact branch revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up target Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install current locked compiler toolchain
        shell: bash
        run: python scripts/install_locked.py
      - name: Apply selected dependency policy
        shell: bash
        run: python .github/scripts/refresh_dependency_set.py
      - name: Compile exact platform locks
        shell: bash
        env:
          LOCK_ID: ${{ matrix.lock_id }}
        run: |
          set -euo pipefail
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file "requirements-dev-${LOCK_ID}.lock" \
            requirements-dev.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file "skills/mcp-server-architect/locks/runtime-${LOCK_ID}.lock" \
            skills/mcp-server-architect/locks/python-runtime.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file "skills/mcp-server-architect/locks/dev-${LOCK_ID}.lock" \
            skills/mcp-server-architect/locks/python-dev.in
      - name: Validate lock structure
        shell: bash
        run: python -m pytest -q tests/test_lock_contract.py
      - name: Stage target lock artifact
        shell: bash
        env:
          LOCK_ID: ${{ matrix.lock_id }}
        run: |
          set -euo pipefail
          mkdir -p lock-output/skills/mcp-server-architect/locks
          cp "requirements-dev-${LOCK_ID}.lock" lock-output/
          cp "skills/mcp-server-architect/locks/runtime-${LOCK_ID}.lock" \
            lock-output/skills/mcp-server-architect/locks/
          cp "skills/mcp-server-architect/locks/dev-${LOCK_ID}.lock" \
            lock-output/skills/mcp-server-architect/locks/
      - name: Upload target locks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: locks-${{ matrix.lock_id }}
          path: lock-output/
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Verify complete dependency patch
    needs: locks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact branch revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Download all verified lock artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: locks-*
          path: lock-artifacts
          merge-multiple: true
      - name: Assemble final production tree
        shell: bash
        env:
          RESTORE_PRODUCTION_CI: "1"
        run: |
          set -euo pipefail
          cp -R lock-artifacts/. .
          python .github/scripts/refresh_dependency_set.py
          rm .github/scripts/refresh_dependency_set.py
          git add -A
      - name: Install refreshed locked development graph
        run: python scripts/install_locked.py
      - name: Execute complete repository gate
        run: python scripts/ci.py
      - name: Verify selected versions and immutable action pins
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_lock_contract.py \
            tests/test_ci_quality_scope.py \
            tests/test_repository_hygiene.py
          git diff --check
          grep -q 'mcp==2.0.0' requirements-dev.in
          grep -q 'mcp==2.0.0' skills/mcp-server-architect/locks/python-runtime.in
          grep -q 'ruff==0.16.0' requirements-dev.in
          grep -q 'types-PyYAML==6.0.12.20260724' requirements-dev.in
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/ci.yml
          grep -q 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' .github/workflows/ci.yml
          grep -q 'actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68' .github/workflows/ci.yml
          test ! -e .github/scripts/refresh_dependency_set.py
      - name: Build auditable binary patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --binary > dependency-refresh.patch
          test -s dependency-refresh.patch
          git diff --cached --name-status > dependency-refresh-files.txt
          git rev-parse HEAD > dependency-refresh-base.txt
          sha256sum dependency-refresh.patch > dependency-refresh.sha256
      - name: Upload verified dependency patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-dependency-refresh-${{ github.run_id }}
          path: |
            dependency-refresh.patch
            dependency-refresh-files.txt
            dependency-refresh-base.txt
            dependency-refresh.sha256
          if-no-files-found: error
          retention-days: 2
