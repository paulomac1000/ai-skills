name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deterministic dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts skills
      - name: Validate governed documentation
        shell: bash
        run: |
          set -o pipefail
          python skills/afds-doc-writer/validate.py README.md RECOVERY_AUDIT.md skills 2>&1 | tee validator.log
      - name: Upload documentation validator diagnostics
        if: always() && hashFiles('validator.log') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation-validator-${{ github.run_id }}
          path: validator.log
          retention-days: 3
      - name: Verify generated Python MCP server end to end
        run: python -m pytest -q tests/test_mcp_generator.py --junitxml=python-generator-junit.xml
      - name: Upload Python generator diagnostics
        if: always() && hashFiles('python-generator-junit.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-generator-junit-${{ github.run_id }}
          path: python-generator-junit.xml
          retention-days: 3
      - name: Verify language-neutral migration invariants
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_language_neutral_standard_owns_migration_invariants
      - name: Verify manifest migration invariants
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_manifest_contract_rejects_class_wide_optimistic_defaults
      - name: Verify Python profile migration invariants
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_python_profile_covers_real_migration_failure_modes
      - name: Verify .NET profile migration invariants
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_dotnet_profile_covers_executable_sdk_and_host_failure_modes
      - name: Verify transport migration invariants
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_transport_contract_prevents_adapter_policy_drift
      - name: Verify runtime boundary invariants
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_runtime_boundary_contract_covers_files_tasks_sessions_and_browsers
      - name: Verify Python server archetype coverage
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_python_simulation_covers_each_server_archetype
      - name: Verify .NET server archetype coverage
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_dotnet_simulation_covers_distinct_archetypes_and_sdk_boundaries
      - name: Verify migration test evidence
        run: python -m pytest -q tests/test_mcp_migration_standard.py::test_testing_strategy_has_executable_migration_evidence
      - name: Run remaining repository tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_mcp_generator.py
          --ignore=tests/test_mcp_dotnet_generator.py
          --ignore=tests/test_mcp_migration_standard.py
          --junitxml=repository-junit.xml
      - name: Upload repository diagnostics
        if: always() && hashFiles('repository-junit.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-junit-${{ github.run_id }}
          path: repository-junit.xml
          retention-days: 3

  dotnet-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate, build, publish, and invoke .NET MCP server
        run: python -m pytest -q tests/test_mcp_dotnet_generator.py --junitxml=dotnet-generator-junit.xml
      - name: Upload .NET generator diagnostics
        if: always() && hashFiles('dotnet-generator-junit.xml') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-generator-junit-${{ github.run_id }}
          path: dotnet-generator-junit.xml
          retention-days: 3

  audit-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/skills-cleanup'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/skills-cleanup
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply reviewed fixes and materialize exact locks
        run: python scripts/apply_audit_fixes.py
      - name: Run focused regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv \
            tests/test_consumer_retry_and_annotations.py \
            tests/test_mcp_dotnet_runtime_contracts.py \
            tests/test_mcp_dotnet_generator.py \
            --junitxml=audit-fixes-junit.xml 2>&1 | tee audit-fixes.log
      - name: Upload focused audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-fixes-${{ github.run_id }}
          path: |
            audit-fixes.log
            audit-fixes-junit.xml
          if-no-files-found: error
          retention-days: 3
      - name: Run full repository gate
        run: python scripts/ci.py
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git add skills tests
          if git diff --cached --quiet; then
            echo "Audit fixes already applied; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close MCP retry and manifest evidence gaps"
          git push origin HEAD:refactor/skills-cleanup
