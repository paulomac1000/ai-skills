name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-fixes:
    if: github.event_name == 'pull_request' && github.head_ref == 'refactor/skills-cleanup'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refactor/skills-cleanup
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply reviewed fixes and materialize exact locks
        run: python scripts/apply_audit_fixes.py && python scripts/parameterize_lock_templates.py
      - name: Run focused regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv \
            tests/test_consumer_retry_and_annotations.py \
            tests/test_mcp_dotnet_runtime_contracts.py \
            tests/test_mcp_dotnet_generator.py \
            --junitxml=audit-fixes-junit.xml 2>&1 | tee audit-fixes.log
      - name: Run full repository gate
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci.py 2>&1 | tee full-gate.log
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-fixes-${{ github.run_id }}
          path: |
            audit-fixes.log
            audit-fixes-junit.xml
            full-gate.log
            skills/mcp-server-architect/tools/dotnet-template/src/__NAMESPACE__.Mcp.Server/packages.lock.json.template
            skills/mcp-server-architect/tools/dotnet-template/tests/__NAMESPACE__.Mcp.Smoke/packages.lock.json.template
          if-no-files-found: error
          retention-days: 3
      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git add skills tests
          if git diff --cached --quiet; then
            echo "Audit fixes already applied; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close MCP retry and manifest evidence gaps"
          git push origin HEAD:refactor/skills-cleanup
