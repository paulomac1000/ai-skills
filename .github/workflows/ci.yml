name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install complete hashed development graph
        run: python scripts/install_locked.py
      - name: Verify merge-result revision
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Lint production Python
        id: ruff_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check contracts scripts \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            2>&1 | tee ruff-lint.txt
      - name: Verify production Python formatting
        id: ruff_format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff format --check contracts scripts \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            2>&1 | tee ruff-format.txt
      - name: Type-check public and policy-critical Python
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m mypy \
            contracts/semver.py contracts/evidence.py contracts/validate_adoption.py \
            scripts/ci.py scripts/install_locked.py scripts/select_lock.py \
            skills/afds-doc-writer/validate.py \
            skills/mcp-server-consumer/tools/decision_engine.py \
            skills/mcp-server-architect/tools/generate_python_server.py \
            skills/mcp-server-architect/tools/generate_python_server_impl.py \
            skills/mcp-server-architect/tools/generate_dotnet_server.py \
            2>&1 | tee mypy.txt
      - name: Scan Python for high-confidence high-severity issues
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m bandit -q -lll -iii -r \
            contracts scripts skills/afds-doc-writer \
            skills/mcp-server-consumer/tools skills/mcp-server-architect/tools \
            2>&1 | tee bandit.txt
      - name: Audit complete development lock
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LOCK=$(python scripts/select_lock.py)
          python -m pip_audit -r "$LOCK" --progress-spinner off \
            2>&1 | tee pip-audit.txt
      - name: Upload Python quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-quality-diagnostics-${{ github.run_id }}
          path: |
            ruff-lint.txt
            ruff-format.txt
            mypy.txt
            bandit.txt
            pip-audit.txt
          if-no-files-found: error
          retention-days: 3
      - name: Enforce Python quality outcomes
        if: always()
        shell: bash
        env:
          RUFF_LINT: ${{ steps.ruff_lint.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          BANDIT: ${{ steps.bandit.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
        run: |
          set -euo pipefail
          test "$RUFF_LINT" = success
          test "$RUFF_FORMAT" = success
          test "$MYPY" = success
          test "$BANDIT" = success
          test "$DEPENDENCY_AUDIT" = success

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Compile Python sources
        run: python -m compileall -q contracts scripts skills
      - name: Validate governed documentation
        run: python skills/afds-doc-writer/validate.py README.md RECOVERY_AUDIT.md contracts skills
      - name: Validate exact generated Python wheel
        run: python -m pytest tests/test_mcp_generator.py -m "not container" --junitxml=python-generator-junit.xml
      - name: Verify all migration and adoption invariants
        run: >-
          python -m pytest
          tests/test_mcp_migration_standard.py
          tests/test_mcp_migration_assessment.py
          tests/test_adoption_contract.py
          tests/test_semver_contract.py
          tests/test_lock_contract.py
          tests/test_rule_catalog_contract.py
          tests/test_evidence_verifier.py
          --junitxml=adoption-junit.xml
      - name: Run repository tests with branch coverage
        run: >-
          python -m coverage run --branch -m pytest
          -m "not container"
          --ignore=tests/test_mcp_generator.py
          --ignore=tests/test_mcp_dotnet_generator.py
          --junitxml=repository-junit.xml
      - name: Enforce policy-critical coverage
        run: >-
          python -m coverage report
          --include="contracts/*.py,skills/afds-doc-writer/*.py,skills/mcp-server-consumer/tools/*.py"
          --fail-under=80
      - name: Enforce generator-core coverage
        run: >-
          python -m coverage report
          --include="skills/mcp-server-architect/tools/generate_python_server.py,skills/mcp-server-architect/tools/generate_python_server_impl.py,skills/mcp-server-architect/tools/generate_dotnet_server.py"
          --fail-under=85
      - name: Enforce CI-helper coverage
        run: >-
          python -m coverage report
          --include="scripts/*.py"
          --fail-under=75
      - name: Upload repository diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-diagnostics-${{ github.run_id }}
          path: |
            *-junit.xml
            .coverage
          if-no-files-found: warn
          retention-days: 3

  exact-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - run: python scripts/install_locked.py
      - name: Verify exact branch head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Execute complete local gate on exact head
        run: python scripts/ci.py

  compatibility-python:
    name: Python compatibility (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            python: "3.12"
            lock_id: linux-x64-py312
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            python: "3.13"
            lock_id: linux-x64-py313
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            python: "3.14"
            lock_id: linux-x64-py314
          - os: macos-15
            operating_system: macos
            architecture: arm64
            python: "3.12"
            lock_id: macos-arm64-py312
          - os: windows-2025
            operating_system: windows
            architecture: x64
            python: "3.12"
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev-${{ matrix.lock_id }}.lock
      - run: python scripts/install_locked.py
      - name: Run full Python contract suite for declared compatibility
        run: >-
          python -m pytest -m "not container"
          --ignore=tests/test_mcp_dotnet_generator.py
          --ignore=tests/test_mcp_dotnet_runtime_contracts.py
          --junitxml=compatibility-${{ matrix.lock_id }}.xml
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compatibility-${{ matrix.lock_id }}-${{ github.run_id }}
          path: compatibility-${{ matrix.lock_id }}.xml
          if-no-files-found: error
          retention-days: 7

  generator-filesystem-contracts:
    name: Generator filesystem contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            lock_id: linux-x64-py312
          - os: macos-15
            architecture: arm64
            lock_id: macos-arm64-py312
          - os: windows-2025
            architecture: x64
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev-${{ matrix.lock_id }}.lock
      - run: python scripts/install_locked.py
      - name: Exercise atomic no-replace publication and namespace rendering
        run: >-
          python -m pytest
          tests/test_mcp_generator.py::test_generator_concurrent_create_has_one_winner_and_never_replaces
          tests/test_mcp_dotnet_generator.py::test_generator_concurrent_create_has_one_winner_and_never_replaces
          tests/test_mcp_dotnet_generator.py::test_generator_preserves_competing_target_created_before_publish
          tests/test_mcp_dotnet_namespace.py
          --junitxml=filesystem-${{ matrix.lock_id }}.xml
      - name: Upload filesystem-contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: filesystem-${{ matrix.lock_id }}-${{ github.run_id }}
          path: filesystem-${{ matrix.lock_id }}.xml
          if-no-files-found: error
          retention-days: 7

  dotnet-generator:
    name: .NET artifact (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            dotnet: "10.0.302"
            lock_id: linux-x64-py312
          - os: macos-15
            operating_system: macos
            architecture: arm64
            dotnet: "10.0.302"
            lock_id: macos-arm64-py312
          - os: windows-2025
            operating_system: windows
            architecture: x64
            dotnet: "10.0.302"
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev-${{ matrix.lock_id }}.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: python scripts/install_locked.py
      - name: Generate, restore, build, publish, and invoke exact .NET artifact
        run: >-
          python -m pytest tests/test_mcp_dotnet_generator.py tests/test_mcp_dotnet_runtime_contracts.py
          --junitxml=dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}.xml
      - name: Upload .NET artifact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}.xml
          if-no-files-found: error
          retention-days: 7

  python-container-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Build non-root generated image and invoke through official MCP client
        run: python -m pytest tests/test_mcp_generator.py -m container --junitxml=python-container.xml
      - name: Upload container-artifact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-container-${{ github.run_id }}
          path: python-container.xml
          if-no-files-found: error
          retention-days: 7
