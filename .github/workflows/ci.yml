name: Refresh consolidated dependencies

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: refresh-consolidated-dependencies
  cancel-in-progress: false

jobs:
  locks:
    name: Refresh locks (${{ matrix.lock_id }})
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            python: "3.12"
            lock_id: linux-x64-py312
          - os: ubuntu-24.04
            architecture: x64
            python: "3.13"
            lock_id: linux-x64-py313
          - os: ubuntu-24.04
            architecture: x64
            python: "3.14"
            lock_id: linux-x64-py314
          - os: macos-15
            architecture: arm64
            python: "3.12"
            lock_id: macos-arm64-py312
          - os: windows-2025
            architecture: x64
            python: "3.12"
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out current writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up target Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Install current locked toolchain
        shell: bash
        run: python scripts/install_locked.py
      - name: Apply selected dependency versions
        shell: bash
        run: python .github/scripts/refresh_dependency_set.py
      - name: Compile exact platform locks
        shell: bash
        env:
          LOCK_ID: ${{ matrix.lock_id }}
        run: |
          set -euo pipefail
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file "requirements-dev-${LOCK_ID}.lock" \
            requirements-dev.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file "skills/mcp-server-architect/locks/runtime-${LOCK_ID}.lock" \
            skills/mcp-server-architect/locks/python-runtime.in
          python -m piptools compile \
            --allow-unsafe \
            --generate-hashes \
            --strip-extras \
            --output-file "skills/mcp-server-architect/locks/dev-${LOCK_ID}.lock" \
            skills/mcp-server-architect/locks/python-dev.in
      - name: Validate lock structure
        shell: bash
        run: python -m pytest -q tests/test_lock_contract.py
      - name: Commit target locks
        shell: bash
        env:
          LOCK_ID: ${{ matrix.lock_id }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "requirements-dev-${LOCK_ID}.lock" \
            "skills/mcp-server-architect/locks/runtime-${LOCK_ID}.lock" \
            "skills/mcp-server-architect/locks/dev-${LOCK_ID}.lock"
          git diff --cached --quiet && { echo "No lock changes for ${LOCK_ID}"; exit 1; }
          git commit -m "build(deps): refresh ${LOCK_ID} locks"
          git push origin "HEAD:${BRANCH}"

  aggregate:
    name: Validate and publish dependency refresh
    needs: locks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out latest writable branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: x64
      - name: Install refreshed locked toolchain
        run: python scripts/install_locked.py
      - name: Apply versions and restore production CI
        env:
          RESTORE_PRODUCTION_CI: "1"
        run: python .github/scripts/refresh_dependency_set.py
      - name: Preserve verified production workflow blob
        run: |
          mkdir -p .ci-final
          cp .github/workflows/ci.yml .ci-final/ci.yml
          rm .github/scripts/refresh_dependency_set.py
          git add -A
      - name: Run complete repository gate
        run: python scripts/ci.py
      - name: Verify dependency policy and clean diff
        run: |
          python -m pytest -q tests/test_lock_contract.py tests/test_ci_quality_scope.py tests/test_repository_hygiene.py
          git diff --check
          grep -q 'mcp==2.0.0' requirements-dev.in
          grep -q 'mcp==2.0.0' skills/mcp-server-architect/locks/python-runtime.in
          grep -q 'ruff==0.16.0' requirements-dev.in
          grep -q 'types-PyYAML==6.0.12.20260724' requirements-dev.in
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .ci-final/ci.yml
          grep -q 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' .ci-final/ci.yml
          grep -q 'actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68' .ci-final/ci.yml
      - name: Commit verified non-workflow changes
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset
          git add -A
          git reset .github/workflows/ci.yml
          git diff --cached --quiet && { echo "No dependency changes to commit"; exit 1; }
          git commit -m "build(deps): adopt current supported toolchain"
          git push origin "HEAD:${BRANCH}"
