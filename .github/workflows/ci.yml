name: Apply final PR18 review fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-final-pr18-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact triggering revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install locked development graph
        run: python scripts/install_locked.py

      - name: Apply readable atomic transformations
        run: python .github/scripts/pr18_apply_bot_fixes.py

      - name: Format and lint changed Python
        run: |
          python -m ruff format \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/discover_repository.py \
            tests/test_agents_md_codex_followup.py
          python -m ruff check \
            skills/agents-md-architect/tools/audit_agents_md.py \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/discover_repository.py \
            tests/test_agents_md_codex_followup.py

      - name: Run focused reviewer regressions
        run: |
          python -m pytest -q \
            tests/test_agents_md_codex_followup.py \
            tests/test_agents_md_audit.py \
            tests/test_agents_md_discovery.py \
            tests/test_agents_md_validator.py

      - name: Restore production CI and remove temporary machinery
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/apply-pr18-bot-fixes.yml
          rm -f .github/scripts/pr18_apply_bot_fixes.py
          git add -A

      - name: Execute complete repository gate
        run: python scripts/ci.py

      - name: Verify clean production tree
        run: |
          git diff --check
          test ! -e .github/workflows/apply-pr18-bot-fixes.yml
          test ! -e .github/scripts/pr18_apply_bot_fixes.py
          grep -q '^name: CI$' .github/workflows/ci.yml
          git status --short

      - name: Commit verified production fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(agents-md): address latest bot review"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
