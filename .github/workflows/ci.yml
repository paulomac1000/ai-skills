name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install complete hashed development graph
        run: python scripts/install_locked.py
      - name: Verify assessed source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Lint production Python
        id: ruff_lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff check $(python scripts/quality_targets.py quality) \
            2>&1 | tee ruff-lint.txt
      - name: Verify production Python formatting
        id: ruff_format
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m ruff format --check $(python scripts/quality_targets.py quality) \
            2>&1 | tee ruff-format.txt
      - name: Type-check public and policy-critical Python
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m mypy $(python scripts/quality_targets.py typing) \
            2>&1 | tee mypy.txt
      - name: Scan Python for high-confidence high-severity issues
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m bandit -q -lll -iii -r $(python scripts/quality_targets.py bandit) \
            2>&1 | tee bandit.txt
      - name: Audit complete development lock
        id: dependency_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LOCK=$(python scripts/select_lock.py)
          python -m pip_audit -r "$LOCK" --progress-spinner off \
            2>&1 | tee pip-audit.txt
      - name: Upload Python quality diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-quality-diagnostics-${{ github.run_id }}
          path: |
            ruff-lint.txt
            ruff-format.txt
            mypy.txt
            bandit.txt
            pip-audit.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce Python quality outcomes
        if: always()
        shell: bash
        env:
          RUFF_LINT: ${{ steps.ruff_lint.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          MYPY: ${{ steps.mypy.outcome }}
          BANDIT: ${{ steps.bandit.outcome }}
          DEPENDENCY_AUDIT: ${{ steps.dependency_audit.outcome }}
        run: |
          set -euo pipefail
          test "$RUFF_LINT" = success
          test "$RUFF_FORMAT" = success
          test "$MYPY" = success
          test "$BANDIT" = success
          test "$DEPENDENCY_AUDIT" = success

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Compile Python sources
        run: python -m compileall -q contracts scripts skills
      - name: Validate governed documentation
        run: python skills/afds-doc-writer/validate.py README.md RECOVERY_AUDIT.md contracts skills
      - name: Validate exact generated Python wheel
        run: >-
          python contracts/run_evidence_command.py
          --execution-id python-generator
          --result-file python-generator-junit.xml
          --output evidence/executions/python-generator.json
          -- python -m pytest tests/test_mcp_generator.py -m "not container"
          --junitxml=python-generator-junit.xml
      - name: Verify all migration and adoption invariants
        run: >-
          python contracts/run_evidence_command.py
          --execution-id adoption
          --result-file adoption-junit.xml
          --output evidence/executions/adoption.json
          -- python -m pytest
          tests/test_mcp_migration_standard.py
          tests/test_mcp_migration_assessment.py
          tests/test_adoption_contract.py
          tests/test_agents_md_release_contract.py
          tests/test_semver_contract.py
          tests/test_lock_contract.py
          tests/test_rule_catalog_contract.py
          tests/test_evidence_verifier.py
          --junitxml=adoption-junit.xml
      - name: Run repository tests with branch coverage
        run: >-
          python contracts/run_evidence_command.py
          --execution-id repository
          --result-file repository-junit.xml
          --output evidence/executions/repository.json
          -- python -m coverage run --branch -m pytest
          -m "not container"
          --ignore=tests/test_mcp_generator.py
          --ignore=tests/test_mcp_dotnet_generator.py
          --junitxml=repository-junit.xml
      - name: Enforce policy-critical coverage
        run: >-
          python -m coverage report
          --include="$(python scripts/quality_targets.py policy-coverage)"
          --fail-under=80
      - name: Enforce generator-core coverage
        run: >-
          python -m coverage report
          --include="skills/mcp-server-architect/tools/generate_python_server.py,skills/mcp-server-architect/tools/generate_python_server_impl.py,skills/mcp-server-architect/tools/generate_dotnet_server.py"
          --fail-under=85
      - name: Enforce CI-helper coverage
        run: >-
          python -m coverage report
          --include="scripts/*.py"
          --fail-under=75
      - name: Write machine-bound repository evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python -m coverage xml -o coverage.xml
          python contracts/write_evidence_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --tested-checkout-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event "$GITHUB_EVENT_NAME" \
            --job-name python \
            --lane repository-rules \
            --claims-profile repository-rules \
            --execution-record evidence/executions/python-generator.json \
            --execution-record evidence/executions/adoption.json \
            --execution-record evidence/executions/repository.json \
            --output evidence/report.json
      - name: Upload repository diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-diagnostics-${{ github.run_id }}
          path: |
            *-junit.xml
            coverage.xml
            evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  exact-head:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.302"
      - run: python scripts/install_locked.py
      - name: Verify exact branch head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify stable release versions changed with shipped contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python scripts/check_release_version.py --base "$BASE_SHA"
      - name: Execute complete local gate on exact head
        run: python scripts/ci.py

  consumer-canaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Inspect immutable real-consumer canaries without executing them
        run: >-
          python skills/mcp-server-architect/tools/check_consumer_canaries.py
          --catalog contracts/consumer-canaries.yaml
          --workspace "${RUNNER_TEMP}/ai-skills-consumer-canaries"
      - name: Upload consumer discovery reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: consumer-canary-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-skills-consumer-canaries/*.discovery.json
          if-no-files-found: error
          retention-days: 30

  compatibility-python:
    name: Python compatibility (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            python: "3.12"
            lock_id: linux-x64-py312
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            python: "3.13"
            lock_id: linux-x64-py313
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            python: "3.14"
            lock_id: linux-x64-py314
          - os: macos-15
            operating_system: macos
            architecture: arm64
            python: "3.12"
            lock_id: macos-arm64-py312
          - os: windows-2025
            operating_system: windows
            architecture: x64
            python: "3.12"
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev-${{ matrix.lock_id }}.lock
      - run: python scripts/install_locked.py
      - name: Run full Python contract suite for declared compatibility
        run: >-
          python contracts/run_evidence_command.py
          --execution-id compatibility
          --result-file compatibility-${{ matrix.lock_id }}.xml
          --output evidence/executions/compatibility.json
          -- python -m pytest -m "not container"
          --ignore=tests/test_mcp_dotnet_generator.py
          --ignore=tests/test_mcp_dotnet_runtime_contracts.py
          --junitxml=compatibility-${{ matrix.lock_id }}.xml
      - name: Write machine-bound compatibility evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_SUBJECT: ${{ matrix.operating_system }}|${{ matrix.architecture }}|python|${{ matrix.python }}|python-compatibility
        run: |
          set -euo pipefail
          python contracts/write_evidence_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --tested-checkout-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event "$GITHUB_EVENT_NAME" \
            --job-name "Python compatibility (${{ matrix.os }}, ${{ matrix.python }})" \
            --lane python-compatibility \
            --dynamic-kind compatibility \
            --dynamic-subject "$EVIDENCE_SUBJECT" \
            --dynamic-execution-id compatibility \
            --dynamic-operating-system "${{ matrix.operating_system }}" \
            --dynamic-architecture "${{ matrix.architecture }}" \
            --dynamic-runtime python \
            --dynamic-version "${{ matrix.python }}" \
            --dynamic-lane python-compatibility \
            --execution-record evidence/executions/compatibility.json \
            --output evidence/report.json
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compatibility-${{ matrix.lock_id }}-${{ github.run_id }}
          path: |
            compatibility-${{ matrix.lock_id }}.xml
            evidence/
          if-no-files-found: error
          retention-days: 90

  generator-filesystem-contracts:
    name: Generator filesystem contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            lock_id: linux-x64-py312
          - os: macos-15
            architecture: arm64
            lock_id: macos-arm64-py312
          - os: windows-2025
            architecture: x64
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev-${{ matrix.lock_id }}.lock
      - run: python scripts/install_locked.py
      - name: Exercise atomic no-replace publication and namespace rendering
        run: >-
          python contracts/run_evidence_command.py
          --execution-id filesystem
          --result-file filesystem-junit.xml
          --output evidence/executions/filesystem.json
          -- python -m pytest
          tests/test_mcp_generator.py::test_generator_concurrent_create_has_one_winner_and_never_replaces
          tests/test_mcp_dotnet_generator.py::test_generator_concurrent_create_has_one_winner_and_never_replaces
          tests/test_mcp_dotnet_generator.py::test_generator_preserves_competing_target_created_before_publish
          tests/test_mcp_dotnet_namespace.py
          --junitxml=filesystem-junit.xml
      - name: Write machine-bound filesystem evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python contracts/write_evidence_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --tested-checkout-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event "$GITHUB_EVENT_NAME" \
            --job-name "Generator filesystem contracts (${{ matrix.os }})" \
            --lane filesystem-contracts \
            --claims-profile filesystem \
            --execution-record evidence/executions/filesystem.json \
            --output evidence/report.json
      - name: Upload filesystem-contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: filesystem-${{ matrix.lock_id }}-${{ github.run_id }}
          path: |
            filesystem-junit.xml
            evidence/
          if-no-files-found: error
          retention-days: 90

  dotnet-generator:
    name: .NET artifact (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            operating_system: linux
            architecture: x64
            dotnet: "10.0.302"
            lock_id: linux-x64-py312
          - os: macos-15
            operating_system: macos
            architecture: arm64
            dotnet: "10.0.302"
            lock_id: macos-arm64-py312
          - os: windows-2025
            operating_system: windows
            architecture: x64
            dotnet: "10.0.302"
            lock_id: windows-x64-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev-${{ matrix.lock_id }}.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: python scripts/install_locked.py
      - name: Generate, restore, build, publish, and invoke exact .NET artifact
        run: >-
          python contracts/run_evidence_command.py
          --execution-id dotnet
          --result-file dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}.xml
          --output evidence/executions/dotnet.json
          -- python -m pytest tests/test_mcp_dotnet_generator.py tests/test_mcp_dotnet_runtime_contracts.py
          --junitxml=dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}.xml
      - name: Write machine-bound .NET evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_SUBJECT: ${{ matrix.operating_system }}|${{ matrix.architecture }}|dotnet|${{ matrix.dotnet }}|dotnet-compatibility
        run: |
          set -euo pipefail
          python contracts/write_evidence_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --tested-checkout-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event "$GITHUB_EVENT_NAME" \
            --job-name ".NET artifact (${{ matrix.os }})" \
            --lane dotnet-compatibility \
            --claims-profile mcp-dotnet \
            --dynamic-kind compatibility \
            --dynamic-subject "$EVIDENCE_SUBJECT" \
            --dynamic-execution-id dotnet \
            --dynamic-operating-system "${{ matrix.operating_system }}" \
            --dynamic-architecture "${{ matrix.architecture }}" \
            --dynamic-runtime dotnet \
            --dynamic-version "${{ matrix.dotnet }}" \
            --dynamic-lane dotnet-compatibility \
            --execution-record evidence/executions/dotnet.json \
            --output evidence/report.json
      - name: Upload .NET artifact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            dotnet-${{ matrix.operating_system }}-${{ matrix.architecture }}.xml
            evidence/
          if-no-files-found: error
          retention-days: 90

  python-container-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Build non-root generated image and invoke through official MCP client
        run: >-
          python contracts/run_evidence_command.py
          --execution-id container
          --result-file python-container.xml
          --output evidence/executions/container.json
          -- python -m pytest tests/test_mcp_generator.py -m container --junitxml=python-container.xml
      - name: Write machine-bound container evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python contracts/write_evidence_report.py \
            --repository "$GITHUB_REPOSITORY" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --tested-checkout-sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --workflow-path .github/workflows/ci.yml \
            --workflow-name CI \
            --event "$GITHUB_EVENT_NAME" \
            --job-name python-container-artifact \
            --lane docker-artifact \
            --claims-profile mcp-container \
            --dynamic-kind compatibility \
            --dynamic-subject "linux|x64|python|3.12|docker-artifact" \
            --dynamic-execution-id container \
            --dynamic-operating-system linux \
            --dynamic-architecture x64 \
            --dynamic-runtime python \
            --dynamic-version 3.12 \
            --dynamic-lane docker-artifact \
            --execution-record evidence/executions/container.json \
            --output evidence/report.json
      - name: Upload container-artifact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-container-${{ github.run_id }}
          path: |
            python-container.xml
            evidence/
          if-no-files-found: error
          retention-days: 90
