name: Verify MCP 2 static-resource migration

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: verify-mcp2-static-resource-migration
  cancel-in-progress: true

jobs:
  aggregate:
    name: Verify complete dependency patch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact branch revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64
      - name: Download previously verified cross-platform locks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30772302279
          pattern: locks-*
          path: lock-artifacts
          merge-multiple: true
      - name: Assemble final production tree
        shell: bash
        env:
          RESTORE_PRODUCTION_CI: "1"
        run: |
          set -euo pipefail
          cp -R lock-artifacts/. .
          python .github/scripts/fix_refresh_helper_source.py
          python .github/scripts/refresh_dependency_set.py
          rm .github/scripts/fix_refresh_helper_source.py
          rm .github/scripts/refresh_dependency_set.py
          git add -A
      - name: Install refreshed locked development graph
        run: python scripts/install_locked.py
      - name: Execute complete repository gate
        run: python scripts/ci.py
      - name: Verify selected versions and MCP v2 migration
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_lock_contract.py \
            tests/test_ci_quality_scope.py \
            tests/test_repository_hygiene.py
          git diff --check
          grep -q 'mcp==2.0.0' requirements-dev.in
          grep -q 'mcp>=2.0.0,<3' skills/mcp-server-architect/tools/generate_python_server.py
          grep -q 'from mcp.server.mcpserver import Context, MCPServer' skills/mcp-server-architect/tools/generate_python_server_impl.py
          grep -q 'from mcp.client import Client' skills/mcp-server-architect/tools/generate_python_server_impl.py
          grep -q 'async def capability_catalog() -> str:' skills/mcp-server-architect/tools/generate_python_server_impl.py
          grep -q 'async def readiness() -> str:' skills/mcp-server-architect/tools/generate_python_server_impl.py
          ! grep -q 'async def capability_catalog(ctx:' skills/mcp-server-architect/tools/generate_python_server_impl.py
          ! grep -q 'async def readiness(ctx:' skills/mcp-server-architect/tools/generate_python_server_impl.py
          ! grep -q 'mcp.server.fastmcp' skills/mcp-server-architect/tools/generate_python_server_impl.py
          grep -q 'ruff==0.16.0' requirements-dev.in
          grep -q 'types-PyYAML==6.0.12.20260724' requirements-dev.in
          grep -q 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/ci.yml
          grep -q 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97' .github/workflows/ci.yml
          grep -q 'actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68' .github/workflows/ci.yml
          test ! -e .github/scripts/fix_refresh_helper_source.py
          test ! -e .github/scripts/refresh_dependency_set.py
      - name: Build auditable final tree and binary patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --cached --binary > dependency-refresh.patch
          test -s dependency-refresh.patch
          git diff --cached --name-status > dependency-refresh-files.txt
          git diff --cached --name-only --diff-filter=D > deleted-files.txt
          git rev-parse HEAD > dependency-refresh-base.txt
          sha256sum dependency-refresh.patch > dependency-refresh.sha256
          mkdir -p final-tree
          while IFS= read -r -d '' path; do
            mkdir -p "final-tree/$(dirname "$path")"
            cp "$path" "final-tree/$path"
          done < <(git diff --cached --name-only --diff-filter=ACMRT -z)
      - name: Upload verified dependency tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-dependency-refresh-${{ github.run_id }}
          path: |
            final-tree/
            deleted-files.txt
            dependency-refresh.patch
            dependency-refresh-files.txt
            dependency-refresh-base.txt
            dependency-refresh.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
