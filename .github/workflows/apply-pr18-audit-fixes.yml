name: Verify PR18 audit fixes

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/agents-md-architect'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify and apply reviewed patches
        run: |
          set -euo pipefail
          cat .github/scripts/pr18-audit-fixes.part* > /tmp/pr18-audit-fixes.patch
          echo '1cfcb47ecf60763464a2565cd98af7b9183ecd1a083db5d59c7b89dc2789d0bd  /tmp/pr18-audit-fixes.patch' | sha256sum --check
          git apply --check /tmp/pr18-audit-fixes.patch
          git apply /tmp/pr18-audit-fixes.patch
          python .github/scripts/pr18-audit-followup.py
          python .github/scripts/pr18-audit-followup-fixture.py
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            skills/agents-md-architect/tools/agents_md_parse.py \
            skills/agents-md-architect/tools/agents_md_shell_evidence.py \
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py \
            skills/agents-md-architect/tools/audit_agents_md.py \
            tests/test_agents_md_latest_review.py \
            tests/test_agents_md_validator.py | sort)"

      - name: Install locked development dependencies
        run: python scripts/install_locked.py

      - name: Format, lint, and test the production diff
        run: |
          set -euo pipefail
          files=(
            skills/agents-md-architect/tools/agents_md_parse.py
            skills/agents-md-architect/tools/agents_md_shell_evidence.py
            skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
            skills/agents-md-architect/tools/audit_agents_md.py
            tests/test_agents_md_latest_review.py
            tests/test_agents_md_validator.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m compileall -q contracts scripts skills
          python -m pytest -q \
            tests/test_agents_md_latest_review.py \
            tests/test_agents_md_validator.py \
            tests/test_agents_md_command_argv.py \
            tests/test_agents_md_release_contract.py
          python skills/agents-md-architect/tools/validate_agents_md.py \
            --strict --repository-root . --layout single --profile application --language en AGENTS.md
          python skills/agents-md-architect/tools/audit_agents_md.py \
            --strict --layout single --profile application --language en .
          git diff --check

      - name: Stage verified production files
        run: |
          set -euo pipefail
          root=.verified-pr18
          rm -rf "$root"
          while IFS= read -r path; do
            mkdir -p "$root/$(dirname "$path")"
            cp "$path" "$root/$path"
          done <<'PATHS'
          skills/agents-md-architect/tools/agents_md_parse.py
          skills/agents-md-architect/tools/agents_md_shell_evidence.py
          skills/agents-md-architect/tools/agents_md_shell_evidence_impl.py
          skills/agents-md-architect/tools/audit_agents_md.py
          tests/test_agents_md_latest_review.py
          tests/test_agents_md_validator.py
          PATHS
          printf '%s\n' \
            "source_head=${{ github.event.pull_request.head.sha }}" \
            'base_production_head=dc491caa785c9df76d02e5d33bfcba464eb46de0' \
            'main_patch_sha256=1cfcb47ecf60763464a2565cd98af7b9183ecd1a083db5d59c7b89dc2789d0bd' \
            > "$root/MANIFEST.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"

      - name: Upload verified production files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr18-audit-fixes-${{ github.event.pull_request.head.sha }}
          path: .verified-pr18
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
