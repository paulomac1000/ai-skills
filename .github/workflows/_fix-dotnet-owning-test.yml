name: Fix .NET owning-file assertion

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_fix-dotnet-owning-test.yml

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply exact owning-file correction
        shell: python
        run: |
          from pathlib import Path
          path = Path("tests/test_mcp_dotnet_generator.py")
          source = path.read_text(encoding="utf-8")
          old = '''    for token in (
                  "ClaimsPrincipal? principal",
                  "UseStructuredContent = true",
                  "OutputSchemaType",
                  "throw new McpException",
              ):
                  assert token in tools

              for token in ("expectedVersion", "writes are disabled by operator policy", "record.Principal"):
                  assert token in kernel
          '''
          new = '''    for token in (
                  "ClaimsPrincipal? principal",
                  "UseStructuredContent = true",
                  "OutputSchemaType",
              ):
                  assert token in tools

              for token in (
                  "expectedVersion",
                  "writes are disabled by operator policy",
                  "record.Principal",
                  "throw new McpException",
              ):
                  assert token in kernel
          '''
          if source.count(old) != 1:
              raise SystemExit("expected owning-file assertion block was not found exactly once")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
      - run: python -m ruff format tests/test_mcp_dotnet_generator.py
      - run: python -m ruff check tests/test_mcp_dotnet_generator.py
      - run: python -m ruff format --check tests/test_mcp_dotnet_generator.py
      - run: python -m pytest tests/test_mcp_dotnet_generator.py::test_generated_project_uses_public_sdk_and_fail_closed_controls -q

  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Apply, verify, and publish exact correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_mcp_dotnet_generator.py")
          source = path.read_text(encoding="utf-8")
          old = '''    for token in (
                  "ClaimsPrincipal? principal",
                  "UseStructuredContent = true",
                  "OutputSchemaType",
                  "throw new McpException",
              ):
                  assert token in tools

              for token in ("expectedVersion", "writes are disabled by operator policy", "record.Principal"):
                  assert token in kernel
          '''
          new = '''    for token in (
                  "ClaimsPrincipal? principal",
                  "UseStructuredContent = true",
                  "OutputSchemaType",
              ):
                  assert token in tools

              for token in (
                  "expectedVersion",
                  "writes are disabled by operator policy",
                  "record.Principal",
                  "throw new McpException",
              ):
                  assert token in kernel
          '''
          if source.count(old) != 1:
              raise SystemExit("expected owning-file assertion block was not found exactly once")
          path.write_text(source.replace(old, new), encoding="utf-8", newline="\n")
          PY
          python -m ruff format tests/test_mcp_dotnet_generator.py
          python -m ruff check tests/test_mcp_dotnet_generator.py
          python -m ruff format --check tests/test_mcp_dotnet_generator.py
          python -m pytest tests/test_mcp_dotnet_generator.py::test_generated_project_uses_public_sdk_and_fail_closed_controls -q
          git add tests/test_mcp_dotnet_generator.py
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git config user.name ai-skills-audit-bot
          git config user.email ai-skills-audit-bot@users.noreply.github.com
          git commit -m "test: bind .NET exception assertion to owning kernel"
          test "$(git rev-parse HEAD^)" = "$PARENT_SHA"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push \
            --force-with-lease=refs/heads/refactor/skills-cleanup:${PARENT_SHA} \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/refactor/skills-cleanup
