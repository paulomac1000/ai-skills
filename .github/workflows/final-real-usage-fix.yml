name: Final real-usage fix

on:
  push:
    branches:
      - fix/unified-contract-release-hardening
    paths:
      - .github/workflows/final-real-usage-fix.yml
      - scripts/final_real_usage_fix.py

permissions:
  contents: write

concurrency:
  group: final-real-usage-fix
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py313.lock
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.302"
      - name: Install reviewed dependency graph
        run: python -m pip install --require-hashes -r requirements-dev-linux-x64-py313.lock
      - name: Apply exact-head fixes
        run: python scripts/final_real_usage_fix.py
      - name: Remove one-shot machinery and stage final tree
        run: |
          git rm -f .github/workflows/final-real-usage-fix.yml scripts/final_real_usage_fix.py
          git add -A
      - name: Format and run focused regressions
        run: |
          python -m ruff check --fix contracts skills tests scripts
          python -m ruff format contracts skills tests scripts
          python -m ruff check contracts skills tests scripts
          git add -A
          python -m pytest -q tests/test_real_usage_hardening.py tests/test_run_evidence_command.py tests/test_mcp_generator.py -m "not container"
      - name: Run complete repository gate
        run: python scripts/ci.py
      - name: Run immutable real-consumer source canaries
        run: >-
          python skills/mcp-server-architect/tools/check_consumer_canaries.py
          --catalog contracts/consumer-canaries.yaml
          --workspace "${RUNNER_TEMP}/ai-skills-consumer-canaries"
      - name: Run generated Python container gate
        run: python -m pytest -q tests/test_mcp_generator.py -m container
      - name: Verify final tree
        run: |
          test "$(find .github/workflows -maxdepth 1 -type f | sort)" = ".github/workflows/ci.yml"
          git diff --check
          git status --short
      - name: Commit and push exact tested tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "fix: close hosted real-usage regressions"
          git push origin HEAD:fix/unified-contract-release-hardening
