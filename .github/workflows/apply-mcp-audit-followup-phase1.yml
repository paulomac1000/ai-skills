name: Materialize MCP audit migration source

on:
  push:
    branches: ["agent/fix-contract-consistency"]
    paths:
      - ".phase1/apply.py.gz"
      - ".github/workflows/apply-mcp-audit-followup-phase1.yml"

permissions:
  contents: write

concurrency:
  group: materialize-mcp-audit-migration-source
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/fix-contract-consistency
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize and syntax-check reviewed source
        shell: bash
        run: |
          set -euo pipefail
          gzip --test .phase1/apply.py.gz
          gzip --decompress --stdout .phase1/apply.py.gz > .phase1/apply.py
          python -m py_compile .phase1/apply.py
      - name: Commit reviewable source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase1/apply.py
          git diff --cached --check
          git commit -m "chore: expose MCP migration source for review"
          git push origin HEAD:agent/fix-contract-consistency
