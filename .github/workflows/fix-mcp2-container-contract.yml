name: Stage verified MCP 2 container contract fix

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/fix-mcp2-container-contract.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: stage-mcp2-container-contract-fix
  cancel-in-progress: true

jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - name: Install exact locked development graph
        run: python scripts/install_locked.py
      - name: Migrate container assertions to MCP SDK v2 fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_mcp_generator.py")
          text = path.read_text(encoding="utf-8")
          assert text.count("result.isError") == 1
          assert text.count("denied.isError") == 1
          text = text.replace("result.isError", "result.is_error")
          text = text.replace("denied.isError", "denied.is_error")
          path.write_text(text, encoding="utf-8", newline="")
          PY
          python -m ruff format tests/test_mcp_generator.py
          python -m ruff check tests/test_mcp_generator.py
          grep -q 'result.is_error is not True' tests/test_mcp_generator.py
          grep -q 'denied.is_error is True' tests/test_mcp_generator.py
          ! grep -q '\.isError' tests/test_mcp_generator.py
      - name: Execute complete local gate
        run: python scripts/ci.py
      - name: Build and invoke generated non-root MCP container
        run: python -m pytest -q tests/test_mcp_generator.py -m container
      - name: Stage exact verified test blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-final
          cp tests/test_mcp_generator.py .ci-final/test_mcp_generator.py
          sha256sum .ci-final/test_mcp_generator.py > .ci-final/test_mcp_generator.sha256
      - name: Commit neutral staging files only
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-final/test_mcp_generator.py .ci-final/test_mcp_generator.sha256
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' .ci-final/test_mcp_generator.py .ci-final/test_mcp_generator.sha256 | sort)"
          git commit -m "test(mcp): stage verified SDK v2 container assertions"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
