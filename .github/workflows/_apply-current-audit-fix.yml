name: Apply current audit fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/current-audit-fix.py
      - .github/workflows/_apply-current-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-current-audit-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-verify-and-clean:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/skills-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.302'
      - run: python scripts/install_locked.py
      - name: Align the staged documentation patch with the current file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/current-audit-fix.py')
          source = path.read_text(encoding='utf-8')
          marker = 'replace_once(\n    "contracts/README.md",'
          cleanup = 'Path(".github/current-audit-fix.py").unlink()'
          start = source.index(marker)
          end = source.index(cleanup)
          replacement = '''replace_once(
              "contracts/README.md",
              ''' + repr('Claims are not accepted from a free-form `passed` JSON value. Each claim must name the command, select one or more test cases, and bind to the SHA-256 digest of the uploaded JUnit file that contains those passed cases. The report records `source_head_sha`, `tested_checkout_sha`, optional `merge_sha`, provider `head_sha`, producer identity, result summaries, result digests, command digests, test-case identities, and exit status.\n') + ''',
              ''' + repr('Claims are not accepted from a free-form `passed` JSON value. Each claim must name the command, select one or more test cases, and bind to the SHA-256 digest of the uploaded JUnit file that contains those passed cases. Test-case identities are verified only inside the result digests cited by that claim. The report records `source_head_sha`, `tested_checkout_sha`, provider `head_sha`, producer identity, result summaries, result digests, command digests, test-case identities, and exit status. Schema v2 reserves `merge_sha` as `null` until a provider adapter can independently prove the synthetic merge commit.\n') + ''',
          )
          replace_once(
              "contracts/README.md",
              ''' + repr('  --merge-sha "$GITHUB_SHA" \\\n') + ''',
              "",
          )

          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8', newline='\n')
          PY
      - name: Apply audited changes
        run: python .github/current-audit-fix.py
      - name: Format and verify repository
        shell: bash
        run: |
          python -m ruff format contracts/evidence.py contracts/write_evidence_report.py tests/test_evidence_verifier.py tests/test_write_evidence_report.py tests/test_mcp_generator.py
          git diff --check
          python scripts/ci.py
      - name: Commit clean verified tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/current-audit-fix.py
          test ! -e .github/workflows/_apply-current-audit-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind evidence to exact executed results'
          git push origin HEAD:${{ github.head_ref }}
