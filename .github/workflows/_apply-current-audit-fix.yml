name: Apply current audit fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/current-audit-fix.py
      - .github/workflows/_apply-current-audit-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-current-audit-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-verify-and-clean:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'refactor/skills-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: '10.0.302'
      - run: python scripts/install_locked.py
      - name: Align staged patch and retain helpers for connector cleanup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-skills-audit-originals
          cp .github/current-audit-fix.py /tmp/ai-skills-audit-originals/current-audit-fix.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/current-audit-fix.py')
          source = path.read_text(encoding='utf-8')
          marker = 'replace_once(\n    "contracts/README.md",'
          cleanup = 'Path(".github/current-audit-fix.py").unlink()'
          start = source.index(marker)
          end = source.index(cleanup)
          replacement = '''replace_once(
              "contracts/README.md",
              ''' + repr('Claims are not accepted from a free-form `passed` JSON value. Each claim must name the command, select one or more test cases, and bind to the SHA-256 digest of the uploaded JUnit file that contains those passed cases. The report records `source_head_sha`, `tested_checkout_sha`, optional `merge_sha`, provider `head_sha`, producer identity, result summaries, result digests, command digests, test-case identities, and exit status.\n') + ''',
              ''' + repr('Claims are not accepted from a free-form `passed` JSON value. Each claim must name the command, select one or more test cases, and bind to the SHA-256 digest of the uploaded JUnit file that contains those passed cases. Test-case identities are verified only inside the result digests cited by that claim. The report records `source_head_sha`, `tested_checkout_sha`, provider `head_sha`, producer identity, result summaries, result digests, command digests, test-case identities, and exit status. Schema v2 reserves `merge_sha` as `null` until a provider adapter can independently prove the synthetic merge commit.\n') + ''',
          )
          replace_once(
              "contracts/README.md",
              ''' + repr('  --merge-sha "$GITHUB_SHA" \\\n') + ''',
              "",
          )

          '''
          path.write_text(source[:start] + replacement, encoding='utf-8', newline='\n')
          PY
      - name: Apply audited changes
        shell: bash
        run: |
          set -euo pipefail
          python .github/current-audit-fix.py
          cp /tmp/ai-skills-audit-originals/current-audit-fix.py .github/current-audit-fix.py
      - name: Format and verify clean production tree
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format contracts/evidence.py contracts/write_evidence_report.py tests/test_evidence_verifier.py tests/test_write_evidence_report.py tests/test_mcp_generator.py
          mkdir -p /tmp/ai-skills-audit-helpers
          mv .github/current-audit-fix.py /tmp/ai-skills-audit-helpers/current-audit-fix.py
          mv .github/workflows/_apply-current-audit-fix.yml /tmp/ai-skills-audit-helpers/apply-current-audit-fix.yml
          restore_helpers() {
            mv /tmp/ai-skills-audit-helpers/current-audit-fix.py .github/current-audit-fix.py
            mv /tmp/ai-skills-audit-helpers/apply-current-audit-fix.yml .github/workflows/_apply-current-audit-fix.yml
          }
          trap restore_helpers EXIT
          git diff --check
          python scripts/ci.py
          restore_helpers
          trap - EXIT
      - name: Verify helper files are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -e .github/current-audit-fix.py
          test -e .github/workflows/_apply-current-audit-fix.yml
          git diff --exit-code -- .github/current-audit-fix.py .github/workflows/_apply-current-audit-fix.yml
      - name: Create verified code commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bind evidence to exact executed results'
          git rev-parse HEAD > verified-commit-sha.txt
      - name: Push verified code commit
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git push origin HEAD:${{ github.head_ref }} > push.log 2>&1
          status=$?
          echo "$status" > push-status.txt
          cat push.log
          exit "$status"
      - name: Upload publication diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-publication-${{ github.run_id }}
          path: |
            verified-commit-sha.txt
            push.log
            push-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Enforce publication outcome
        if: always()
        shell: bash
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: test "$PUBLISH_OUTCOME" = success
