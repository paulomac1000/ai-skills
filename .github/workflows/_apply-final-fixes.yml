name: Verify and materialize final audit fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/_apply-final-fixes.yml

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: x64
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5
        with:
          dotnet-version: "10.0.302"
      - name: Apply reviewed code patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-code.patch.part{00..07} > /tmp/final-code.patch.gz.b64
          test "$(wc -c < /tmp/final-code.patch.gz.b64)" -eq 52088
          base64 -d /tmp/final-code.patch.gz.b64 > /tmp/final-code.patch.gz
          printf '%s  %s\n' 99c77e28a69499c8b4f5b7dd9ee5e5452581369496fa05102650ae45f7fd9f4e /tmp/final-code.patch.gz | sha256sum --check --strict
          gzip -dc /tmp/final-code.patch.gz > /tmp/final-code.patch
          git apply --index --binary /tmp/final-code.patch
      - name: Download exact native lock artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zipfile import ZipFile
          import json
          import os

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          generated_revision = "c93a728e572ad9260555707cd46d0a6db42ca09f"
          artifacts = {
              "linux-x64-py312": (8602866324, "sha256:3c0c75f2cc49d2c4a3f53604abd3504987152ffa753b105a9a0cc479ba6e1b6c"),
              "linux-x64-py313": (8602853663, "sha256:f318a2f6d9b401b8b9cbb4e7f0ddd89be2011a231d782976aaf5111e0fddc6df"),
              "linux-x64-py314": (8602860005, "sha256:df3ff7d3b9d0858770da223daceb1b23f58940c56f6b005775db814130746e06"),
              "macos-arm64-py312": (8602859605, "sha256:09d29193580287dedc3f354e967121f7a58fa40e7e9be78dc677afb891031df1"),
              "windows-x64-py312": (8602875685, "sha256:3d1a6c056d051f396b37307eccb9ceb03335f0c16003d771b0306cc40d1bee93"),
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ai-skills-final-materializer",
          }
          for lock_id, (artifact_id, expected_digest) in artifacts.items():
              metadata_url = f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}"
              with urlopen(Request(metadata_url, headers=headers), timeout=30) as response:
                  metadata = json.load(response)
              if metadata.get("expired") is True or metadata.get("digest") != expected_digest:
                  raise SystemExit(f"artifact metadata mismatch: {lock_id}")
              workflow_run = metadata.get("workflow_run") or {}
              if workflow_run.get("head_sha") != generated_revision:
                  raise SystemExit(f"artifact revision mismatch: {lock_id}")
              download_url = f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}/zip"
              with urlopen(Request(download_url, headers=headers), timeout=60) as response:
                  archive = response.read()
              observed = "sha256:" + sha256(archive).hexdigest()
              if observed != expected_digest:
                  raise SystemExit(f"downloaded artifact digest mismatch: {lock_id}: {observed}")
              expected_names = {
                  f"requirements-dev-{lock_id}.lock",
                  f"runtime-{lock_id}.lock",
                  f"dev-{lock_id}.lock",
              }
              with ZipFile(BytesIO(archive)) as zip_file:
                  names = {name for name in zip_file.namelist() if not name.endswith("/")}
                  if names != expected_names:
                      raise SystemExit(f"artifact file set mismatch: {lock_id}: {sorted(names)}")
                  for name in sorted(names):
                      data = zip_file.read(name).decode("utf-8").replace("\r\n", "\n").encode("utf-8")
                      target = Path(name) if name.startswith("requirements-dev-") else Path("skills/mcp-server-architect/locks") / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
          PY
          rm -f requirements-dev-linux.lock requirements-dev-macos.lock requirements-dev-windows.lock
          rm -f skills/mcp-server-architect/locks/{runtime,dev}-{linux,macos,windows}.lock
          rm -f .github/workflows/_audit-export.yml .github/workflows/_audit-export-pr.yml
          rm -f .github/workflows/_generate-target-locks.yml .github/workflows/_apply-final-fixes.yml
          rm -f .github/final-code.patch.gz.b64 .github/final-code.patch.part{00..07}
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "7ab39e0764fc3b0d54f10acd4f947a1c1134c27a"
      - name: Install exact development graph
        run: python scripts/install_locked.py
      - name: Run complete local gate
        run: python scripts/ci.py
      - name: Create verified clean commit object
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          import json
          import os
          import subprocess
          import time

          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          parent = os.environ["PARENT_SHA"]
          expected_tree = "7ab39e0764fc3b0d54f10acd4f947a1c1134c27a"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "ai-skills-final-materializer",
          }

          def post(path: str, payload: object) -> dict[str, object]:
              body = json.dumps(payload, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              request = Request(
                  f"https://api.github.com/repos/{repository}{path}",
                  data=body,
                  headers=headers,
                  method="POST",
              )
              for attempt in range(6):
                  try:
                      with urlopen(request, timeout=120) as response:
                          result = json.load(response)
                      if not isinstance(result, dict):
                          raise RuntimeError("GitHub API returned a non-object")
                      return result
                  except HTTPError as exc:
                      if exc.code not in {403, 409, 422, 429, 500, 502, 503, 504} or attempt == 5:
                          raise
                      time.sleep(min(2 ** attempt, 20))
              raise RuntimeError("unreachable")

          entries = []
          output = subprocess.check_output(["git", "ls-files", "-s"], text=True)
          for line in output.splitlines():
              mode, _blob, _stage, path = line.split(None, 3)
              content = Path(path).read_text(encoding="utf-8")
              entries.append({"path": path, "mode": mode, "type": "blob", "content": content})
          tree = post("/git/trees", {"tree": entries})
          tree_sha = str(tree.get("sha") or "")
          local_tree = subprocess.check_output(["git", "write-tree"], text=True).strip()
          if tree_sha != expected_tree or local_tree != expected_tree:
              raise SystemExit(f"tree mismatch: api={tree_sha} local={local_tree} expected={expected_tree}")
          commit = post(
              "/git/commits",
              {
                  "message": "fix: verify production adoption evidence",
                  "tree": tree_sha,
                  "parents": [parent],
              },
          )
          commit_sha = str(commit.get("sha") or "")
          if len(commit_sha) != 40:
              raise SystemExit("GitHub did not return a commit SHA")
          Path("final-commit.txt").write_text(
              f"commit={commit_sha}\ntree={tree_sha}\nparent={parent}\n",
              encoding="utf-8",
          )
          print(commit_sha)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: final-audit-fix-commit-${{ github.run_id }}
          path: final-commit.txt
          if-no-files-found: error
          retention-days: 1
