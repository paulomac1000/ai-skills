name: Format AGENTS tools

on:
  pull_request:
    paths:
      - .github/workflows/format-agents-tools.yml
      - skills/agents-md-architect/tools/**

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev-linux-x64-py312.lock
      - run: python scripts/install_locked.py
      - name: Format AGENTS tools
        run: python -m ruff format skills/agents-md-architect/tools
      - name: Upload formatted tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-agents-tools-${{ github.run_id }}
          path: skills/agents-md-architect/tools/*.py
          if-no-files-found: error
          retention-days: 1
