version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tooling:
        patterns: ["*"]
  - package-ecosystem: nuget
    directory: /examples/dotnet-mcp-reference-lab
    schedule:
      interval: weekly
    groups:
      dotnet-mcp:
        patterns:
          - "ModelContextProtocol*"
          - "Microsoft.Extensions.*"
      dotnet-testing:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
