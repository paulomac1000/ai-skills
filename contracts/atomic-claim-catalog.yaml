schema_version: 1
catalog_version: 1.10.0
controls:
  - id: cicd.mcp.protocol-conformance
    parent_rule_id: cicd.quality.language
    skill: ci-cd-architect
    source: skills/ci-cd-architect/STANDARD.md#mcp-specific-assurance
    description: Hosted CI executes revision-specific MCP protocol tests through an official client for every claimed transport and protocol era.
    applies_when: {maturity_at_least: L2, profiles_any: [mcp]}
    severity: blocking
    waivable: false
    required_evidence: [official-client, integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_cicd_mcp_claims_are_independent]
  - id: cicd.mcp.artifact-smoke
    parent_rule_id: cicd.quality.language
    skill: ci-cd-architect
    source: skills/ci-cd-architect/STANDARD.md#mcp-specific-assurance
    description: Hosted CI installs or starts the exact built MCP artifact and executes its public transport contract without importing from the source checkout.
    applies_when: {maturity_at_least: L2, profiles_any: [mcp, packaged, container]}
    severity: blocking
    waivable: false
    required_evidence: [artifact, official-client]
    test_selectors: [tests/test_atomic_claim_contract.py::test_cicd_mcp_claims_are_independent]
  - id: cicd.publication.exact-authority
    parent_rule_id: cicd.publication.exact-lease
    skill: ci-cd-architect
    source: skills/ci-cd-architect/references/artifact-publication-lease.md#exact-authority-envelope
    description: Artifact publication requires current exact one-shot authority for the already-proven artifact and bounded destination scope; reservation consumes the lease and ambiguous provider outcomes reconcile authoritative destination state before any new authority.
    applies_when: {maturity_at_least: L2, capabilities_any: [artifact-publication]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration, security]
    test_selectors:
      - tests/test_artifact_publication_lease.py::test_producer_or_generic_credentials_do_not_mint_publication_authority
      - tests/test_artifact_publication_lease.py::test_exact_artifact_and_destination_scope_cannot_be_widened_or_rebuilt
      - tests/test_artifact_publication_lease.py::test_same_artifact_converges_without_dispatch_but_different_artifact_conflicts
      - tests/test_artifact_publication_lease.py::test_ambiguous_or_conflict_dispatch_requires_authoritative_readback
      - tests/test_artifact_publication_lease.py::test_mutable_channel_movement_records_before_and_after_exact_artifact_identity
  - id: cicd.deployment.target-fence
    parent_rule_id: cicd.deployment.fenced-lease
    skill: ci-cd-architect
    source: skills/ci-cd-architect/STANDARD.md#deployment-mutation-authority-and-fencing
    description: A target-fenced deployment revalidates authority plus exact expected target state, atomically reserves one mutation domain, advances the fence after mutation, and keeps ambiguous external effects blocking conflicting handover.
    applies_when: {maturity_at_least: L2, capabilities_any: [deployment]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration, security]
    test_selectors:
      - tests/test_deployment_lease_fencing.py::test_concurrent_leases_same_domain_have_one_dispatch_winner
      - tests/test_deployment_lease_fencing.py::test_restart_unknown_delivery_and_rollback_race_stay_blocked
      - tests/test_deployment_lease_fencing.py::test_success_advances_fence_and_old_lease_is_stale
      - tests/test_deployment_lease_fencing.py::test_consumed_v2_lease_cannot_replay_after_no_effect_reconciliation
      - tests/test_deployment_lease_fencing.py::test_provider_cas_rejects_stale_provider_revision_before_dispatch
      - tests/test_deployment_lease_fencing.py::test_candidate_cannot_refresh_authority_and_runtime_evidence_never_mints_it
      - tests/test_deployment_lease_fencing.py::test_audit_projection_includes_resulting_target_without_secrets
  - id: mcp.runtime.isolation
    parent_rule_id: mcp.architecture.boundaries
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#core-architecture
    description: Application runtime policy, SDK compatibility, transports, and host lifecycle remain independently replaceable and testable.
    applies_when: {maturity_at_least: L1}
    severity: blocking
    waivable: false
    required_evidence: [unit]
    test_selectors: [tests/test_atomic_claim_contract.py::test_runtime_and_protocol_claims_are_separate]
  - id: mcp.control-plane.external-binding-ingress
    parent_rule_id: mcp.architecture.boundaries
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#canonical-control-plane-and-projections
    description: External bindings include the complete provider namespace and authenticated external events use provider/source-scoped durable dedup receipts that trigger current-state reconciliation instead of direct ordered transitions.
    applies_when: {maturity_at_least: L2, profiles_any: [external-upstream, multi-backend, gateway]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration]
    test_selectors:
      - tests/test_wave2_control_plane_invariants.py::test_provider_scoped_external_identity_separates_github_local_numbers_and_markers
      - tests/test_wave2_control_plane_invariants.py::test_event_ingress_deduplicates_and_reconciles_authoritative_state
      - tests/test_wave2_control_plane_invariants.py::test_event_ingress_fence_authority_and_restart_fail_closed
      - tests/test_wave2_control_plane_invariants.py::test_external_rebind_preserves_canonical_identity
  - id: mcp.control-plane.projection-field-ownership
    parent_rule_id: mcp.architecture.boundaries
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/projection-field-ownership.md#ownership-classes
    description: Writable projections classify semantic fields/namespaces by authority, admit external automation through exact field/action capabilities, treat confidence as evidence only, preserve shared regions, and fence externally started work from duplicate canonical execution.
    applies_when: {maturity_at_least: L2, profiles_any: [external-upstream, multi-backend, gateway]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration, security]
    test_selectors:
      - tests/test_projection_field_ownership.py::test_advisory_metadata_and_fake_priority_do_not_gain_authority
      - tests/test_projection_field_ownership.py::test_confidence_is_bounded_evidence_not_automation_authority
      - tests/test_projection_field_ownership.py::test_agent_assignment_is_external_execution_and_blocks_parallel_claim
      - tests/test_projection_field_ownership.py::test_shared_regions_preserve_external_enrichment_and_unknown_fields_fail_conservative
  - id: mcp.gateway.source-qualified-identity
    parent_rule_id: mcp.backends.identity
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#multi-backend-and-embedded-hosting
    description: Gateway re-export uses deterministic source-qualified canonical identities across discovery, invocation, task, and resource surfaces, preserves exact provenance/schema, and fails closed on collisions, stale mappings, or namespace confusion.
    applies_when: {maturity_at_least: L2, profiles_any: [multi-backend, gateway]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration, security]
    test_selectors:
      - tests/test_gateway_identity_contract.py::test_same_normalized_tool_name_is_source_qualified_across_surfaces
      - tests/test_gateway_identity_contract.py::test_collision_handling_is_order_health_case_and_truncation_independent
      - tests/test_gateway_identity_contract.py::test_resource_uri_overlap_stale_readd_and_namespace_escape_fail_closed
      - tests/test_gateway_identity_contract.py::test_stdio_child_environment_is_minimized_and_source_credentials_do_not_leak
  - id: mcp.protocol.current-revision
    parent_rule_id: mcp.sdk.compatibility-isolation
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/protocol-2026-07-28.md#dual-era-acceptance
    description: Each claimed protocol revision is exercised independently, and upstream package support is never recorded as repository-tested evidence.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: true
    required_evidence: [official-client, integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_runtime_and_protocol_claims_are_separate]
  - id: mcp.identity.local-principal
    parent_rule_id: mcp.identity.target-binding
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/principal-and-shell-boundaries.md#local-stdio-principal
    description: A local stdio deployment derives an explicit principal from a documented operating-system process boundary and never trusts model-supplied identity.
    applies_when: {maturity_at_least: L2, profiles_any: [local-stdio]}
    severity: blocking
    waivable: false
    required_evidence: [unit, security]
    test_selectors: [tests/test_atomic_claim_contract.py::test_local_and_remote_principal_claims_are_distinct]
  - id: mcp.identity.remote-principal
    parent_rule_id: mcp.identity.target-binding
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/principal-and-shell-boundaries.md#remote-principal
    description: Every remote request authenticates a request-scoped principal before target, backend, artifact, task, browser, or network resolution.
    applies_when: {maturity_at_least: L2, profiles_any: [remote-http]}
    severity: blocking
    waivable: false
    required_evidence: [integration, security]
    test_selectors: [tests/test_atomic_claim_contract.py::test_local_and_remote_principal_claims_are_distinct]
  - id: mcp.manifest.write-defaults
    parent_rule_id: mcp.manifest.complete
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#multi-axis-safety-classification
    description: Write and destructive capability factories default retryable, idempotent, and reversible flags to false and require explicit reviewed rationale before enabling them.
    applies_when: {maturity_at_least: L2, capabilities_any: [write, destructive]}
    severity: blocking
    waivable: false
    required_evidence: [unit, security]
    test_selectors: [tests/test_atomic_claim_contract.py::test_write_flags_and_confirmation_are_fail_closed]
  - id: mcp.authorization.confirmation-enforced
    parent_rule_id: mcp.authorization.server-side
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/principal-and-shell-boundaries.md#confirmation-enforcement
    description: Confirmation metadata is registration-time policy backed by a server-verifiable approval record bound to principal, capability, target, arguments, and expiry.
    applies_when: {maturity_at_least: L2, capabilities_any: [write, destructive]}
    severity: blocking
    waivable: false
    required_evidence: [unit, security, integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_write_flags_and_confirmation_are_fail_closed]
  - id: mcp.shell.boundaries
    parent_rule_id: mcp.authorization.server-side
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/principal-and-shell-boundaries.md#shell-and-subprocess-boundary
    description: Agent-controlled values reaching SSH, subprocess, or shell boundaries use structured arguments, operation-specific parsing, bounded input, and adversarial no-dispatch tests.
    applies_when: {maturity_at_least: L2, capabilities_any: [ssh, subprocess, shell]}
    severity: blocking
    waivable: false
    required_evidence: [unit, security, integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_shell_boundary_adversarial_matrix_is_normative]
  - id: mcp.upstream.contract-observed
    parent_rule_id: mcp.verification.layered
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/upstream-contract-discovery.md#entry-gate
    description: External or legacy upstream behavior is discovered from controlled observations before adapter refactoring; inferred dialect assumptions cannot satisfy acceptance and mutation observations distinguish completion from identity and representation uncertainty.
    applies_when: {maturity_at_least: L1, profiles_any: [external-upstream, legacy-upstream]}
    severity: blocking
    waivable: false
    required_evidence: [integration]
    test_selectors: [tests/test_practical_consumer_feedback.py::test_atomic_controls_capture_practical_migration_failures]
  - id: mcp.testing.live-backend-safety
    parent_rule_id: mcp.verification.layered
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/upstream-contract-discovery.md#safe-live-probes
    description: Live-backend mutations are excluded by default and require independent operator opt-ins, delayed credential access, verified exclusive disposable-target identity before pre-clean or mutation, and an explicit captured-id, unique-namespace, or verified-baseline-difference cleanup strategy.
    applies_when: {maturity_at_least: L1, profiles_any: [live-backend]}
    severity: blocking
    waivable: false
    required_evidence: [integration, security]
    test_selectors: [tests/test_practical_consumer_feedback.py::test_atomic_controls_capture_practical_migration_failures]
  - id: mcp.authorization.transport-parity
    parent_rule_id: mcp.authorization.server-side
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#authentication-and-authorization
    description: Every advertised transport enforces the same operator gate, authorization, exact capability, target, and resource policy for representative write and destructive operations.
    applies_when: {maturity_at_least: L2, profiles_all: [local-stdio, remote-http], capabilities_any: [write, destructive]}
    severity: blocking
    waivable: false
    required_evidence: [integration, security, official-client]
    test_selectors: [tests/test_practical_consumer_feedback.py::test_atomic_controls_capture_practical_migration_failures]
  - id: mcp.response.protocol-error
    parent_rule_id: mcp.response.structured
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#data-errors-and-responses
    description: Protocol and application failures use deterministic error channels and never report a failed operation as a successful tool result.
    applies_when: {maturity_at_least: L1}
    severity: blocking
    waivable: false
    required_evidence: [unit, official-client]
    test_selectors: [tests/test_atomic_claim_contract.py::test_response_child_controls_are_independent]
  - id: mcp.response.output-bound
    parent_rule_id: mcp.response.structured
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#data-errors-and-responses
    description: The final serialized response, including metadata, envelopes, and encoding, remains within the declared byte bound.
    applies_when: {maturity_at_least: L1}
    severity: blocking
    waivable: false
    required_evidence: [unit, official-client]
    test_selectors: [tests/test_atomic_claim_contract.py::test_response_child_controls_are_independent]
  - id: mcp.response.provenance
    parent_rule_id: mcp.response.structured
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#data-errors-and-responses
    description: Responses preserve application-owned source, target, revision, and artifact provenance without trusting backend display labels.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: true
    required_evidence: [unit, integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_response_child_controls_are_independent]
  - id: mcp.response.confidentiality
    parent_rule_id: mcp.response.structured
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#data-errors-and-responses
    description: Public responses and errors omit secrets, credentials, internal paths, stack traces, and cross-principal data.
    applies_when: {maturity_at_least: L1}
    severity: blocking
    waivable: false
    required_evidence: [unit, security]
    test_selectors: [tests/test_atomic_claim_contract.py::test_response_child_controls_are_independent]
  - id: mcp.response.partial-state
    parent_rule_id: mcp.response.structured
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/upstream-contract-discovery.md#observed-facts
    description: Partial execution and unknown outcomes are explicit states with reconciliation information; confirmed success without an identity or representation is not relabeled as completion-unknown.
    applies_when: {maturity_at_least: L2, capabilities_any: [write, workflow, background-task]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_response_child_controls_are_independent]
  - id: mcp.browser.boundaries
    parent_rule_id: mcp.browser.profile-isolation
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#runtime-boundaries-artifacts-and-browser-automation
    description: Browser profile, download, navigation, credential, origin, and cleanup boundaries are independently authorized and confined.
    applies_when: {maturity_at_least: L2, capabilities_any: [browser-automation]}
    severity: blocking
    waivable: false
    required_evidence: [unit, security, artifact]
    test_selectors: [tests/test_atomic_claim_contract.py::test_backend_browser_and_lifecycle_claims_are_separate]
  - id: mcp.backends.confined
    parent_rule_id: mcp.backends.identity
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#multi-backend-and-embedded-hosting
    description: Backend selection is confined to configured identities and cannot redirect through model input, display names, ambient credentials, or cross-tenant aliases.
    applies_when: {maturity_at_least: L2, profiles_any: [multi-backend, gateway]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration, security]
    test_selectors: [tests/test_atomic_claim_contract.py::test_backend_browser_and_lifecycle_claims_are_separate]
  - id: mcp.lifecycle.readiness
    parent_rule_id: mcp.health.readiness
    skill: mcp-server-architect
    source: skills/mcp-server-architect/STANDARD.md#observability-and-operations
    description: Startup completion, liveness, readiness, dependency health, capability degradation, and shutdown ownership are separate observable states.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [integration]
    test_selectors: [tests/test_atomic_claim_contract.py::test_backend_browser_and_lifecycle_claims_are_separate]
  - id: mcp.artifact.multiarch-exact
    parent_rule_id: mcp.artifact.exact
    skill: mcp-server-architect
    source: skills/mcp-server-architect/references/multiarch-artifact-promotion.md#identity-model
    description: Every declared platform digest is tested once and the release promotes the unchanged OCI index digest composed from exactly those approved children.
    applies_when: {maturity_at_least: L2, profiles_any: [container, multi-arch]}
    severity: blocking
    waivable: false
    required_evidence: [artifact, review]
    test_selectors: [tests/test_atomic_claim_contract.py::test_multiarch_identity_is_an_immutable_graph]
  - id: steward.integration.exact-lease
    parent_rule_id: steward.integration.authorized
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/references/integration-lease.md#exact-authority-envelope
    description: Repository integration is authorized only by an exact one-shot lease; mutation admission revalidates candidate/base/evidence/policy/provider facts, durable reservation consumes the lease, and ambiguous delivery reconciles the same operation before any new authority.
    applies_when: {maturity_at_least: L2, capabilities_any: [repository-integration]}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration, security]
    test_selectors:
      - tests/test_integration_lease.py::test_push_writer_or_child_actor_cannot_mint_integration_authority
      - tests/test_integration_lease.py::test_candidate_base_tree_policy_and_evidence_drift_fail_closed
      - tests/test_integration_lease.py::test_timeout_requires_reconciliation_and_consumed_lease_cannot_replay
      - tests/test_integration_lease.py::test_squash_reconciliation_preserves_candidate_to_integrated_lineage
      - tests/test_integration_lease.py::test_used_revoked_expired_or_stale_evidence_cannot_dispatch
  - id: steward.delivery.ambiguous-reconcile
    parent_rule_id: steward.delivery.reconciled
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/STANDARD.md#external-operations-and-reconciliation
    description: Delivery-unknown state cannot authorize replay and must enter bounded reconciliation before any stateful resend.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration]
    test_selectors: [tests/test_mcp_steward_atomic.py::test_delivery_unknown_is_reconciliation_not_retry]
  - id: steward.lineage.current-publication
    parent_rule_id: steward.lineage.fenced
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/STANDARD.md#lineage-generations-attempts-and-leases
    description: Only the current lineage generation/current job may publish an actionable terminal handoff.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [unit]
    test_selectors: [tests/test_mcp_steward_atomic.py::test_stale_generation_handoff_cannot_be_actionable_before_digest_check]
  - id: steward.closure.production-path
    parent_rule_id: steward.closure.reachable
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/STANDARD.md#producer-reachability-and-liveness-closure
    description: Intended state-machine transitions have declared real production producers and non-terminal states cannot become ownerless/wakeup-less orphans.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration]
    test_selectors: [tests/test_mcp_steward_atomic.py::test_state_machine_v2_requires_production_reachability_and_liveness_closure]
  - id: steward.checkpoint.minimum-recompute
    parent_rule_id: steward.checkpoint.current
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/STANDARD.md#semantic-checkpoints-and-dependency-scoped-reuse
    description: Exact semantic dependency identity and workflow generation derive reusable/stale checkpoints, earliest safe resume, and the minimum recomputation set.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [unit, integration]
    test_selectors: [tests/test_mcp_steward_atomic.py::test_checkpoint_plan_reuses_current_artifacts_and_derives_minimum_recomputation]
  - id: steward.context.poisoning-boundary
    parent_rule_id: steward.context.provenance
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/STANDARD.md#persistent-context-provenance
    description: Cross-session context cannot self-promote authority/evidence; exact scope and dependency currentness gate deterministic trust-ordered reuse while stale, unknown, foreign-scope, and untrusted artifacts fail conservative.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [unit, security]
    test_selectors:
      - tests/test_persistent_context_provenance.py::test_persistence_never_upgrades_authority_or_untrusted_payload
      - tests/test_persistent_context_provenance.py::test_generation_and_policy_identity_invalidate_persistent_context
      - tests/test_persistent_context_provenance.py::test_fresh_session_assembly_is_deterministic_and_trust_ordered
      - tests/test_persistent_context_provenance.py::test_advisory_reuse_requires_scope_and_currentness
  - id: steward.credentials.no-privilege-failover
    parent_rule_id: steward.credentials.fail-closed
    skill: mcp-steward-architect
    source: skills/mcp-steward-architect/STANDARD.md#credentials-and-provider-failover
    description: Credential failover cannot bypass authorization/policy or turn ambiguous stateful delivery into a fresh submit.
    applies_when: {maturity_at_least: L2}
    severity: blocking
    waivable: false
    required_evidence: [unit, security]
    test_selectors: [tests/test_mcp_steward_atomic.py::test_manifest_composes_server_and_consumer_standards]
