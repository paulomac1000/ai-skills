schema_version: 1
catalog_version: 1.2.0
skills:
  afds-doc-writer:
    rules:
    - id: afds.metadata.required
      source: STANDARD.md#versioned-metadata-contract
      description: Governed documents provide valid, typed, stable metadata and rigor-specific verification.
    - id: afds.governance.profiled
      source: STANDARD.md#governance-profiles
      description: Validation profiles are selected by an explicit repository governance manifest rather than basenames.
    - id: afds.structure.links
      source: STANDARD.md#structure-and-links
      description: Structure, confined links, regular-file targets, and relative anchors pass the AFDS validator.
    - id: afds.evidence.uncertainty
      source: STANDARD.md#evidence-and-uncertainty
      description: Claims identify evidence, confidence, and unresolved uncertainty.
    - id: afds.ownership.lifecycle
      source: STANDARD.md#canonical-ownership-and-lifecycle
      description: Each rule has one canonical owner and an explicit lifecycle.
    - id: afds.quality.executable
      source: STANDARD.md#quality-gate
      description: The repository executes the governed-document quality gate.
    - id: afds.verification.recorded
      source: STANDARD.md#verification
      description: Verification commands and observed results are recorded.
  agents-md-architect:
    rules:
    - id: agents.scope.precedence
      source: STANDARD.md#scope-and-precedence
      description: Root, nested, user, and platform instructions have explicit scope and precedence.
    - id: agents.discovery.evidence
      source: STANDARD.md#repository-discovery
      description: Instructions are derived from current repository evidence and verified commands.
    - id: agents.modes.profiled
      source: STANDARD.md#operating-modes-and-profiles
      description: Work modes and the smallest applicable instruction profile bound agent behavior.
    - id: agents.ownership.boundaries
      source: STANDARD.md#canonical-ownership-and-architecture-boundaries
      description: Canonical owners and non-obvious architecture boundaries prevent duplicate current policy.
    - id: agents.safety.fail-closed
      source: STANDARD.md#safety-and-data-boundaries
      description: High-impact operations and protected data use explicit fail-closed boundaries and trusted approval.
    - id: agents.commands.executable
      source: STANDARD.md#commands-and-verification
      description: Commands are executable, current, and tied to observable verification.
    - id: agents.context.routed
      source: STANDARD.md#context-economy-and-routing
      description: Instructions route readers to canonical detail without duplicating entire standards.
    - id: agents.nested.locality
      source: STANDARD.md#nested-instructions
      description: Nested instruction files contain only local deltas and preserve parent requirements.
    - id: agents.drift.prevented
      source: STANDARD.md#anti-patterns-and-drift
      description: Instructions avoid stale snapshots, private shortcuts, and unverifiable guidance.
    - id: agents.completion.evidenced
      source: STANDARD.md#definition-of-done
      description: Completion is tied to commands, tests, evidence, and exact revision state.
  ci-cd-architect:
    rules:
    - id: cicd.layers.separated
      source: STANDARD.md#pipeline-layers
      description: CI, artifact verification, and release are separate trust layers.
    - id: cicd.workflow.least-privilege
      source: STANDARD.md#universal-workflow-controls
      description: Workflows use immutable dependencies, least privilege, explicit concurrency, and bounded jobs.
    - id: cicd.workflow.profiled
      source: STANDARD.md#workflow-policy-profiles
      description: Pull-request, trusted-CI, and protected-release workflows use explicit event-aware policy profiles.
    - id: cicd.quality.language
      source: STANDARD.md#python-quality
      description: Language quality checks are deterministic and blocking for supported source paths.
    - id: cicd.artifact.exact
      source: STANDARD.md#artifact-identity-and-smoke
      description: The exact built artifact is the artifact installed, smoked, attested, and released.
    - id: cicd.release.separated
      source: STANDARD.md#protected-release
      description: Protected release jobs do not execute untrusted candidate source and promote immutable artifacts.
    - id: cicd.evidence.bound
      source: STANDARD.md#evidence-and-acceptance
      description: Provider evidence binds exact revision, job, command, artifact, and report identity.
    - id: cicd.locks.reproducible
      source: STANDARD.md#dependency-locks-and-reproducibility
      description: Dependency graphs are exact, hashed, platform-scoped, and installed through hash verification.
  mcp-server-architect:
    rules:
    - id: mcp.capabilities.manifested
      source: STANDARD.md#capability-manifests-and-discovery
      description: Application-owned capabilities have canonical manifests and distinguish supported from active state.
    - id: mcp.identity.target
      source: STANDARD.md#target-and-principal-identity
      description: Principal and target identities are stable, verified, and rebound before side effects.
    - id: mcp.approval.bound
      source: STANDARD.md#approval-and-side-effect-boundaries
      description: Mutations require server-verifiable approval bound to principal, capability, target, arguments, and expiry.
    - id: mcp.retry.outcome
      source: STANDARD.md#retry-idempotency-and-ambiguous-outcomes
      description: Retry requires explicit idempotency and ambiguous mutation outcomes are not retried automatically.
    - id: mcp.responses.bounded
      source: STANDARD.md#response-and-provenance-contract
      description: Final serialized responses are bounded and preserve correlation, provenance, confidentiality, and retry guidance.
    - id: mcp.backends.confined
      source: STANDARD.md#backend-and-filesystem-confinement
      description: Backends enforce target, shell, path, symlink, and race boundaries before I/O.
    - id: mcp.lifecycle.readiness
      source: STANDARD.md#lifecycle-readiness-and-degradation
      description: Startup, liveness, readiness, dependency degradation, and active capability state are distinct.
    - id: mcp.protocol.compatibility
      source: STANDARD.md#protocol-and-sdk-compatibility
      description: Protocol revisions and SDK profiles are claimed only with exact package and transport evidence.
    - id: mcp.artifact.exact
      source: STANDARD.md#artifact-identity-and-release
      description: One exact application artifact is installed, smoked over advertised transports, and promoted without rebuild.
  mcp-server-consumer:
    rules:
    - id: consumer.discovery.bounded
      source: STANDARD.md#discovery-and-capability-selection
      description: Consumers perform bounded discovery and minimize capability disclosure.
    - id: consumer.trust.bound
      source: STANDARD.md#trusted-policy-and-capability-identity
      description: Trusted policy is bound to immutable server, tool, schema, manifest, target, and policy-source identity.
    - id: consumer.risk.monotonic
      source: STANDARD.md#risk-and-confirmation
      description: Untrusted metadata may only escalate risk, confirmation, confidentiality, or retry vetoes.
    - id: consumer.retry.compound
      source: STANDARD.md#retry-and-idempotency
      description: Retry requires agreement among trusted idempotency evidence, response classification, and retry policy.
    - id: consumer.responses.validated
      source: STANDARD.md#response-validation-and-provenance
      description: Consumers validate response structure, provenance, confidentiality, and partial-result semantics fail closed.
    - id: consumer.efficiency.bounded
      source: STANDARD.md#efficiency-pagination-and-batching
      description: Pagination, batching, and result retrieval remain bounded and explicit.
